[project]
name = "lextec-bridge-api"
version = "0.1.0"
description = "LexTec Bridge API - legal case intake, deterministic decision engine, expert briefing"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "google-genai>=1.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "defusedxml>=0.7",
  "jinja2>=3.1",
  "pypdf>=4.0",
  "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pymupdf>=1.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
per-file-ignores = { "alembic/**" = ["E402", "I001"] }

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
