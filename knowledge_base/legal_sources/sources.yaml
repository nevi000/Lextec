- id: BGE_135_III_345
  provider: bger
  type: case_law
  language: de
  title_de: BGE 135 III 345
  citation: BGE 135 III 345
  dossier_status: DOSSIER_PENDING
  verification_status: UNVERIFIED
  core_statement_de: 'Mangel = Vergleich des tatsächlichen mit dem vereinbarten Zustand; Verschulden der
    Vermieterschaft und Behebbarkeit sind nicht nötig; für eine Herabsetzung muss der Gebrauch um mindestens
    5 % eingeschränkt sein, bei dauernder Beeinträchtigung genügen 2 % (E. 3.2, S. 347). Nicht jede Komforteinbusse
    ist ein Mangel: vorhersehbare Veränderungen der Umgebung (Neubau nebenan, Nachbarn ziehen ein, mehr
    Verkehr) sind ohne besondere Zusicherung kein Mangel (E. 3.3, S. 347–349).'
  scope_de: BGE 135 III 345 (Wohnung, VD)
  legal_question_de: Mangelbegriff; Grenzfall «Umgebung verändert sich»
- id: BGER_4C_97_2003
  provider: bger
  type: case_law
  language: de
  title_de: BGer 4C.97/2003
  citation: BGer 4C.97/2003
  dossier_status: DOSSIER_PENDING
  verification_status: UNVERIFIED
  core_statement_de: 'Leichte Mängel trägt die Mieterin (Art. 259 OR); Rechte nach Art. 259a OR erst ab
    mittelschwerem Mangel; die Rechte stehen nebeneinander, ohne Rangfolge (E. 3.2). Mittelschwer ist
    ein Mangel bei rund 5 % Einschränkung oder wenn ein leichter Mangel lange besteht, obwohl die informierte
    Vermieterschaft nichts tut (E. 3.3). Abgenutzter Teppich im Eingang während 5½ Jahren: 2 % (E. 3.4,
    3.6). Beispiele aus der Praxis 5–15 % (E. 3.5).'
  scope_de: BGer 4C.97/2003 (Wohnung, GE)
  legal_question_de: Dauer und Untätigkeit dokumentieren; Prozentzahlen nur für die Fachperson
- id: BGE_142_III_557
  provider: bger
  type: case_law
  language: de
  title_de: BGE 142 III 557
  citation: BGE 142 III 557
  dossier_status: DOSSIER_PENDING
  verification_status: UNVERIFIED
  core_statement_de: Herabsetzung ab Kenntnis der Vermieterschaft bis zur Behebung oder zum Vertragsende;
    die Erklärung an die Vermieterschaft muss Mass und Zeitraum nennen und sich auf konkrete Mängel beziehen
    (E. 8.3.1, S. 561 f.). Rückwirkend kann nur herabgesetzt werden, wenn die Mieterin während des Mangels
    gezeigt hat, dass sie sich stört (Herabsetzung oder Behebung verlangt); sonst darf die Vermieterschaft
    auf die vorbehaltlos bezahlten Mieten vertrauen (E. 8.3.4, S. 566 f.). Keine feste Frist für die Erklärung,
    auch nach Mietende möglich (E. 8.3.5–8.4, S. 567 f.).
  scope_de: BGE 142 III 557
  legal_question_de: Kernregel «sofort schriftlich melden und Behebung verlangen»
- id: BGE_130_III_504
  provider: bger
  type: case_law
  language: de
  title_de: BGE 130 III 504
  citation: BGE 130 III 504
  dossier_status: DOSSIER_PENDING
  verification_status: UNVERIFIED
  core_statement_de: Wusste die Vermieterschaft schon vor der Herabsetzungserklärung vom Mangel, kann
    die Mieterin auch zu viel bezahlte Miete zurückverlangen (E. 3, S. 506 f.). Relative Methode; bei
    mittelschweren Mängeln Schätzung nach Billigkeit, das Bundesgericht greift nur bei Ermessensmissbrauch
    ein (E. 4.1, S. 507 f.). Rückforderung ist vertraglich (E. 6, S. 510–513); Verjährung 5 Jahre (Art.
    128 Ziff. 1 OR), gerechnet ab der Herabsetzungserklärung zurück (E. 8.2, S. 514).
  scope_de: BGE 130 III 504 (Geschäftsräume, Klimaanlage)
  legal_question_de: Keine Prozentangabe durch das System; Rückforderung höchstens 5 Jahre zurück
- id: BGER_4A_140_2014
  provider: bger
  type: case_law
  language: de
  title_de: BGer 4A_140/2014
  citation: BGer 4A_140/2014
  dossier_status: DOSSIER_PENDING
  verification_status: UNVERIFIED
  core_statement_de: 'Die Mieterin darf Miete wegen Mängeln nicht zurückbehalten; Art. 82 OR gilt nicht,
    Art. 259g OR (Hinterlegung) geht vor. Verrechnung mit einer bestrittenen Gegenforderung erfolgt auf
    eigenes Risiko; die Forderung muss sofort beweisbar sein. Nach Erhalt der Zahlungsaufforderung kann
    die Mieterin die Kündigung noch durch Zahlung oder Hinterlegung abwenden (E. 5.2). Eigenmächtige Kürzung
    kommt höchstens bei nicht behebbaren Mängeln in Frage; bei behebbaren Mängeln Behebung verlangen und
    hinterlegen (E. 5.4). Folge im Fall: Kündigungen gültig, keine Erstreckung (E. 5.5).'
  scope_de: BGer 4A_140/2014 und 4A_250/2014 (Geschäftsräume, GE)
  legal_question_de: Verbot «Miete kürzen oder zurückbehalten»; Verknüpfung mit Issue 2
- id: BGE_125_III_120
  provider: bger
  type: case_law
  language: de
  title_de: BGE 125 III 120
  citation: BGE 125 III 120
  dossier_status: DOSSIER_PENDING
  verification_status: UNVERIFIED
  core_statement_de: Wurden die Formvorschriften eingehalten und ging die Mieterin gutgläubig von einem
    Mangel aus, gelten die hinterlegten Mieten als bezahlt; eine Kündigung wegen Zahlungsverzug ist dann
    ungültig, auch wenn sich später kein Mangel ergibt. Nur bei bösem Glauben trägt die Mieterin das Risiko
    (E. 2b, S. 121 f.; E. 3, S. 122 f.).
  scope_de: BGE 125 III 120 (Wohnung, AG)
  legal_question_de: Guter Glaube schützt nur bei korrekter Form
- id: BGE_124_III_201
  provider: bger
  type: case_law
  language: de
  title_de: BGE 124 III 201
  citation: BGE 124 III 201
  dossier_status: DOSSIER_PENDING
  verification_status: UNVERIFIED
  core_statement_de: Die Hinterlegung ist Druckmittel zur Behebung; hinterlegt werden kann der ganze Mietzins
    inkl. periodisch geschuldeter Nebenkosten, unabhängig von der Schwere des Mangels (E. 2d, S. 203 f.).
    Die Kündigung wegen Zahlungsverzug war deshalb ungültig (E. 2e, S. 204).
  scope_de: BGE 124 III 201
  legal_question_de: Hinterlegung nur zur Behebung; Bruttomiete
- id: BGER_4C_264_2003
  provider: bger
  type: case_law
  language: de
  title_de: BGer 4C.264/2003
  citation: BGer 4C.264/2003
  dossier_status: DOSSIER_PENDING
  verification_status: UNVERIFIED
  core_statement_de: 'Formelle Voraussetzungen der Hinterlegung: schriftliche Frist zur Behebung und schriftliche
    Androhung; die Ankündigung ist nur Ordnungsvorschrift. Auf Frist und Androhung darf nur verzichtet
    werden, wenn klar ist, dass sie nutzlos wären; die Beweislast trägt die Mieterin (E. 3.1, 3.2.1).
    Fünf Monate für eine Parkettreparatur galten als angemessen (E. 3.2.2). Fehlt die Form, hilft der
    gute Glaube nicht: Die Mieterin ist in Verzug, die Kündigung nach Art. 257d OR gültig, eine Erstreckung
    ausgeschlossen (E. 3.3–3.4).'
  scope_de: BGer 4C.264/2003 (Wohnung, VD)
  legal_question_de: Formfehler = Zahlungsverzug (→ Issue 2); Hinterlegung immer über Rechtsperson
