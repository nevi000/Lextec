- id: CH_OR_253A_2
  provider: fedlex
  type: statute
  sr_number: '220'
  statute: OR
  article: 253a
  language: de
  title_de: Obligationenrecht (OR), Art. 253a Abs. 2
  dossier_status: DOSSIER_CHECKED
  verification_status: UNVERIFIED
  paragraph: Abs. 2
  text_de: «Sie gelten nicht für Ferienwohnungen, die für höchstens drei Monate gemietet werden.»
  legal_question_de: 'Vorprüfung: Anwendungsbereich'
  valid_as_of: '2026-10-01'
  origin_ref: OR_admin.pdf (SR 220, Stand 1.10.2026), PDF-S. 66
- id: CH_OR_266A
  provider: fedlex
  type: statute
  sr_number: '220'
  statute: OR
  article: 266a
  language: de
  title_de: Obligationenrecht (OR), Art. 266a
  dossier_status: DOSSIER_CHECKED
  verification_status: UNVERIFIED
  paragraph: Abs. 1–2
  text_de: «1 Die Parteien können das unbefristete Mietverhältnis unter Einhaltung der gesetzlichen Fristen und
    Termine kündigen, sofern sie keine längere Frist oder keinen anderen Termin vereinbart haben. 2 Halten die Parteien
    die Frist oder den Termin nicht ein, so gilt die Kündigung für den nächstmöglichen Termin.»
  legal_question_de: Falscher Termin = keine Unwirksamkeit, sondern Verschiebung
  valid_as_of: '2026-10-01'
  origin_ref: OR_admin.pdf (SR 220, Stand 1.10.2026), PDF-S. 74
- id: CH_OR_266C
  provider: fedlex
  type: statute
  sr_number: '220'
  statute: OR
  article: 266c
  language: de
  title_de: Obligationenrecht (OR), Art. 266c
  dossier_status: DOSSIER_CHECKED
  verification_status: UNVERIFIED
  text_de: «Bei der Miete von Wohnungen können die Parteien mit einer Frist von drei Monaten auf einen ortsüblichen
    Termin oder, wenn es keinen Ortsgebrauch gibt, auf Ende einer dreimonatigen Mietdauer kündigen.»
  legal_question_de: Kündigungsfrist Wohnung
  valid_as_of: '2026-10-01'
  origin_ref: OR_admin.pdf (SR 220, Stand 1.10.2026), PDF-S. 75
- id: CH_OR_266E
  provider: fedlex
  type: statute
  sr_number: '220'
  statute: OR
  article: 266e
  language: de
  title_de: Obligationenrecht (OR), Art. 266e
  dossier_status: DOSSIER_CHECKED
  verification_status: UNVERIFIED
  text_de: «… möblierten Zimmern … mit einer Frist von zwei Wochen auf Ende einer einmonatigen Mietdauer kündigen.»
    (Auslassungen wie im Dossier)
  legal_question_de: Sonderfall möbliertes Zimmer (häufig im Sozialbereich)
  valid_as_of: '2026-10-01'
  origin_ref: OR_admin.pdf (SR 220, Stand 1.10.2026), PDF-S. 75
- id: CH_OR_266L
  provider: fedlex
  type: statute
  sr_number: '220'
  statute: OR
  article: 266l
  language: de
  title_de: Obligationenrecht (OR), Art. 266l
  dossier_status: DOSSIER_CHECKED
  verification_status: UNVERIFIED
  paragraph: Abs. 1–2
  text_de: «1 Vermieter und Mieter von Wohn- und Geschäftsräumen müssen schriftlich kündigen. 2 Der Vermieter muss
    mit einem Formular kündigen, das vom Kanton genehmigt ist und das angibt, wie der Mieter vorzugehen hat, wenn
    er die Kündigung anfechten oder eine Erstreckung des Mietverhältnisses verlangen will.»
  legal_question_de: Formprüfung
  valid_as_of: '2026-10-01'
  origin_ref: OR_admin.pdf (SR 220, Stand 1.10.2026), PDF-S. 76
- id: CH_OR_266N
  provider: fedlex
  type: statute
  sr_number: '220'
  statute: OR
  article: 266n
  language: de
  title_de: Obligationenrecht (OR), Art. 266n
  dossier_status: DOSSIER_CHECKED
  verification_status: UNVERIFIED
  text_de: «Die Kündigung durch den Vermieter sowie die Ansetzung einer Zahlungsfrist mit Kündigungsandrohung (Art.
    257d) sind dem Mieter und seinem Ehegatten, seiner eingetragenen Partnerin oder seinem eingetragenen Partner
    separat zuzustellen.»
  legal_question_de: Familienwohnung
  valid_as_of: '2026-10-01'
  origin_ref: OR_admin.pdf (SR 220, Stand 1.10.2026), PDF-S. 76
- id: CH_OR_266O
  provider: fedlex
  type: statute
  sr_number: '220'
  statute: OR
  article: 266o
  language: de
  title_de: Obligationenrecht (OR), Art. 266o
  dossier_status: DOSSIER_CHECKED
  verification_status: UNVERIFIED
  text_de: «Die Kündigung ist nichtig, wenn sie den Artikeln 266l–266n nicht entspricht.»
  legal_question_de: Rechtsfolge Formmangel (Beurteilung durch Fachperson)
  valid_as_of: '2026-10-01'
  origin_ref: OR_admin.pdf (SR 220, Stand 1.10.2026), PDF-S. 76
- id: CH_OR_271
  provider: fedlex
  type: statute
  sr_number: '220'
  statute: OR
  article: '271'
  language: de
  title_de: Obligationenrecht (OR), Art. 271
  dossier_status: DOSSIER_CHECKED
  verification_status: UNVERIFIED
  paragraph: Abs. 1–2
  text_de: «1 Die Kündigung ist anfechtbar, wenn sie gegen den Grundsatz von Treu und Glauben verstösst. 2 Die Kündigung
    muss auf Verlangen begründet werden.»
  legal_question_de: Anfechtungsgrund (Generalklausel), Recht auf Begründung
  valid_as_of: '2026-10-01'
  origin_ref: OR_admin.pdf (SR 220, Stand 1.10.2026), PDF-S. 81
- id: CH_OR_271A_1
  provider: fedlex
  type: statute
  sr_number: '220'
  statute: OR
  article: 271a
  language: de
  title_de: Obligationenrecht (OR), Art. 271a Abs. 1
  dossier_status: DOSSIER_CHECKED
  verification_status: UNVERIFIED
  paragraph: Abs. 1
  text_de: 'Anfechtbar u. a., wenn ausgesprochen «a. weil der Mieter nach Treu und Glauben Ansprüche aus dem Mietverhältnis
    geltend macht; … d. während eines mit dem Mietverhältnis zusammenhängenden Schlichtungs- oder Gerichtsverfahrens
    …; e. vor Ablauf von drei Jahren nach Abschluss eines mit dem Mietverhältnis zusammenhängenden Schlichtungs-
    oder Gerichtsverfahrens …; f. wegen Änderungen in der familiären Situation des Mieters, aus denen dem Vermieter
    keine wesentlichen Nachteile entstehen.» (lit. b und c: Vertragsänderung durchsetzen, Kauf erzwingen)'
  legal_question_de: Typische Anfechtungsgründe
  valid_as_of: '2026-10-01'
  origin_ref: OR_admin.pdf (SR 220, Stand 1.10.2026), PDF-S. 81
- id: CH_OR_271A_3
  provider: fedlex
  type: statute
  sr_number: '220'
  statute: OR
  article: 271a
  language: de
  title_de: Obligationenrecht (OR), Art. 271a Abs. 3
  dossier_status: DOSSIER_CHECKED
  verification_status: UNVERIFIED
  paragraph: Abs. 3
  text_de: Abs. 1 lit. d und e nicht anwendbar bei Kündigungen u. a. «a. wegen dringenden Eigenbedarfs …; b. wegen
    Zahlungsrückstand des Mieters (Art. 257d)» sowie lit. c–f (Pflichtverletzung, Veräusserung, wichtige Gründe,
    Konkurs)
  legal_question_de: Ausnahmen von der Sperrfrist
  valid_as_of: '2026-10-01'
  origin_ref: OR_admin.pdf (SR 220, Stand 1.10.2026), PDF-S. 81–82
- id: CH_OR_273_1
  provider: fedlex
  type: statute
  sr_number: '220'
  statute: OR
  article: '273'
  language: de
  title_de: Obligationenrecht (OR), Art. 273 Abs. 1
  dossier_status: DOSSIER_CHECKED
  verification_status: UNVERIFIED
  paragraph: Abs. 1
  text_de: «Will eine Partei die Kündigung anfechten, so muss sie das Begehren innert 30 Tagen nach Empfang der
    Kündigung der Schlichtungsbehörde einreichen.»
  legal_question_de: Zentrale Frist
  valid_as_of: '2026-10-01'
  origin_ref: OR_admin.pdf (SR 220, Stand 1.10.2026), PDF-S. 83
- id: CH_OR_273_2
  provider: fedlex
  type: statute
  sr_number: '220'
  statute: OR
  article: '273'
  language: de
  title_de: Obligationenrecht (OR), Art. 273 Abs. 2
  dossier_status: DOSSIER_CHECKED
  verification_status: UNVERIFIED
  paragraph: Abs. 2
  text_de: Erstreckungsbegehren «a. bei einem unbefristeten Mietverhältnis innert 30 Tagen nach Empfang der Kündigung;
    b. bei einem befristeten Mietverhältnis spätestens 60 Tage vor Ablauf der Vertragsdauer.»
  legal_question_de: Verbindung zu Issue 4 (Erstreckung)
  valid_as_of: '2026-10-01'
  origin_ref: OR_admin.pdf (SR 220, Stand 1.10.2026), PDF-S. 83
- id: CH_OR_273_4_5
  provider: fedlex
  type: statute
  sr_number: '220'
  statute: OR
  article: '273'
  language: de
  title_de: Obligationenrecht (OR), Art. 273 Abs. 4 und 5
  dossier_status: DOSSIER_CHECKED
  verification_status: UNVERIFIED
  paragraph: Abs. 4–5
  text_de: «4 Das Verfahren vor der Schlichtungsbehörde richtet sich nach der ZPO. 5 Weist die zuständige Behörde
    ein Begehren des Mieters betreffend Anfechtung der Kündigung ab, so prüft sie von Amtes wegen, ob das Mietverhältnis
    erstreckt werden kann.»
  legal_question_de: Verfahren; Erstreckung von Amtes wegen
  valid_as_of: '2026-10-01'
  origin_ref: OR_admin.pdf (SR 220, Stand 1.10.2026), PDF-S. 84
- id: CH_OR_273A_1
  provider: fedlex
  type: statute
  sr_number: '220'
  statute: OR
  article: 273a
  language: de
  title_de: Obligationenrecht (OR), Art. 273a Abs. 1
  dossier_status: DOSSIER_CHECKED
  verification_status: UNVERIFIED
  paragraph: Abs. 1
  text_de: «Dient die gemietete Sache als Wohnung der Familie, so kann auch der Ehegatte des Mieters die Kündigung
    anfechten, die Erstreckung des Mietverhältnisses verlangen oder die übrigen Rechte ausüben, die dem Mieter bei
    Kündigung zustehen.»
  legal_question_de: Familienwohnung
  valid_as_of: '2026-10-01'
  origin_ref: OR_admin.pdf (SR 220, Stand 1.10.2026), PDF-S. 84
- id: CH_OR_273B_1
  provider: fedlex
  type: statute
  sr_number: '220'
  statute: OR
  article: 273b
  language: de
  title_de: Obligationenrecht (OR), Art. 273b Abs. 1
  dossier_status: DOSSIER_CHECKED
  verification_status: UNVERIFIED
  paragraph: Abs. 1
  text_de: «Dieser Abschnitt gilt für die Untermiete, solange das Hauptmietverhältnis nicht aufgelöst ist. Die Untermiete
    kann nur für die Dauer des Hauptmietverhältnisses erstreckt werden.»
  legal_question_de: 'Grenze: Untermiete'
  valid_as_of: '2026-10-01'
  origin_ref: OR_admin.pdf (SR 220, Stand 1.10.2026), PDF-S. 84
- id: CH_OR_273C
  provider: fedlex
  type: statute
  sr_number: '220'
