  dossier_status: DOSSIER_PENDING
  verification_status: UNVERIFIED
  core_statement_de: 'Eine unangefochtene Mietzinserhöhung führt kraft Gesetzes zur Verwirkung (Art. 270b
    Abs. 1 OR) (E. 3, S. 68 f.; E. 3b, S. 70). Hauptthema: Stillschweigen auf eine angebotene Teilreduktion
