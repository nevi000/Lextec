- id: BGE_142_III_375
  provider: bger
  type: case_law
  language: de
  title_de: BGE 142 III 375
  citation: BGE 142 III 375
  dossier_status: DOSSIER_PENDING
  verification_status: UNVERIFIED
  core_statement_de: Nichtig ist eine Erhöhung auch dann, wenn das Formular verwendet wird, die Begründung
    aber nicht genügend klar ist; massgebend ist, ob die Mieterin als vernünftige Vertragspartnerin erkennen
    kann, auf welchen Grund sich die Vermieterschaft beruft (Vertrauensprinzip) (E. 3.3, S. 377 f.). Bei
    wertvermehrenden Investitionen muss der zahlenmässige Nachweis nicht im Formular stehen; die Mieterin
    kann ihn nach Art. 20 Abs. 1 VMWG verlangen, ohne dass die 30-Tage-Frist berührt wird (E. 3.3.2.1,
    S. 379). Mehrere Erhöhungsgründe sind je in Einzelbeträgen auszuweisen (E. 3.3.1, S. 378).
  scope_de: BGE 142 III 375 (Mietgericht Sense- und Seebezirk FR, Totalsanierung)
  legal_question_de: Formfehler prüfen lassen; Zahlen verlangen ist möglich, Frist läuft trotzdem
- id: BGE_121_III_214
  provider: bger
  type: case_law
  language: de
  title_de: BGE 121 III 214
  citation: BGE 121 III 214
  dossier_status: DOSSIER_PENDING
  verification_status: UNVERIFIED
  core_statement_de: 'Strenge Formularpflicht: Nur ein amtliches oder vom Kanton genehmigtes Formular
    genügt; ein Brief mit beigeheftetem leeren Formular ist nichtig (E. 3b–3c, S. 217 f.). Die damalige
    Regel, eine Begründung im Begleitschreiben mache die Erhöhung nichtig (E. 3a, S. 216 f.), ist überholt:
    Seit 1996 ist ein Begleitschreiben zulässig, wenn das Formular ausdrücklich darauf verweist (Art.
    19 Abs. 1bis VMWG).'
  scope_de: BGE 121 III 214 (Wohnung ZG)
  legal_question_de: Brief ohne amtliches Formular = mögliche Nichtigkeit
- id: BGE_137_III_362
  provider: bger
  type: case_law
  language: de
  title_de: BGE 137 III 362
  citation: BGE 137 III 362
  dossier_status: DOSSIER_PENDING
  verification_status: UNVERIFIED
  core_statement_de: Will die Vermieterschaft Nebenkosten neu separat verrechnen, gilt Art. 269d OR; die
    Begründung muss angeben, welche bisher im Mietzins enthaltenen Kosten nun separat verrechnet werden
    und wie sich das auf den Mietzins auswirkt; sonst ungenügend und nichtig (E. 3.2.1, S. 364 f.; E.
    3.3, S. 366 f.). Andere Unterlagen dürfen die Begründung im Formular nur auslegen, nicht ersetzen
    (E. 3.2.1, S. 365).
  scope_de: BGE 137 III 362 (Geschäftsräume GE, Nebenkosten)
  legal_question_de: 'Neue Nebenkosten: genau prüfen lassen'
- id: BGE_118_II_130
