  language: de
  title_de: Zivilprozessordnung (ZPO), Art. 33
  dossier_status: DOSSIER_CHECKED
  verification_status: UNVERIFIED
  text_de: «Für Klagen aus Miete und Pacht unbeweglicher Sachen ist das Gericht am Ort der gelegenen Sache zuständig.»
