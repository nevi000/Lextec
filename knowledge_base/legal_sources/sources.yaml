  provider: bger
  type: case_law
  language: de
  title_de: BGE 142 III 336
  citation: BGE 142 III 336
  dossier_status: DOSSIER_PENDING
  verification_status: UNVERIFIED
  core_statement_de: 'Auch bei gültiger Kündigung entscheidet die Behörde von Amtes wegen über die Erstreckung
    (E. 5.3, S. 344; Art. 273 Abs. 5 OR). Zweck: Zeit für eine Ersatzlösung oder Milderung der Folgen;
    Abwägung der Interessen beider Seiten; die Aufzählung in Art. 272 Abs. 2 OR ist nicht abschliessend;
    keine Erstreckung bis zu einem unbestimmten Datum; nicht ohne Weiteres die Maximaldauer, sondern allenfalls
    zuerst eine kürzere und später eine zweite (E. 5.3.1, S. 344 f.). Freies Ermessen (Art. 4 ZGB), das
    Bundesgericht greift nur zurückhaltend ein (E. 5.3.2, S. 345).'
  scope_de: BGE 142 III 336 (Geschäftsräume, Kündigung nach Art. 261 OR)
  legal_question_de: Grundsatz der Abwägung; Begründung für das Verbot jeder Prognose zur Dauer
