  core_statement_de: Die 30-Tage-Frist von Art. 270b OR ist eine Verwirkungsfrist, die das Gericht von
    Amtes wegen prüft; eine Anfechtung nach 49 Tagen war verspätet (E. 3.2, S. 570, Praxisänderung). Zu
