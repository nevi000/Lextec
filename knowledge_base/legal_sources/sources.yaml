  core_statement_de: 'Bei Abholungseinladung gilt die Kündigung am Tag des Einwurfs als empfangen, wenn sofortiges
    Abholen zumutbar ist, sonst in der Regel am Folgetag; die 7-Tage-Abholfiktion der ZPO gilt nicht. Ferien oder
    Abwesenheit trägt die Empfängerin; sie muss sich auch nach Ablauf der Abholfrist bei der Post nach dem Absender
    erkundigen; späte Kenntnis verkürzt die verbleibende Frist. Im Fall: Einwurf 2.12., Empfang 3.12.2013, Klage
    vom 7.2.2014 verspätet. Ob Krankheit anders zu behandeln wäre, blieb offen.'
