- id: BGE_141_III_262
  provider: bger
  type: case_law
  language: de
  title_de: BGE 141 III 262
  citation: BGE 141 III 262
  dossier_status: DOSSIER_PENDING
  verification_status: UNVERIFIED
  core_statement_de: Ein Ausweisungsbegehren im Verfahren für klare Fälle ist auch zulässig, wenn die
    Mieterin die Kündigung angefochten hat und dieses Verfahren hängig ist (E. 3.3, S. 265). Der Gesetzgeber
    wollte rasche Ausweisung; im Ausweisungsverfahren wird die Gültigkeit der Kündigung als Vorfrage beurteilt,
    und auch dafür müssen Sachverhalt und Rechtslage klar sein, sonst Nichteintreten (E. 3.2, S. 263–265).
  scope_de: BGE 141 III 262 (Geschäftsräume, Handelsgericht ZH)
  legal_question_de: Verbot «Solange die Anfechtung läuft, kann man Sie nicht ausweisen»; Verteidigung
    über die Vorfrage
- id: OGZH_LF260018
  provider: other
  type: case_law
  language: de
  title_de: Obergericht ZH, LF260018 vom 16.3.2026
  citation: Obergericht ZH, LF260018 vom 16.3.2026
  dossier_status: DOSSIER_PENDING
  verification_status: UNVERIFIED
  core_statement_de: Vorinstanz war das Einzelgericht Audienz am Bezirksgericht Zürich. Eine Zahlung nach
    Ablauf der Zahlungsfrist ändert an der Gültigkeit der Kündigung nichts; Erstreckung nach Art. 272a
    Abs. 1 lit. a OR ausgeschlossen; Vollstreckungsaufschub (Schonfrist) abgelehnt, weil er die Aussicht
    auf eine Wohnung nicht merklich erhöht hätte (E. 4.2, S. 5). Die Berufung muss sich konkret mit dem
    Entscheid auseinandersetzen, auch bei Laien zumindest rudimentär (E. 3.1, S. 3 f.); neue Behauptungen
    sind im Rechtsmittel kaum noch zulässig (E. 3.2, S. 4; E. 4.4, S. 6). Nichteintreten.
  scope_de: Obergericht ZH, LF260018 vom 16.3.2026 (Wohnung, Stadt Zürich)
  jurisdiction: ZH
  legal_question_de: Zeigt den typischen Zürcher Ablauf; Rechtsmittel ohne Rechtsperson praktisch aussichtslos
- id: BGE_138_III_620
  provider: bger
  type: case_law
  language: de
  title_de: BGE 138 III 620
  citation: BGE 138 III 620
  dossier_status: DOSSIER_PENDING
  verification_status: UNVERIFIED
  core_statement_de: 'Sofort beweisbar = ohne Verzögerung und besonderen Aufwand, in der Regel durch Urkunden;
    die gesuchstellende Partei muss den vollen Beweis erbringen. Offensichtlich haltlose Bestreitungen
    genügen nicht. Es genügt aber, dass die Gegenpartei substanziiert und schlüssig Einwendungen vorträgt,
    die nicht sofort widerlegt werden können und die Überzeugung des Gerichts erschüttern; glaubhaft machen
    muss sie sie nicht (E. 5.1.1, S. 621–623). Grund: Ein Entscheid im klaren Fall ist endgültig, die
    Einwände wären sonst für immer abgeschnitten (E. 5.1.1, S. 623 f.; E. 6.2, S. 624 f.).'
  scope_de: BGE 138 III 620 (Gebrauchsleihe, kein Mietfall)
  legal_question_de: 'Kern der Verteidigung: konkrete, schlüssige Einwände in der Stellungnahme'
- id: BGE_138_III_123
  provider: bger
  type: case_law
  language: de
  title_de: BGE 138 III 123
  citation: BGE 138 III 123
  dossier_status: DOSSIER_PENDING
  verification_status: UNVERIFIED
  core_statement_de: 'Klare Rechtslage nur, wenn sich die Rechtsfolge ohne Weiteres ergibt; nicht klar,
    wenn das Gericht Ermessen ausüben oder Treu und Glauben wertend beurteilen muss (E. 2.1.2, S. 126).
    Im Fall: Rechtsmissbrauch erforderte eine Gesamtwürdigung, daher kein klarer Fall (E. 2.5, S. 129).'
  scope_de: BGE 138 III 123 (Geschäftsräume, Restaurant)
  legal_question_de: Einwände wie mündliche Abmachung, widersprüchliches Verhalten der Vermieterschaft
    erfassen
- id: BGE_142_III_515
  provider: bger
  type: case_law
  language: de
  title_de: BGE 142 III 515
  citation: BGE 142 III 515
  dossier_status: DOSSIER_PENDING
  verification_status: UNVERIFIED
  core_statement_de: Ist die Kündigung angefochten, beziehen sich die Voraussetzungen von Art. 257 ZPO
    auch auf ihre Gültigkeit; der Rechtsschutz in klaren Fällen ist nur zu gewähren, wenn keine Zweifel
    an der Vollständigkeit der Sachverhaltsdarstellung bestehen und die Kündigung klar berechtigt erscheint,
    damit der mietrechtliche Kündigungsschutz nicht unterlaufen wird (E. 2.2.4, S. 517 f.).
  scope_de: BGE 142 III 515 (Geschäftsräume, Restaurant)
  legal_question_de: Stützt die Verteidigung bei hängiger Anfechtung
- id: BGE_140_III_315
  provider: bger
  type: case_law
  language: de
  title_de: BGE 140 III 315
  citation: BGE 140 III 315
  dossier_status: DOSSIER_PENDING
  verification_status: UNVERIFIED
  core_statement_de: 'Sachverhalt: Der Sozialdienst zahlte während der Zahlungsfrist insgesamt mehr als
    den Rückstand, teils ausdrücklich für die Partnerin des Mieters; die Vermieter wiesen diesen Teil
    zurück und kündigten wegen eines angeblichen Restbetrags von CHF 750; die Ausweisung im klaren Fall
    scheiterte (S. 316 f.). Gründe laut vollständigem Urteil BGer 4A_68/2014: Zahlt ein Dritter (hier
    der Sozialdienst) eine Geldschuld, tilgt das die Schuld der Mieterin (Art. 68 OR); die Vermieter hatten
    innert der Zahlungsfrist den ganzen Rückstand erhalten, und eine Zahlung, die sie erst nach Fristablauf
    zurücküberwiesen, gilt als angenommen (E. 4.2); die Anrechnung richtet sich nach Art. 86–87 OR (E.
    4.3); die Schuld war klar getilgt (E. 4.4). Das Verfahren nach Art. 257 ZPO endet bei fehlendem Anspruch
    nicht mit materieller Abweisung, sondern mit Nichteintreten; die Vermieterschaft kann dann den ordentlichen
    Weg gehen (E. 5.2.3–5.3, S. 320).'
  scope_de: BGE 140 III 315 (Wohnung, VD; Sozialdienst zahlte)
  legal_question_de: Zahlungen Dritter (Sozialdienst) genau dokumentieren; Ergebnis Nichteintreten ≠ endgültiger
    Sieg
