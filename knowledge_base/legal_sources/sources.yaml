- id: CH_ZPO_33
  provider: fedlex
  type: statute
  sr_number: '272'
  statute: ZPO
  article: '33'
  language: de
  title_de: Zivilprozessordnung (ZPO), Art. 33
  dossier_status: DOSSIER_CHECKED
  verification_status: UNVERIFIED
  text_de: «Für Klagen aus Miete und Pacht unbeweglicher Sachen ist das Gericht am Ort der gelegenen Sache
    zuständig.»
  legal_question_de: Zuständige Schlichtungsbehörde
  valid_as_of: '2026-07-01'
  origin_ref: ZPO.pdf (SR 272, Stand 1.7.2026), PDF-S. 9
- id: CH_ZPO_35_1_B
  provider: fedlex
  type: statute
  sr_number: '272'
  statute: ZPO
  article: '35'
  language: de
  title_de: Zivilprozessordnung (ZPO), Art. 35 Abs. 1 lit. b
  dossier_status: DOSSIER_CHECKED
  verification_status: UNVERIFIED
  paragraph: Abs. 1 lit. b
  text_de: Auf diesen Gerichtsstand kann «die Partei, die Wohn- oder Geschäftsräume gemietet oder gepachtet
    hat», nicht zum Voraus oder durch Einlassung verzichten.
  legal_question_de: Gerichtsstandsklausel im Vertrag unbeachtlich
  valid_as_of: '2026-07-01'
  origin_ref: ZPO.pdf (SR 272, Stand 1.7.2026), PDF-S. 10
- id: CH_ZPO_113
  provider: fedlex
  type: statute
  sr_number: '272'
  statute: ZPO
  article: '113'
  language: de
  title_de: Zivilprozessordnung (ZPO), Art. 113 Abs. 2 lit. c
  dossier_status: DOSSIER_CHECKED
  verification_status: UNVERIFIED
  paragraph: Abs. 1–2 lit. c
  text_de: Im Schlichtungsverfahren werden keine Gerichtskosten gesprochen in Streitigkeiten «aus Miete
    und Pacht von Wohn- und Geschäftsräumen»; nach Abs. 1 auch keine Parteientschädigungen.
  legal_question_de: Kostenlose Schlichtung
  valid_as_of: '2026-07-01'
  origin_ref: ZPO.pdf (SR 272, Stand 1.7.2026), PDF-S. 28–29
- id: CH_ZPO_200_1
  provider: fedlex
  type: statute
  sr_number: '272'
  statute: ZPO
