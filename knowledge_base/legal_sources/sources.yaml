  core_statement_de: Die 30-Tage-Frist läuft ab dem Tag, an dem die Mieterin die Zahlungsaufforderung
    tatsächlich in Empfang nimmt; holt sie das Einschreiben nicht ab, gilt der letzte Tag der 7-tägigen
    Abholfrist (E. 2, S. 149–150). Die Vermieterschaft muss den Fristablauf abwarten; eine Kündigung während
    laufender Frist ist nicht nichtig, aber innert 30 Tagen anfechtbar (E. 3–4, S. 151–155).
  scope_de: BGE 119 II 147 (6.4.1993)
  legal_question_de: Fristbeginn anders als bei Issue 1
- id: BGE_124_III_145
  provider: bger
  type: case_law
  language: de
  title_de: BGE 124 III 145
  citation: BGE 124 III 145
  dossier_status: DOSSIER_CHECKED
  verification_status: UNVERIFIED
  core_statement_de: 'Liegt der Mahnung ein Einzahlungsschein bei, ist die Bareinzahlung am Postschalter
    innert Frist rechtzeitig; Verbuchungsverzögerungen trägt die Vermieterschaft; Kündigung ungültig (E.
    2a–2b, S. 147–149). Grundregel nach BGE 119 II 232 (15.6.1993): Geldschulden sind Bringschulden; zahlt
    die Mieterin über Post oder Bank, muss der Auftrag so früh erteilt werden, dass das Geld bei Fristablauf
    im Verfügungsbereich der Vermieterschaft ist; bis dahin trägt sie das Verzögerungsrisiko. Eine am
    Abend des letzten Tages erteilte Postanweisung ist zu spät (E. 2, S. 234–235). Wer verspätete Zahlungen
    annimmt und trotzdem kündigt, handelt nicht rechtsmissbräuchlich (E. 3, S. 235).'
  scope_de: BGE 124 III 145 (20.3.1998)
  legal_question_de: Faktum «Zahlungsweg»; Einzahlungsschein verwenden
- id: BGE_140_III_591
  provider: bger
  type: case_law
  language: de
  title_de: BGE 140 III 591
  citation: BGE 140 III 591
  dossier_status: DOSSIER_CHECKED
  verification_status: UNVERIFIED
  core_statement_de: Eine korrekte Zahlungsverzugskündigung ist nur «très exceptionnel» treuwidrig, z.
    B. wenn ein deutlich zu hoher Betrag verlangt wurde, obwohl der geschuldete unsicher war; wenn der
    Ausstand unbedeutend ist oder sehr kurz nach Fristablauf bezahlt wurde und bisher immer pünktlich
    gezahlt wurde; oder wenn erst lange nach Fristablauf gekündigt wird. Beweislast bei der Mieterschaft
    (E. 1, S. 594). CHF 164.65 sind nicht unbedeutend; massgebend ist der Betrag an sich, nicht im Verhältnis
    zur Miete oder zu den Finanzen der Parteien (E. 2, S. 594–595). Art. 257d verlangt nur eine fällige,
    nicht eine unbestrittene Forderung; wer bestreitet und nicht zahlt, trägt das Risiko (E. 3.2, S. 595–596).
    Eine zweite Mahnung oder Erinnerung ist nicht nötig (E. 5, S. 597).
  scope_de: BGE 140 III 591 (4A_271/2014, 19.11.2014)
  legal_question_de: Verbote «bestrittener Betrag muss nicht bezahlt werden» und «kleiner Betrag ist egal»;
    Fall betraf Nebenkostensaldo
- id: BGE_120_II_31
  provider: bger
  type: case_law
  language: de
  title_de: BGE 120 II 31
  citation: BGE 120 II 31
  dossier_status: DOSSIER_CHECKED
  verification_status: UNVERIFIED
  core_statement_de: 'Art. 271 OR gilt auch für Kündigungen wegen Zahlungsverzug, aber nur bei besonderen
    Umständen; kein offenbarer Rechtsmissbrauch nötig (E. 4a, S. 32–33). CHF 286 sind nicht unbedeutend.
    Treuwidrig handelt, wer mit Kündigung droht, bevor er Gewissheit über den geschuldeten Betrag hat:
    Hier wurden irrtümlich über CHF 1000 statt CHF 436 verlangt und zur Prüfung aufgefordert; Kündigung
    aufgehoben (E. 4b, S. 33–34).'
  scope_de: BGE 120 II 31 (20.1.1994)
  legal_question_de: Prüfhinweis bei falschem Betrag
- id: BGE_147_III_218
  provider: bger
  type: case_law
  language: de
  title_de: BGE 147 III 218
  citation: BGE 147 III 218
  dossier_status: DOSSIER_CHECKED
  verification_status: UNVERIFIED
  core_statement_de: 'Hinterlegung wirkt als Zahlung nur, wenn alle Voraussetzungen von Art. 259g OR erfüllt
    sind, u. a. schriftliche Frist an die Vermieterschaft, Androhung, kantonale Stelle und nur künftig
    fällige Mietzinse (E. 3.3.1, S. 220). Die Hinterlegung bereits fälliger Mietzinse tilgt die Schuld
    nicht (E. 3.3.2.6, S. 223–224); die Schuld ist dann erst getilgt, wenn der Betrag der Vermieterschaft
    ausgehändigt oder gutgeschrieben wurde (E. 3.3.4, S. 224). Im Fall: keine Zahlung innert 30 Tagen,
    Kündigung gültig (E. 3.3.5, S. 224–225).'
  scope_de: BGE 147 III 218 (4A_571/2020, 23.3.2021)
  legal_question_de: 'Schutzregel: nach der Mahnung nicht hinterlegen, sondern zahlen'
