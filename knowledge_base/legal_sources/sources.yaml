  core_statement_de: 'Beweislast bei der Mieterschaft, Mitwirkungspflicht der Vermieterschaft. Sanierungskündigung
    wird nicht nachträglich missbräuchlich, wenn die Bewilligung später verweigert wird. Abbruchkündigung: Entscheid
    liegt allein bei der Vermieterschaft, auch zur Ertragserhöhung; kein ausgereiftes Projekt nötig; missbräuchlich
    nur bei offensichtlicher Unmöglichkeit (z. B. Denkmalschutz) oder vorgeschobenem Grund. Bei Ungültigkeit ist
    die eventualiter verlangte Erstreckung zu prüfen, inkl. Suchbemühungen.'
  scope_de: Abbruchkündigung vs. Sanierungskündigung
  relevant_fact_ids:
