  language: de
  title_de: Obligationenrecht (OR), Art. 273c
  dossier_status: DOSSIER_CHECKED
  verification_status: UNVERIFIED
  paragraph: Abs. 1–2
  text_de: «1 Der Mieter kann auf Rechte, die ihm nach diesem Abschnitt zustehen, nur verzichten, wenn dies ausdrücklich
    vorgesehen ist. 2 Abweichende Vereinbarungen sind nichtig.»
  legal_question_de: Zwingender Kündigungsschutz
  valid_as_of: '2026-10-01'
