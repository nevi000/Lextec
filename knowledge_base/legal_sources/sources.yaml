  legal_question_de: Frist nach Klagebewilligung
  valid_as_of: '2026-07-01'
  origin_ref: ZPO.pdf (SR 272, Stand 1.7.2026), PDF-S. 57
- id: CH_ZPO_210_1_B
  provider: fedlex
  type: statute
  sr_number: '272'
  statute: ZPO
  article: '210'
  language: de
  title_de: Zivilprozessordnung (ZPO), Art. 210 Abs. 1 lit. b
  dossier_status: DOSSIER_CHECKED
  verification_status: UNVERIFIED
  paragraph: Abs. 1 lit. b
  text_de: Die Schlichtungsbehörde kann einen Entscheidvorschlag unterbreiten, sofern u. a. «der Kündigungsschutz
    oder die Erstreckung» betroffen ist.
  legal_question_de: Verfahrensschritt
  valid_as_of: '2026-07-01'
  origin_ref: ZPO.pdf (SR 272, Stand 1.7.2026), PDF-S. 57
- id: CH_ZPO_211
  provider: fedlex
  type: statute
  sr_number: '272'
  statute: ZPO
  article: '211'
  language: de
  title_de: Zivilprozessordnung (ZPO), Art. 211
  dossier_status: DOSSIER_CHECKED
  verification_status: UNVERIFIED
  paragraph: Abs. 1–3
  text_de: Entscheidvorschlag gilt als angenommen, «wenn ihn keine Partei innert 20 Tagen seit der schriftlichen
    Eröffnung ablehnt»; in Mietsachen erhält die ablehnende Partei die Klagebewilligung; klagt sie nicht
    rechtzeitig, gilt der Vorschlag als anerkannt.
  legal_question_de: 'Warnung: Wer ablehnt, muss klagen'
  valid_as_of: '2026-07-01'
  origin_ref: ZPO.pdf (SR 272, Stand 1.7.2026), PDF-S. 57
