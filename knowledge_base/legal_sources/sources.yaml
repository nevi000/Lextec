  core_statement_de: Ordentliche Kündigung braucht keinen besonderen Grund; treuwidrig, wenn ohne objektives, ernsthaftes,
    schützenswertes Interesse oder bei vorgeschobenem Grund, dessen wahrer Grund nicht feststellbar ist. Beweislast
    bei der Mieterschaft; die Vermieterschaft muss auf Verlangen begründen und Unterlagen vorlegen. Massgeblich
    ist der Kündigungszeitpunkt; fällt der Grund später weg, wird die Kündigung nicht nachträglich treuwidrig. Eine
    Entschädigung ist gesetzlich nicht vorgesehen.
  scope_de: Treu und Glauben; Eigenbedarf (Fall aus dem Bezirk Zürich)
