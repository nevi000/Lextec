- id: BGE_140_III_244
  provider: bger
  type: case_law
  title_de: 'BGE 140 III 244 (Volltext: Urteil 4A_120/2014)'
  citation: 'BGE 140 III 244 (Volltext: Urteil 4A_120/2014)'
  language: de
  dossier_status: DOSSIER_CHECKED
  verification_status: UNVERIFIED
  case_number: 4A_120/2014
  decision_date: '2014-05-19'
  considerations:
  - E. 4.1, Seite 4
  - E. 4.2 ff.
  - E. 5.1–5.2, Seite 5–6
  core_statement_de: Fehlt das genehmigte Formular, ist die Kündigung nichtig; die Nichtigkeit kann jederzeit
    geltend gemacht werden und ist von Amtes wegen zu beachten. Ein veraltetes Formular führt nicht zur
    Nichtigkeit, wenn es dieselben Informationen enthält. Die 30-Tage-Frist von Art. 273 Abs. 1 OR ist
    materiellrechtlich; es gilt die absolute Empfangstheorie. Die relative Theorie gilt im Mietrecht nur
    für Mietzinserhöhungen (Art. 269d OR) und Zahlungsaufforderungen (Art. 257d Abs. 1 OR).
  scope_de: Formular und Fristbeginn bei Kündigung durch die Vermieterschaft
  limits_de: Veraltetes Formular mit gleicher Information genügt.
  relevant_fact_ids:
