  language: de
  title_de: BGE 121 III 163
  citation: BGE 121 III 163
  dossier_status: DOSSIER_PENDING
  verification_status: UNVERIFIED
  core_statement_de: 'Bei Erhöhungen schützt die relative Methode das Vertrauen der Mieterin: Ohne Vorbehalt
    (Art. 18 VMWG) sind Erhöhungen nur soweit zulässig, als sich die Verhältnisse seit der letzten Festsetzung
    verändert haben; eine relativ zulässige Erhöhung ist aber auf das absolut Zulässige begrenzt (E. 2c,
