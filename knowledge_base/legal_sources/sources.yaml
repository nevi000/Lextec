  dossier_status: DOSSIER_PENDING
  verification_status: UNVERIFIED
  core_statement_de: Unannehmlichkeiten eines Umzugs sind keine Härte. Suchbemühungen sind schon für die
    erste Erstreckung nötig (mit Hinweis auf BGE 110 II 249 E. 4; 116 II 446 E. 3a); fehlen sie, kommt
    höchstens eine einmalige kurze Erstreckung in Frage. Ein Mangel an Ersatzobjekten ist nicht notorisch,
    sondern muss festgestellt werden (E. 3–4).
  scope_de: BGer 4A_72/2011 (Geschäftsräume Genf)
  legal_question_de: Suche ab Kündigung dokumentieren; Marktlage belegen
