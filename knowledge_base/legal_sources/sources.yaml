- id: BGE_117_II_415
  provider: bger
  type: case_law
  language: de
  title_de: BGE 117 II 415
  citation: BGE 117 II 415
  dossier_status: DOSSIER_PENDING
  verification_status: UNVERIFIED
  core_statement_de: Der Ausschluss nach Art. 272a Abs. 1 lit. a OR setzt eine gültige Zahlungsaufforderung
    nach Art. 257d OR voraus (schriftlich, mind. 30 Tage, Androhung; bei Familienwohnung separat an beide
    Ehegatten); ein blosser Zahlungsrückstand genügt nicht (E. 3, S. 416; E. 5a, S. 418 f.). Der Ausschluss
    greift aber auch, wenn die Vermieterschaft nach erfolgloser Mahnung nur ordentlich kündigt (E. 4,
    S. 417). Die Ausschlussgründe sind abschliessend; frühere Ausschlussgründe des alten Rechts fliessen
    nur noch in die Interessenabwägung ein (E. 5b, S. 419).
  scope_de: BGE 117 II 415
  legal_question_de: Neues Faktum «frühere erfolglose Mahnung»; Ausschluss nur bei gültiger Mahnung
- id: BGE_105_II_197
  provider: bger
  type: case_law
  language: de
  title_de: BGE 105 II 197
  citation: BGE 105 II 197
  dossier_status: DOSSIER_PENDING
  verification_status: UNVERIFIED
  core_statement_de: Die Folgen eines Umzugs an sich sind keine Härte; erstreckt wird nur, wenn die Erstreckung
    diese Folgen mildern kann (E. 3a, S. 197 f.). Wer bei Vertragsschluss von einem geplanten Abbruch
    wusste, kann sich kaum auf Härte berufen; von ihm wird erwartet, schon vorher zu suchen (E. 3b, S.
    198 f.). Konkubinatspartner sind keine «Familie» (E. 3c, S. 199).
  scope_de: BGE 105 II 197 (altes Recht, Art. 267a aOR)
  legal_question_de: Grenzfälle «Umzug an sich», «Abbruch bekannt», Konkubinat
- id: BGER_4A_72_2011
