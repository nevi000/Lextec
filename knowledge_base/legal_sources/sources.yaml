  language: de
  title_de: Zivilprozessordnung (ZPO), Art. 211
  dossier_status: DOSSIER_CHECKED
  verification_status: UNVERIFIED
  paragraph: Abs. 1–3
  text_de: Entscheidvorschlag gilt als angenommen, «wenn ihn keine Partei innert 20 Tagen seit der schriftlichen
