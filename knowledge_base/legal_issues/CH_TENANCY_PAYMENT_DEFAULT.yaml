version: 1.0-dossier-2026-11-07
content_status: DRAFT
jurisdiction: CH
canton: ZH
legal_area: tenancy
issue: payment_default
title_de: Kündigung wegen Zahlungsverzug (Issue 3)
description: Kündigung nach unbenütztem Ablauf der Zahlungsfrist (Art. 257d Abs. 2 OR). Immer sofortige,
  parallele Eskalation an Rechtsperson und Sozialarbeiterin; Erstreckung ausgeschlossen; keine Erfolgsprognose.
provenance_de: 'Law-Dossier Issue 3 vom 7.11.2026; Teamentscheide: Wartezeit-Prüfhinweis ab 14 Tagen,
  Anfechtungsempfehlung bleibt bei der Rechtsperson, Übertragbarkeit BGE 141 III 262 / 4A_585/2010 auf
  Wohnungen.'
classification:
  description: 'Passt, wenn die Vermieterschaft wegen Mietzinsrückstand gekündigt hat (Kündigung nach
    Mahnung, fristlose oder 30-Tage-Kündigung wegen Zahlungsverzug). NICHT passend: Kündigung ohne Zahlungsverzug
    (Issue 1), Mahnung ohne Kündigung (Issue 2), Gerichtsschreiben (Issue 6).'
  typical_situations:
  - Der Vermieter hat wegen Mietrückstand gekündigt.
  - Meine Klientin hat die Kündigung wegen Zahlungsverzug erhalten.
  - Nach der Mahnung kam die Kündigung nach Art. 257d.
  - Die Verwaltung hat gekündigt, weil die Miete nicht rechtzeitig bezahlt wurde.
  related_issues: []
