    value: sozialdienst
  priority: medium
  escalation_relevant: true
  handover_priority: high
  depends_on:
  - rent_payer
  source_ids:
  - PRODUKTREGEL
  question_de: "Ist eine Mietzahlung des Sozialdienstes an die Vermieterschaft ausgeblieben?"
  why_needed_de: 'Der Sozialdienst ist selbst beteiligt (Interessenkonflikt): interne Klärung und unabhängige
    Beratung.'
- id: rent_withheld_for_defects
  group: counterclaims
  label_de: Miete wegen Mängeln zurückbehalten
  data_type: boolean
  required: true
  priority: high
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - CH_OR_259G
  - BGE_147_III_218
  question_de: Hat die Klientin wegen Mängeln bewusst nicht bezahlt?
  why_needed_de: 'Schutzregel (Art. 259g OR; BGE 147 III 218): Zurückbehalten und Hinterlegung bereits
    fälliger Mietzinse schützen nicht.'
- id: payment_agreement_present
  group: history
  label_de: Ratenvereinbarung oder Gespräch vereinbart
  data_type: boolean
  priority: medium
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - MGZH_ZMP_2018_1
  question_de: Gab es eine Ratenvereinbarung, Stundung oder ein vereinbartes Gespräch mit der Vermieterschaft?
  why_needed_de: Kann eine spätere Kündigung treuwidrig machen (ZMP 2018 Nr. 1).
- id: amount_disputed
  group: counterclaims
  label_de: Betrag wird bestritten
  data_type: boolean
  priority: medium
  source_ids:
  - BGE_140_III_591
  - BGE_120_II_31
  question_de: Bestreitet die Klientin den Betrag?
  why_needed_de: Fälligkeit genügt; wer bestreitet und nicht zahlt, trägt das Risiko (BGE 140 III 591
    E. 3.2).
- id: paid_in_time
  group: payment
  label_de: Zahlung innert Frist
  data_type: enum
  enum_values:
  - vollstaendig_rechtzeitig
  - teilweise
  - nicht_bezahlt
  - nur_nach_fristablauf
  enum_labels_de:
    vollstaendig_rechtzeitig: Vollständig und rechtzeitig bezahlt
    teilweise: Nur teilweise bezahlt
    nicht_bezahlt: Nicht bezahlt
    nur_nach_fristablauf: Erst nach Fristablauf bezahlt
  required: true
  priority: high
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - BGE_124_III_145
  - BGE_119_II_232
  question_de: "Wurde der ganze Betrag innert der Zahlungsfrist bezahlt?"
  why_needed_de: Rechtzeitige vollständige Zahlung macht die Kündigung unwirksam (BGE 124 III 145 E. 2b).
- id: partial_payment_with_notice
  group: payment
  label_de: Teilzahlung mit Hinweis an die Vermieterschaft
  data_type: boolean
  required_if:
    ref: fact.paid_in_time
    op: equals
    value: teilweise
  priority: medium
  escalation_relevant: true
  handover_priority: high
  depends_on:
  - paid_in_time
  source_ids:
  - BGER_4A_332_2025
  - BGE_140_III_591
  question_de: "Wurde nur ein Teil bezahlt und die Vermieterschaft dabei schriftlich darauf hingewiesen?"
  why_needed_de: Wer den nach eigenem Wissen geschuldeten Betrag zahlt und informiert, wird geschützt
    (4A_332/2025 E. 3.5.2).
- id: setoff_or_deposit_done
  group: payment
  label_de: Verrechnet oder hinterlegt
  data_type: boolean
  required: true
  priority: high
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - BGE_147_III_218
  - OGZH_LF250009
  question_de: "Wurde verrechnet oder hinterlegt?"
  why_needed_de: Verrechnung nur innert Frist und gegenüber der Vermieterschaft; Hinterlegung bereits
    fälliger Mietzinse tilgt nicht (BGE 147 III 218).
- id: payment_after_deadline_accepted
  group: payment
  label_de: Zahlung nach Fristablauf von der Vermieterschaft angenommen
  data_type: boolean
  priority: medium
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - BGE_119_II_232
  question_de: "Hat die Vermieterschaft eine Zahlung angenommen, die nach Fristablauf erfolgte?"
  why_needed_de: Heilt die Kündigung nicht (BGE 119 II 232 E. 3).
- id: termination_before_deadline_end
  group: termination
  label_de: Kündigung vor Ablauf der Zahlungsfrist
  data_type: boolean
  required: true
  priority: high
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - BGER_4A_585_2010
  - BGE_119_II_147
  question_de: Wurde die Kündigung vor Ablauf der Zahlungsfrist ausgesprochen oder zugestellt?
  why_needed_de: 'Neuere Praxis: unwirksam (4A_585/2010 E. 3.1); älter anfechtbar (BGE 119 II 147 E. 4).
    Ausnahme bei Zugang nach Fristablauf.'
- id: days_between_deadline_and_termination
  group: termination
  label_de: Tage zwischen Fristablauf und Kündigung
  data_type: integer
  priority: low
  source_ids:
  - BGER_4A_366_2008
  - LEHRBUCH_MIETE_31
  question_de: Wie lange wartete die Vermieterschaft nach Fristablauf bis zur Kündigung (ungefähr in Tagen)?
  why_needed_de: Zu langes Zuwarten kann als Verzicht gedeutet werden; ab 14 Tagen gibt das System einen
    Prüfhinweis (Teamentscheid). Keine feste gesetzliche Grenze.
- id: special_circumstances
  group: termination
  label_de: Besondere Umstände
  data_type: boolean
  priority: medium
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - BGE_140_III_591
  - BGE_120_II_31
  question_de: Gab es Absprachen, einen Ratenplan, ein vereinbartes Gespräch, einen falschen Betrag oder
    einen sehr kleinen Rest?
  why_needed_de: Treu und Glauben, sehr eng (BGE 140 III 591 E. 1; BGE 120 II 31).
- id: challenge_filed
  group: history
  label_de: Kündigung bereits angefochten
  data_type: boolean
  priority: high
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - CH_OR_273_1
  - BGE_141_III_262
  question_de: "Hat die Klientin die Kündigung schon bei der Schlichtungsbehörde angefochten oder eine Erstreckung verlangt?"
  why_needed_de: Laufendes Verfahren (Art. 273 OR); schützt aber nicht automatisch vor der Ausweisung
    (BGE 141 III 262 E. 3.3).
  required: true
- id: housing_solution_available
  group: social
  label_de: Anschlusslösung vorhanden
  data_type: boolean
  priority: high
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - PRODUKTREGEL
  question_de: Gibt es eine Unterkunft nach dem Auszug (Anschlusslösung)?
  why_needed_de: Ohne Anschlusslösung muss der Sozialdienst sofort eine Notunterkunft prüfen.
  required: true
- id: children_in_household
  group: social
  label_de: Kinder im Haushalt
  data_type: boolean
  priority: medium
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - PRODUKTREGEL
  extraction_hint_de: true bei Kindern im Haushalt; false bei ausdrücklich keine Kinder.
  question_de: Leben Kinder in der Wohnung?
  why_needed_de: Soziale Notfallplanung bzw. Härtegrund; verändert keine Rechtsfolge, wohl aber den Unterstützungsbedarf.
- id: landlord_self_help
  group: history
  label_de: Selbsthilfe der Vermieterschaft
  data_type: boolean
  priority: high
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - CH_ZPO_343_1_D
  - LEHRBUCH_MIETE_31
  question_de: Hat die Vermieterschaft ohne Gericht das Schloss gewechselt, Sachen entfernt oder Strom
    und Wasser abgestellt?
  why_needed_de: 'Unzulässige Selbsthilfe: eine Räumung braucht einen Gerichtsentscheid (Lehrbuch N 3025d;
    Art. 343 ZPO).'
escalation_rules:
- id: PD_OUT_OF_SCOPE_ROLE
  description: 'Klientin nicht Hauptmieterin: ausserhalb des Moduls.'
  when:
    ref: fact.tenant_role
    op: in
    value:
    - untermieterin
    - andere
  urgency: MEDIUM
  reason_code: OUT_OF_SCOPE_NOT_MAIN_TENANT
  reason_de: Die Klientin ist nicht selbst Hauptmieterin (z. B. Untermiete). Dieses Modul gilt dafür nicht;
    es werden keine Standardaussagen gemacht. Eine unabhängige Rechtsperson muss prüfen.
  professionals:
  - lawyer_general
  suppress_standard_statements: true
- id: PD_OUT_OF_SCOPE_OBJECT
  description: 'Geschäftsraum/Ferienwohnung/Notunterkunft: ausserhalb des Moduls.'
  when:
    ref: fact.object_type
    op: in
    value:
    - notwohnung_heim
    - ferienwohnung_bis_3_monate
    - andere
  urgency: MEDIUM
  reason_code: OUT_OF_SCOPE_OBJECT
  reason_de: Das Objekt fällt nicht unter die gewöhnliche Wohnraummiete dieses Moduls. Es werden keine
    Standardaussagen gemacht. Eine unabhängige Rechtsperson muss prüfen.
  professionals:
  - lawyer_general
  suppress_standard_statements: true
- id: PD_NOT_ZH
  description: Wohnung nicht im Kanton Zürich.
  when:
    ref: fact.property_in_canton_zh
    op: equals
    value: false
  urgency: MEDIUM
  reason_code: AUTHORITY_NOT_DETERMINABLE
  reason_de: Die Wohnung liegt nicht im Kanton Zürich. Die Zürcher Stellenangaben gelten nicht; die zuständigen
    Stellen müssen separat bestimmt werden.
  professionals: &id001
  - tenancy_law_counsel
- id: PD_GRUNDREGEL
  description: 'Jede Kündigung wegen Zahlungsverzug: sofort Rechtsperson + Sozialarbeiterin.'
  when: &id003
    ref: ctx.has_user_input
    op: equals
    value: true
  urgency: HIGH
  reason_code: PAYMENT_DEFAULT_TERMINATION_IMMEDIATE
  reason_de: 'Kündigung wegen Zahlungsverzug: Die Anfechtungsfrist von 30 Tagen kann laufen, eine Erstreckung
    ist ausgeschlossen und eine schnelle Ausweisung ist möglich. Rechtsperson und Sozialarbeiterin handeln
    sofort und parallel (Unterkunft sichern). Das System macht keine Erfolgsprognose.'
  professionals: &id002
  - tenancy_law_counsel
  - social_counselling
- id: PD_EMPFANG_UNBEKANNT_ODER_GE20
  description: 'Empfang der Kündigung unbekannt oder 20+ Tage seit Empfang: höchste Priorität.'
  when:
    any:
    - ref: fact.receipt_date
      op: is_unknown
    - ref: fact.delivery_method
      op: is_unknown
    - ref: fact.pickup_notice_date
      op: is_unknown
    - ref: derived.days_since_earliest_receipt
      op: greater_than
      value: 19
  urgency: HIGH
  reason_code: TERMINATION_RECEIPT_UNKNOWN_OR_20_DAYS
  reason_de: 'Das Empfangsdatum der Kündigung ist unbekannt oder es sind seit dem frühesten Empfangshinweis
    20 oder mehr Tage vergangen. Die Anfechtungsfrist (30 Tage) ist knapp oder unbestimmbar: höchste Priorität
    (Produktschwelle, keine Gesetzesfrist).'
  professionals: *id001
- id: PD_PRUEFFRAGE1_MAHNUNG
  description: Keine Mahnung, fehlerhafte Mahnung oder zu kurze Frist (Prüffrage 1).
  when:
    any:
    - ref: fact.warning_written
      op: equals
      value: false
    - ref: fact.warning_threat_present
      op: equals
      value: false
    - ref: fact.warning_amount_clear
      op: equals
      value: false
    - ref: fact.warning_deadline_days
      op: less_than
      value: 30
  urgency: HIGH
  reason_code: WARNING_DEFECT_POSSIBLE
  reason_de: Die vorausgehende Mahnung fehlt oder ist möglicherweise fehlerhaft (Schriftlichkeit, Androhung,
    Betrag, Frist unter 30 Tagen). Eine Kündigung wegen Zahlungsverzug setzt eine gültige Mahnung voraus;
    keine Entwarnung, da die Vermieterschaft neu mahnen oder ordentlich kündigen kann. Rechtsperson sofort.
  professionals: *id001
- id: PD_PRUEFFRAGE2_ZAHLUNG
  description: Angabe 'innert Frist bezahlt', Teilzahlung mit Hinweis, Verrechnung/Hinterlegung (Prüffrage
    2).
  when:
    any:
    - ref: fact.paid_in_time
      op: equals
      value: vollstaendig_rechtzeitig
    - all:
      - ref: fact.paid_in_time
        op: equals
        value: teilweise
      - ref: fact.partial_payment_with_notice
        op: equals
        value: true
    - ref: fact.setoff_or_deposit_done
      op: equals
      value: true
    - ref: fact.third_party_payment
      op: equals
      value: true
  urgency: HIGH
  reason_code: PAYMENT_IN_TIME_OR_SETOFF_CLAIMED
  reason_de: Es wird geltend gemacht, dass innert Frist gezahlt, verrechnet, hinterlegt oder durch Dritte
    bezahlt wurde. Alle Belege mit Datum (Auftrag und Gutschrift) sichern. Rechtsperson sofort.
  professionals: *id001
- id: PD_PRUEFFRAGE3_FORM
  description: Kündigung vor Fristablauf, kein Formular, Familienwohnung/Mitmieter nicht separat (Prüffrage
    3).
  when:
    any:
    - ref: fact.termination_before_deadline_end
      op: equals
      value: true
    - ref: fact.official_form_used
      op: equals
      value: false
    - all:
      - ref: fact.family_home_with_spouse
        op: equals
        value: true
      - ref: fact.spouse_still_lives_there
        op: equals
        value: true
      - ref: fact.separate_delivery_to_spouse
        op: equals
        value: false
    - ref: fact.co_tenants_all_notified
      op: equals
      value: false
  urgency: HIGH
  reason_code: TERMINATION_FORM_OR_TIMING_DEFECT_POSSIBLE
  reason_de: 'Mögliche Mängel der Kündigung: vor Ablauf der Zahlungsfrist ausgesprochen, ohne amtliches
    Formular oder nicht separat/allen zugestellt. Keine Entwarnung; Rechtsperson sofort.'
  professionals: *id001
- id: PD_GERICHT
  description: 'Gesuch ans Gericht, Vorladung oder Räumungstermin: Wechsel zu Issue 6.'
  when:
    ref: fact.eviction_or_court_proceeding
    op: equals
    value: true
  urgency: HIGH
  reason_code: COURT_OR_EVICTION_PROCEEDING
  reason_de: Es liegt ein Gesuch, eine Vorladung oder ein Räumungstermin vor. Dafür gilt Issue 6 (Ausweisung
    und Räumung). Sofortige rechtliche und soziale Prüfung.
  professionals: *id002
  routes_to_issue: CH_TENANCY_EVICTION
- id: PD_SELBSTHILFE
  description: 'Vermieterschaft räumt selbst oder sperrt aus: unzulässige Selbsthilfe.'
  when:
    ref: fact.landlord_self_help
    op: equals
    value: true
  urgency: HIGH
  reason_code: LANDLORD_SELF_HELP
  reason_de: Die Vermieterschaft hat ohne Gericht geräumt, das Schloss gewechselt oder Leistungen abgestellt.
    Das ist unzulässig und kann strafbar sein; das System bewertet das nicht. Rechtsperson und Sozialarbeiterin
    sofort, nötigenfalls Polizei.
  professionals: *id002
  routes_to_issue: CH_TENANCY_EVICTION
- id: PD_SOZIALDIENST_ZAHLT
  description: 'Sozialdienst zahlt direkt: Interessenkonflikt, unabhängige Beratung.'
  when:
    ref: fact.rent_payer
    op: equals
    value: sozialdienst
  urgency: HIGH
  reason_code: SOCIAL_SERVICE_IS_PAYER
  reason_de: Der Sozialdienst zahlt die Miete direkt und ist selbst beteiligt. Eine unabhängige Rechtsperson
    muss prüfen.
  professionals:
  - independent_legal_body
  - social_counselling
- id: PD_KEINE_ANSCHLUSSLOESUNG
  description: 'Kinder, Gesundheit oder keine Anschlusslösung: Unterkunft sofort sichern.'
  when:
    any:
    - ref: fact.housing_solution_available
      op: equals
      value: false
    - ref: fact.housing_solution_available
      op: is_unknown
  urgency: HIGH
  reason_code: NO_HOUSING_SOLUTION
  reason_de: Es gibt keine Anschlusslösung (oder sie ist unbekannt). Weil keine Erstreckung möglich ist,
    muss die Sozialarbeiterin sofort Unterkunft und Notunterkunft prüfen.
  professionals:
  - social_counselling
- id: PD_BESONDERE_UMSTAENDE
  description: 'Absprachen, Ratenplan, falscher Betrag: Treu und Glauben.'
  when:
    any:
    - ref: fact.special_circumstances
      op: equals
      value: true
    - ref: fact.payment_agreement_present
      op: equals
      value: true
  urgency: HIGH
  reason_code: SPECIAL_CIRCUMSTANCES_PRESENT
  reason_de: Es gibt besondere Umstände (Absprache, Ratenplan, falscher Betrag). Treuwidrigkeit kommt
    nur sehr ausnahmsweise in Frage; die Rechtsperson prüft sofort.
  professionals: *id001
- id: PD_VULNERABILITY
  description: 'Besondere Belastungssituation: ausserhalb des Moduls.'
  when:
    ref: fact.vulnerability_present
    op: equals
    value: true
  urgency: MEDIUM
  reason_code: OUTSIDE_MODULE_VULNERABILITY
  reason_de: Es liegt eine besondere Belastungssituation vor. Das liegt ausserhalb dieses Moduls und gehört
    in menschliche Hände.
  professionals: *id002
- id: PD_EXPERT_REQUESTED
  description: Fachperson ausdrücklich gewünscht.
  when:
    ref: fact.client_requests_expert
    op: equals
    value: true
  urgency: LOW
  reason_code: EXPERT_REQUESTED
  reason_de: Es wurde ausdrücklich eine Fachperson gewünscht. Dieser Wunsch wird immer respektiert.
  professionals: *id001
legal_rules:
- id: PD_HINT_ANFECHTUNG
  description: Anfechtung 30 Tage, kostenlos.
  kind: HINT
  when: *id003
  result_code: HINT_CONTEST_30_DAYS_FREE
  result_de: Eine Kündigung kann innert 30 Tagen nach Empfang bei der Schlichtungsbehörde angefochten
    werden; das Verfahren kostet keine Gerichtskosten.
  legal_source_ids:
  - CH_OR_273_1
  - CH_ZPO_113_2_C
- id: PD_HINT_KEINE_ERSTRECKUNG
  description: Erstreckung ausgeschlossen.
  kind: HINT
  when: *id003
  result_code: HINT_NO_EXTENSION
  result_de: Bei einer Kündigung wegen Zahlungsverzug ist eine Erstreckung ausgeschlossen. Die Suche nach
    einer Unterkunft sollte deshalb sofort beginnen.
  legal_source_ids:
  - CH_OR_272A_1_A
- id: PD_HINT_MAHNUNG
  description: Gültige Mahnung ist Voraussetzung.
  kind: HINT
  when: *id003
  result_code: HINT_VALID_WARNING_REQUIRED
  result_de: Eine solche Kündigung setzt eine gültige schriftliche Mahnung mit Frist und ausdrücklicher
    Kündigungsandrohung voraus. Ob das erfüllt ist, prüft eine Fachperson.
  legal_source_ids:
  - CH_OR_257D_1
  - LEHRBUCH_MIETE_31
- id: PD_HINT_RECHTZEITIG
  description: Rechtzeitige Zahlung.
  kind: HINT
  when:
    any:
    - ref: fact.paid_in_time
      op: equals
      value: vollstaendig_rechtzeitig
    - ref: fact.third_party_payment
      op: equals
      value: true
  result_code: HINT_PAID_IN_TIME
  result_de: Wurde der ganze Betrag rechtzeitig bezahlt, kann die Kündigung unwirksam sein. Bitte alle
    Belege mit Datum sichern.
  legal_source_ids:
  - BGE_124_III_145
- id: PD_HINT_NACH_FRIST
  description: Zahlung nach Fristablauf heilt nicht automatisch.
  kind: HINT
  when:
    any:
    - ref: fact.paid_in_time
      op: equals
      value: nur_nach_fristablauf
    - ref: fact.payment_after_deadline_accepted
      op: equals
      value: true
  result_code: HINT_LATE_PAYMENT
  result_de: Eine Zahlung nach Fristablauf macht die Kündigung nicht automatisch unwirksam, auch wenn
    die Vermieterschaft das Geld annimmt.
  legal_source_ids:
  - BGE_119_II_232
- id: PD_HINT_FORM
  description: Formular und separate Zustellung.
  kind: HINT
  when: *id003
  result_code: HINT_FORM_REQUIRED
  result_de: Auch bei einer Kündigung muss die Vermieterschaft das amtliche Formular verwenden und bei
    einer Familienwohnung beiden Ehegatten separat zustellen.
  legal_source_ids:
  - CH_OR_266L
  - CH_OR_266N
  - CH_OR_266O
- id: PD_HINT_SELBSTHILFE
  description: Keine Selbsthilfe.
  kind: HINT
  when:
    ref: fact.landlord_self_help
    op: equals
    value: true
  result_code: HINT_NO_SELF_HELP
  result_de: Die Vermieterschaft darf die Wohnung nicht selbst räumen; dafür braucht es einen Entscheid
    einer Behörde oder eines Gerichts.
  legal_source_ids:
  - CH_ZPO_343_1_D
  - LEHRBUCH_MIETE_31
- id: PD_HINT_ANFECHTUNG_SCHUETZT_NICHT
  description: Anfechtung schützt nicht sicher vor schneller Ausweisung.
  kind: HINT
  when:
    any:
    - ref: fact.challenge_filed
      op: equals
      value: true
    - ref: fact.eviction_or_court_proceeding
      op: equals
      value: true
  result_code: HINT_CHALLENGE_NO_SAFE_PROTECTION
  result_de: Eine Anfechtung schützt nicht sicher vor einem schnellen Ausweisungsverfahren.
  legal_source_ids:
  - BGE_141_III_262
- id: PD_REVIEW_WARTEZEIT
  description: Wartezeit nach Fristablauf (Verzicht?).
  kind: REVIEW_POINT
  when:
    ref: fact.days_between_deadline_and_termination
    op: greater_than
    value: 13
  result_code: REVIEW_WAITING_TIME
  result_de: 'Prüfhinweis: Zwischen Fristablauf und Kündigung liegen 14 oder mehr Tage. Zu langes Zuwarten
    kann als Verzicht gedeutet werden; knapp drei Wochen gelten als Grenze. Keine Entwarnung.'
  legal_source_ids:
  - BGER_4A_366_2008
  - LEHRBUCH_MIETE_31
- id: PD_REVIEW_VOR_FRIST
  description: Kündigung vor Fristablauf.
  kind: REVIEW_POINT
  when:
    ref: fact.termination_before_deadline_end
    op: equals
    value: true
  result_code: REVIEW_TERMINATION_BEFORE_DEADLINE
  result_de: 'Prüfhinweis: Eine Kündigung vor Ablauf der Zahlungsfrist ist nach neuerer Praxis unwirksam
    (ältere Praxis: anfechtbar); der Zeitpunkt des Zugangs entscheidet. Anfechtungsfrist vorsorglich wahren.'
  legal_source_ids:
  - BGER_4A_585_2010
  - BGE_119_II_147
- id: PD_REVIEW_SPERRFRIST
  description: 'Laufendes Verfahren: keine Sperrfrist.'
  kind: REVIEW_POINT
  when: *id003
  result_code: REVIEW_NO_BLOCKING_PERIOD
  result_de: 'Prüfhinweis: Bei einer Kündigung wegen Zahlungsverzug gelten die Sperrfristen nach einem
    Schlichtungs- oder Gerichtsverfahren nicht; ein laufendes Verfahren bietet hier keinen Schutz.'
  legal_source_ids:
  - CH_OR_271A_3_B
  - LEHRBUCH_MIETE_31
- id: PD_REVIEW_KAUTION
  description: Kaution verhindert die Kündigung nicht.
  kind: REVIEW_POINT
  when: *id003
  result_code: REVIEW_DEPOSIT_NO_PAYMENT
  result_de: 'Prüfhinweis: Eine Kaution ist keine Vorauszahlung und verhindert die Kündigung nicht.'
  legal_source_ids:
  - LEHRBUCH_MIETE_31
- id: PD_REVIEW_UMDEUTUNG
  description: Keine Umdeutung in ordentliche Kündigung.
  kind: REVIEW_POINT
  when:
    ref: fact.warning_written
    op: equals
    value: false
  result_code: REVIEW_NO_CONVERSION
  result_de: 'Prüfhinweis: Ohne gültige Mahnung ist die Zahlungsverzugskündigung unwirksam; eine Umdeutung
    in eine ordentliche Kündigung ist ausgeschlossen. Die Vermieterschaft kann aber neu mahnen oder ordentlich
    kündigen.'
  legal_source_ids:
  - BGE_135_III_441
  - LEHRBUCH_MIETE_31
- id: PD_REVIEW_FALSCHER_TERMIN
  description: Falscher Termin/zu kurze Frist.
  kind: REVIEW_POINT
  when:
    ref: fact.termination_date
    op: is_known
  result_code: REVIEW_WRONG_TERM
  result_de: 'Prüfhinweis: Ein falscher Termin oder eine zu kurze Kündigungsfrist macht die Kündigung
    nicht ungültig; sie gilt auf den nächstmöglichen Termin.'
  legal_source_ids:
  - CH_OR_266A_2
  - LEHRBUCH_MIETE_31
