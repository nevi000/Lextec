  review_points:
  - text_de: 'Prüffrage 1: War die Mahnung gültig (Frist ≥ 30 Tage, Androhung, bestimmbarer Betrag, Zustellung)?
      Details in Issue 2.'
    source_ids:
    - CH_OR_257D_1
    - BGER_4A_332_2025
  - text_de: 'Prüffrage 2: Innert Frist vollständig bezahlt (Einzahlungsschein, Gutschrift, Dritte) oder
      verrechnet?'
    source_ids:
    - BGE_124_III_145
    - BGE_119_II_232
    - BGER_4A_68_2014
  - text_de: 'Prüffrage 3: Formgültigkeit der Kündigung (Formular, Familienwohnung, Mitmieter), Zeitpunkt
      zur Zahlungsfrist, Termin, Treu und Glauben.'
    source_ids:
    - CH_OR_266L
    - CH_OR_266N
    - CH_OR_266O
    - BGER_4A_585_2010
    - BGE_140_III_591
  - text_de: Anfechtung bei der Schlichtungsbehörde innert 30 Tagen ab Empfang (absolute Empfangstheorie);
      der Entscheid über die Anfechtung liegt immer bei der Rechtsperson.
    source_ids:
    - CH_OR_273_1
    - BGE_143_III_15
  - text_de: Ausweisung im Verfahren für klare Fälle möglich; Anfechtung schützt nicht sicher.
    source_ids:
    - BGE_141_III_262
    - CH_ZPO_257
