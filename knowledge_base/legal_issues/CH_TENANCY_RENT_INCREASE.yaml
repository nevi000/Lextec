default_professionals:
- tenancy_law_counsel
briefing_template: expert_briefing_v1
briefing_profile:
  intro_de: Mietzinserhöhung / einseitige Vertragsänderung (Art. 269 ff. OR) – Kanton Zürich
  groups:
  - id: letter
    title_de: Schreiben, Empfang und Zustellart
    fact_ids:
    - increase_letter_available
    - increase_delivery_method
    - increase_pickup_notice_date
    - increase_receipt_date
  - id: form
    title_de: Formular-Vorprüfung (nur Hinweis, am Original bestätigt)
    fact_ids:
    - form_official_used
    - form_reason_present
    - form_old_new_rent_stated
    - form_effective_date_stated
    - form_cover_letter_reference
    - form_appeal_notice_present
    - form_page3_present
    - form_signed
    - termination_threat_in_letter
    - letter_contains_termination
  - id: content
    title_de: 'Inhalt: Art der Änderung, Beträge, Vertragsart, Wohnform'
    fact_ids:
    - change_type
    - old_rent_chf
    - new_rent_chf
    - effective_date_in_letter
    - contract_term_type
    - contract_termination_dates
    - rent_model
    - housing_arrangement
    - luxury_or_large_house
  - id: history
    title_de: Bisherige Reaktion und Hintergründe
    fact_ids:
    - increase_already_paying
    - increase_already_reacted
    - asked_to_sign
    - last_rent_adjustment
    - renovation_before
    - wants_to_terminate_instead
  - id: social
    title_de: Finanzierbarkeit (Sozialhilfe nur mit Einwilligung)
    fact_ids:
    - rent_affordable
    - social_assistance_received
    - consent_briefing
    - vulnerability_present
    - client_requests_expert
  - id: situation
    title_de: Vorprüfung
    fact_ids:
    - tenant_role
    - object_type
    - property_municipality
    - property_in_canton_zh
  review_points:
  - text_de: 'Fristbeginn: relative Empfangstheorie (tatsächlicher Empfang, spätestens 7. Tag der Abholfrist);
      30 Tage Anfechtung.'
    source_ids:
    - CH_OR_270B
    - BGE_137_III_208
  - text_de: 'Form (Nichtigkeit): amtliches Formular, Begründung, keine Kündigungsandrohung; Begründung
      im Begleitschreiben nur mit ausdrücklichem Verweis.'
    source_ids:
    - CH_OR_269D_2
    - CH_VMWG_19_1BIS
    - BGE_142_III_375
    - BGE_137_III_362
  - text_de: Missbräuchlichkeit (Art. 269, 269a OR) beurteilt allein die Rechtsperson; das System rechnet
      nicht.
    source_ids:
    - CH_OR_269
    - CH_OR_269A
  - text_de: 'Wohnform: subventioniert / Genossenschaft / Luxus; Vertragsart: befristet, Index, Staffel.'
    source_ids:
    - CH_OR_253B_2_3
    - CH_OR_269B_269C
    - CH_OR_270C_270D
  documents_to_request:
  - Schreiben bzw. Formular der Vermieterschaft (alle Seiten, Umschlag)
  - Begleitschreiben
  - Mietvertrag (Kündigungsfrist und Termine)
  - Letzte Mietzinsanpassung
  - Nachweis der Zahlungen seit der Mitteilung
  authority_ids:
  - SCHLICHTUNGSBEHOERDE_MIETE_ZH
  - MIETERVERBAND_ZH
  - RECHTSAUSKUNFT_SCHLICHTUNGSBEHOERDE_ZH
  - MIETGERICHT_ZH
  - SOZIALDIENST_WOHNGEMEINDE
  - BWO_REFERENZZINSSATZ
  - KONTROLLBEHOERDE_SUBVENTIONIERT
