- id: last_rent_adjustment
  group: history
  label_de: Letzte Anpassung
  data_type: string
  priority: low
  source_ids:
  - CH_OR_269A
  question_de: Wann wurde die Miete zuletzt angepasst, und gab es damals einen Vorbehalt?
  why_needed_de: Relative Methode (Rechtsperson).
- id: renovation_before
  group: history
  label_de: Renovationsarbeiten vorher
  data_type: boolean
  priority: low
  source_ids:
  - CH_OR_269A
  - CH_VMWG_14_1
  question_de: Gab es vorher Renovationsarbeiten?
  why_needed_de: Mehrleistung (Art. 269a lit. b OR); Bezug Issue 5 während der Bauarbeiten.
- id: wants_to_terminate_instead
  group: history
  label_de: Klientin will lieber kündigen
  data_type: boolean
  priority: medium
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - CH_OR_269D_1
  question_de: Möchte die Klientin lieber kündigen als anfechten?
  why_needed_de: Die Bedenkfrist von zehn Tagen bezweckt genau diese Wahl; Wohnungsverlust abwägen.
- id: rent_affordable
  group: social
  label_de: Neue Miete finanzierbar
  data_type: boolean
  required: true
  priority: high
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - CH_DSG_6_7
  question_de: "Kann die Klientin die neue Miete bezahlen?"
  why_needed_de: Route SOZIAL; Daten über Sozialhilfe sind besonders schützenswert (Art. 5 lit. c Ziff.
    6 DSG).
escalation_rules:
- id: RI_OUT_OF_SCOPE
  description: 'Untermiete/Geschäftsraum/Notunterkunft: ausserhalb des Moduls.'
  when:
    any:
    - ref: fact.tenant_role
      op: in
      value:
      - untermieterin
      - andere
    - ref: fact.object_type
      op: in
      value:
      - notwohnung_heim
      - ferienwohnung_bis_3_monate
      - andere
  urgency: MEDIUM
  reason_code: OUT_OF_SCOPE_OBJECT
  reason_de: Das Mietverhältnis fällt nicht unter die gewöhnliche Wohnraummiete dieses Moduls (z. B. Untermiete,
    Geschäftsraum, Notunterkunft). Es werden keine Standardaussagen gemacht. Eine unabhängige Rechtsperson
    muss prüfen.
  professionals:
  - lawyer_general
  suppress_standard_statements: true
- id: RI_FRIST_20_ODER_UNBEKANNT
  description: 'PRODUKTSCHWELLE (Teamentscheid 7.11.2026): 20+ Tage seit Empfang oder Empfang unbekannt.'
  when:
    any:
    - ref: fact.increase_receipt_date
      op: is_unknown
    - ref: fact.increase_delivery_method
      op: is_unknown
    - ref: fact.increase_pickup_notice_date
      op: is_unknown
    - ref: derived.days_since_increase_receipt
      op: greater_than
      value: 19
  urgency: HIGH
  reason_code: INCREASE_30_DAY_DEADLINE_TIGHT
  reason_de: Der Empfang der Mitteilung ist unbekannt oder liegt 20 oder mehr Tage zurück. Die Anfechtungsfrist
    von 30 Tagen (Art. 270b OR) ist knapp oder unbestimmbar (Produktschwelle, kein Fristende). Rechtsperson
    sofort.
  professionals: &id001
  - tenancy_law_counsel
- id: RI_KEIN_FORMULAR
  description: 'Kein amtliches Formular oder keine Begründung: mögliche Nichtigkeit (Hinweis).'
  when:
    any:
    - ref: fact.form_official_used
      op: equals
      value: false
    - ref: fact.form_reason_present
      op: equals
      value: false
  urgency: MEDIUM
  reason_code: INCREASE_POSSIBLY_VOID_FORM
  reason_de: Es fehlt laut Angabe das amtliche Formular oder die Begründung. Das kann zur Nichtigkeit
    führen; das ist nur ein Hinweis, die Rechtsperson beurteilt (bald). Trotzdem vorsorglich die Frist
    wahren.
  professionals: *id001
- id: RI_KUENDIGUNGSDROHUNG
  description: 'Kündigungsandrohung im Schreiben: mögliche Nichtigkeit.'
  when:
    ref: fact.termination_threat_in_letter
    op: equals
    value: true
  urgency: HIGH
  reason_code: INCREASE_WITH_TERMINATION_THREAT
  reason_de: Das Schreiben droht mit Kündigung. Das kann zur Nichtigkeit führen; die Rechtsperson prüft
    sofort. Prüfen, ob zugleich eine Kündigung vorliegt.
  professionals: *id001
- id: RI_KUENDIGUNG_IM_SCHREIBEN
  description: Schreiben enthält zugleich eine Kündigung -> Issue 1.
  when:
    ref: fact.letter_contains_termination
    op: equals
    value: true
  urgency: HIGH
  reason_code: INCREASE_LETTER_CONTAINS_TERMINATION
  reason_de: Das Schreiben enthält zugleich eine Kündigung. Dafür gelten andere Fristen (Issue 1); sofortige
    juristische Prüfung.
  professionals: *id001
  routes_to_issue: CH_TENANCY_TERMINATION
- id: RI_PRUEFUNG_GRUNDREGEL
  description: 'Formgültige Erhöhung (nicht Staffelmiete): Missbräuchlichkeit nur durch eine Fachperson.'
  when:
    ref: fact.rent_model
    op: not_equals
    value: staffelmiete
  urgency: MEDIUM
  reason_code: INCREASE_LEGAL_REVIEW_STANDARD
  reason_de: Ob eine Mietzinserhöhung missbräuchlich ist, beurteilt nur eine Fachperson; das System rechnet
    nicht mit Referenzzinssatz oder Teuerung. Rechtsperson bald, Unterlagen sichern.
  professionals: *id001
- id: RI_SUBVENTIONIERT_GENOSSENSCHAFT
  description: Subventionierte Wohnung oder Genossenschaft.
  when:
    ref: fact.housing_arrangement
    op: in
    value:
    - subventioniert
    - genossenschaft
    - gemeindewohnung
    - zugewiesene_unterkunft
  urgency: MEDIUM
  reason_code: INCREASE_SUBSIDISED_OR_COOPERATIVE
  reason_de: Bei subventionierten Wohnungen mit kontrolliertem Mietzins, Genossenschaften oder Gemeindewohnungen
    können besondere Regeln gelten (Art. 253b Abs. 3 OR, Statuten). Zuständige Stelle klären; Rechtsperson
    bald.
  professionals: *id001
- id: RI_LUXUS
  description: 'Luxuswohnung/grosses Einfamilienhaus: Missbrauchsschutz gilt nicht.'
  when:
    ref: fact.luxury_or_large_house
    op: equals
    value: true
  urgency: MEDIUM
  reason_code: INCREASE_LUXURY_EXCLUSION
  reason_de: Bei Luxuswohnungen und Einfamilienhäusern ab sechs Wohnräumen gilt der Missbrauchsschutz
    nicht (Art. 253b Abs. 2 OR). Rechtsperson bald.
  professionals: *id001
- id: RI_UNTERSCHRIFT
  description: Klientin soll unterschreiben oder hat zugestimmt (G9).
  when:
    any:
    - ref: fact.asked_to_sign
      op: equals
      value: true
    - ref: fact.increase_already_reacted
      op: equals
      value: true
  urgency: HIGH
  reason_code: INCREASE_SIGNATURE_OR_CONSENT
  reason_de: 'Die Klientin soll etwas unterschreiben oder hat schon zugestimmt. Das kann die Anfechtung
    ausschliessen: nicht unterschreiben, bevor die Rechtsperson geprüft hat. Rechtsperson sofort.'
  professionals: *id001
- id: RI_NICHT_FINANZIERBAR
  description: 'Erhöhung nicht finanzierbar oder über der Mietzinslimite der Sozialhilfe: SOZIAL (+ RECHT).'
  when:
    ref: fact.rent_affordable
    op: equals
    value: false
  urgency: MEDIUM
  reason_code: INCREASE_NOT_AFFORDABLE
  reason_de: Die erhöhte Miete ist nicht finanzierbar oder liegt über der Mietzinslimite. Die Sozialarbeiterin
    klärt Finanzierung bzw. Mietzinslimite, um Wohnungsverlust zu vermeiden; Rechtsperson parallel (bald).
  professionals:
  - social_counselling
  - tenancy_law_counsel
- id: RI_BEFRISTET
  description: 'Befristeter Vertrag ohne Index-/Staffelklausel: Erhöhung grundsätzlich ausgeschlossen.'
  when:
    all:
    - ref: fact.contract_term_type
      op: equals
      value: befristet
    - ref: fact.rent_model
      op: equals
      value: keine
  urgency: MEDIUM
  reason_code: INCREASE_FIXED_TERM_CONTRACT
  reason_de: Bei einem echt befristeten Vertrag ohne Index- oder Staffelklausel ist eine Erhöhung grundsätzlich
    ausgeschlossen. Die Rechtsperson prüft (bald).
  professionals: *id001
- id: RI_WILL_KUENDIGEN
  description: Klientin will lieber kündigen statt anfechten.
  when:
    ref: fact.wants_to_terminate_instead
    op: equals
    value: true
  urgency: MEDIUM
  reason_code: INCREASE_TENANT_WANTS_TO_TERMINATE
  reason_de: Die Klientin möchte lieber kündigen. Der Wohnungsverlust ist abzuwägen; Rechtsperson und
    Sozialarbeiterin besprechen das (bald).
  professionals: &id002
  - tenancy_law_counsel
  - social_counselling
- id: RI_VULNERABILITY
  description: 'Besondere Belastungssituation: ausserhalb des Moduls.'
  when:
    ref: fact.vulnerability_present
    op: equals
    value: true
  urgency: MEDIUM
  reason_code: OUTSIDE_MODULE_VULNERABILITY
  reason_de: Es liegt eine besondere Belastungssituation vor. Das liegt ausserhalb dieses Moduls und gehört
    in menschliche Hände.
  professionals: *id002
- id: RI_EXPERT_REQUESTED
  description: Fachperson ausdrücklich gewünscht.
  when:
    ref: fact.client_requests_expert
    op: equals
    value: true
  urgency: LOW
  reason_code: EXPERT_REQUESTED
  reason_de: Es wurde ausdrücklich eine Fachperson gewünscht. Dieser Wunsch wird immer respektiert.
  professionals: *id001
legal_rules:
- id: RI_HINT_FORM
  description: Formular und Begründung.
  kind: HINT
  when: &id003
    ref: ctx.has_user_input
    op: equals
    value: true
  result_code: HINT_FORM_AND_REASON
  result_de: Eine Mietzinserhöhung muss auf einem amtlichen Formular mitgeteilt und begründet werden.
    Ob das hier erfüllt ist, prüft eine Fachperson.
  legal_source_ids:
  - CH_OR_269D_1
  - CH_OR_269D_2
- id: RI_HINT_ANFECHTUNG
  description: Anfechtung 30 Tage.
  kind: HINT
  when: *id003
  result_code: HINT_CONTEST_30_DAYS
  result_de: Wer eine Erhöhung für missbräuchlich hält, kann sie innert 30 Tagen nach Empfang bei der
    Schlichtungsbehörde anfechten. Wird die Frist verpasst, gilt die Erhöhung.
  legal_source_ids:
  - CH_OR_270B
  - BGE_131_III_566
- id: RI_HINT_ALTER_MIETZINS
  description: Während der Anfechtung gilt der bisherige Mietzins.
  kind: HINT
  when: *id003
  result_code: HINT_OLD_RENT_DURING_CONTEST
  result_de: Während der Anfechtung muss nur die bisherige Miete bezahlt werden. Es lohnt sich aber, die
    Differenz zur Seite zu legen, falls die Erhöhung bestätigt wird.
  legal_source_ids:
  - CH_OR_270E
  - LEHRBUCH_MIETE_31
- id: RI_HINT_KOSTENLOS
  description: Schlichtungsverfahren kostenlos.
  kind: HINT
  when: *id003
  result_code: HINT_NO_COURT_COSTS
  result_de: Das Verfahren vor der Schlichtungsbehörde kostet keine Gerichtskosten.
  legal_source_ids:
  - CH_ZPO_113_2_C
- id: RI_HINT_KUENDIGUNG_NACH_ANFECHTUNG
  description: Kündigung wegen Anfechtung ist anfechtbar.
  kind: HINT
  when: *id003
  result_code: HINT_TERMINATION_AFTER_CONTEST
  result_de: Eine Kündigung, die erfolgt, weil jemand eine Erhöhung anficht, kann ihrerseits angefochten
    werden.
  legal_source_ids:
  - CH_OR_271A_1_B_D_E
- id: RI_HINT_NEBENKOSTEN
  description: Neue Nebenkosten und Leistungsabbau.
  kind: HINT
  when:
    ref: fact.change_type
    op: in
    value:
    - neue_nebenkosten
    - leistungsabbau
    - andere
  result_code: HINT_OTHER_CHANGES_LIKE_INCREASE
  result_de: Dasselbe gilt für neue Nebenkosten oder wenn Leistungen gestrichen werden.
  legal_source_ids:
  - CH_OR_269D_3
  - CH_OR_270B
- id: RI_HINT_ZAHLEN_VERLANGEN
  description: Zahlen offenlegen lassen, Frist läuft weiter.
  kind: HINT
  when: *id003
  result_code: HINT_REQUEST_FIGURES_DEADLINE_RUNS
  result_de: Bei Erhöhungen wegen Kostensteigerungen oder Renovationen kann man verlangen, dass die Vermieterschaft
    die Zahlen offenlegt. Die 30-Tage-Frist läuft dabei aber weiter.
  legal_source_ids:
  - CH_VMWG_20_1
- id: RI_HINT_BERATUNG
  description: Schlichtungsbehörde berät auch ohne Verfahren.
  kind: HINT
  when: *id003
  result_code: HINT_CONCILIATION_ADVICE
  result_de: Die Schlichtungsbehörde berät auch ohne Verfahren und hilft einzuschätzen, ob eine Erhöhung
    missbräuchlich ist.
  legal_source_ids:
  - CH_VMWG_21_2
- id: RI_REVIEW_FORMHINWEIS
  description: 'Formular-Vorprüfung: nur ein Hinweis.'
  kind: REVIEW_POINT
  when:
    any:
    - ref: fact.form_official_used
      op: equals
      value: false
    - ref: fact.form_reason_present
      op: equals
      value: false
    - ref: fact.form_old_new_rent_stated
      op: equals
      value: false
    - ref: fact.form_effective_date_stated
      op: equals
      value: false
    - ref: fact.form_appeal_notice_present
      op: equals
      value: false
    - ref: fact.form_page3_present
      op: equals
      value: false
  result_code: REVIEW_FORM_PRECHECK
  result_de: 'Formular-Vorprüfung (nur ein Hinweis, keine rechtliche Bewertung): Mindestens eine Pflichtangabe
    des Formulars scheint zu fehlen. Die Sozialarbeiterin bestätigt am Original; ob die Erhöhung nichtig
    ist, beurteilt die Rechtsperson.'
  legal_source_ids:
  - CH_VMWG_19_1_A
  - CH_OR_269D_2
- id: RI_REVIEW_FAKSIMILE
  description: Gedruckte Unterschrift ist zulässig.
  kind: REVIEW_POINT
  when:
    ref: fact.form_signed
    op: equals
    value: true
  result_code: REVIEW_PRINTED_SIGNATURE_VALID
  result_de: 'Prüfhinweis: Seit 1.10.2025 genügt eine auf mechanischem Weg nachgebildete (gedruckte) Unterschrift;
    ein Fehlen der Originalunterschrift ist kein Formfehler.'
  legal_source_ids:
  - CH_OR_269D_4
- id: RI_REVIEW_STAFFEL
  description: 'Staffelmiete: Erhöhungen nicht anfechtbar.'
  kind: REVIEW_POINT
  when:
    ref: fact.rent_model
    op: equals
    value: staffelmiete
  result_code: REVIEW_GRADUATED_RENT
  result_de: 'Prüfhinweis: Bei einer Staffelmiete sind die vereinbarten Erhöhungen nicht anfechtbar; für
    die Mitteilung genügt die Schriftform.'
  legal_source_ids:
  - CH_OR_270C_270D
  - CH_OR_269D_4
- id: RI_REVIEW_INDEX
  description: 'Indexmiete: nur Einwand zur Indexänderung.'
  kind: REVIEW_POINT
  when:
    ref: fact.rent_model
    op: equals
    value: indexmiete
  result_code: REVIEW_INDEXED_RENT
  result_de: 'Prüfhinweis: Bei einer Indexmiete ist nur der Einwand möglich, die Indexänderung rechtfertige
    die Erhöhung nicht.'
  legal_source_ids:
  - CH_OR_270C_270D
- id: RI_REVIEW_KURZFRISTIG
  description: 'Zu kurzfristig: Wirkung erst auf den nächsten Termin.'
  kind: REVIEW_POINT
  when: *id003
  result_code: REVIEW_SHORT_NOTICE_NEXT_TERM
  result_de: 'Prüfhinweis: Wird eine Erhöhung zu kurzfristig mitgeteilt, ist sie nicht ungültig, sondern
    wirkt erst auf den nächstfolgenden Termin. Das System nennt kein Datum.'
  legal_source_ids:
  - CH_OR_269D_1
  - BGE_131_III_566
- id: RI_REVIEW_BEGRUENDUNG_BEGLEITSCHREIBEN
  description: Begründung nur im Begleitschreiben.
  kind: REVIEW_POINT
  when:
    ref: fact.form_cover_letter_reference
    op: equals
    value: false
  result_code: REVIEW_REASON_IN_COVER_LETTER
  result_de: 'Prüfhinweis: Eine Begründung nur im Begleitschreiben ist nur zulässig, wenn das Formular
    ausdrücklich darauf verweist (Art. 19 Abs. 1bis VMWG).'
  legal_source_ids:
  - CH_VMWG_19_1BIS
  - BGE_137_III_362
- id: RI_REVIEW_FRIST_VERPASST
  description: 'Frist verpasst: Erhöhung wirksam, Formnichtigkeit bleibt prüfbar.'
  kind: REVIEW_POINT
  when:
    ref: derived.days_since_increase_receipt
    op: greater_than
    value: 29
  result_code: REVIEW_DEADLINE_MISSED
  result_de: 'Prüfhinweis: Nach Ablauf von 30 Tagen wird die Erhöhung wirksam, auch wenn sie missbräuchlich
    wäre; Formnichtigkeit kann aber weiterhin geltend gemacht werden. Herabsetzungsbegehren für die Zukunft
    prüfen.'
  legal_source_ids:
  - CH_OR_270B
  - BGE_131_III_566
  - BGE_124_III_67
  - CH_OR_270A
- id: RI_REVIEW_ORTSUEBLICH
  description: Kein Referenzzinssatz-Wert im System.
  kind: REVIEW_POINT
  when: *id003
  result_code: REVIEW_NO_REFERENCE_RATE_VALUE
  result_de: 'Prüfhinweis: Das System nennt keinen aktuellen Referenzzinssatz und rechnet nicht mit Teuerung
    oder Kosten. Den aktuellen Satz veröffentlicht das Bundesamt für Wohnungswesen (BWO).'
  legal_source_ids:
  - CH_VMWG_12A
legal_source_ids:
- CH_OR_269D_1
- CH_OR_269D_2
- CH_OR_270B
- BGE_131_III_566
- CH_OR_270E
- LEHRBUCH_MIETE_31
- CH_ZPO_113_2_C
- CH_OR_271A_1_B_D_E
