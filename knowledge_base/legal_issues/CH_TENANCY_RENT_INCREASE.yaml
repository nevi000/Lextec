title_de: Mietzinserhöhung und einseitige Vertragsänderung (Issue 7)
description: Mietzinserhöhung und andere einseitige Vertragsänderungen während eines unbefristeten Mietverhältnisses
  (Art. 269 ff. OR, VMWG; Änderungen seit 1.10.2025). Das System erkennt Formfehler-Hinweise und die 30-Tage-Frist,
  beurteilt die Missbräuchlichkeit nie.
provenance_de: 'Law-Dossier Issue 7 vom 7.11.2026; Teamentscheide: Eskalation ab 20 Tagen oder bei unbekanntem
  Empfang, Formular-Vorprüfung nur als Hinweis.'
classification:
  description: 'Passt bei Mietzinserhöhung, neuen Nebenkosten oder einseitigem Leistungsabbau (Waschküche,
    Parkplatz) durch die Vermieterschaft während eines laufenden Mietverhältnisses, auch wenn nur die
    Mitteilung / das Formular vorliegt. NICHT passend: Kündigung (Issue 1), Mängel (Issue 5).'
  typical_situations:
  - Der Vermieter hat die Miete erhöht.
  - Meine Klientin hat eine Mietzinserhöhung erhalten.
  - Die Verwaltung verlangt neu Nebenkosten für die Hauswartung.
  - Mitteilung einer Mietzinsanpassung wegen Referenzzinssatz.
  related_issues: []
