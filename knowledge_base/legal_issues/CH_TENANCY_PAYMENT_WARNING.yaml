schema_version: 1
id: CH_TENANCY_PAYMENT_WARNING
version: 1.0-dossier-2026-11-07
content_status: DRAFT
jurisdiction: CH
canton: ZH
legal_area: tenancy
issue: payment_warning
title_de: Zahlungsaufforderung mit Kündigungsandrohung (Issue 2)
description: Schriftliche Zahlungsfrist mit Kündigungsandrohung nach Art. 257d Abs. 1 OR (Wohnraum, Kanton
  Zürich). Erste Massnahme ist sozial (Zahlung sichern), parallel läuft die rechtliche Prüfung.
provenance_de: 'Law-Dossier Issue 2 vom 7.11.2026; Teamentscheide: Überweisung 3 Arbeitstage vor Fristende
  empfohlen, Empfang unbekannt/Frist läuft möglicherweise noch = sofort.'
classification:
  description: 'Passt, wenn die Vermieterschaft schriftlich eine Zahlungsfrist gesetzt und die Kündigung
    angedroht hat (Mahnung wegen Mietzinsrückstand, ''letzte Mahnung'', ''Zahlungsaufforderung mit Kündigungsandrohung'').
    NICHT passend: eine bereits ausgesprochene Kündigung (Issue 3), blosse Zahlungserinnerung ohne Androhung
    (trotzdem prüfen), Mängel ohne Zahlungsrückstand.'
  typical_situations:
  - Meine Klientin hat eine Mahnung vom Vermieter mit Kündigungsandrohung bekommen.
  - Die Verwaltung setzt 30 Tage Frist für den Mietrückstand.
  - Wir haben die Zahlungsaufforderung nach Art. 257d erhalten.
  - Die Klientin hat Mietrückstand und der Vermieter droht mit der Kündigung.
  related_issues: []
facts:
- id: tenant_role
