  review_points:
  - text_de: 'Fristbeginn: relative Empfangstheorie (tatsächlicher Empfang, spätestens 7. Tag der Abholfrist)
      – anders als bei Kündigungen (Issue 1).'
    source_ids:
    - BGE_119_II_147
    - BGE_140_III_244
  - text_de: 'Mahnung: schriftlich, Androhung, klar bezifferter Rückstand (nur Mietzins und Nebenkosten),
      Frist mindestens 30 Tage.'
    source_ids:
    - CH_OR_257D_1
    - BGER_4A_332_2025
  - text_de: 'Rechtzeitigkeit der Zahlung: Einzahlungsschein bzw. Eingang bei der Vermieterschaft bis
      Fristende.'
    source_ids:
    - BGE_124_III_145
    - BGE_119_II_232
  - text_de: Zahlungen Dritter (Sozialdienst) mit Datum und Zahlungszweck; Rücküberweisungen mit Datum.
    source_ids:
    - BGER_4A_68_2014
  - text_de: Verrechnung nur innert Frist und gegenüber der Vermieterschaft; Hinterlegung bereits fälliger
      Mietzinse tilgt nicht.
    source_ids:
    - CH_OR_120_1_2
    - OGZH_LF250009
    - BGE_147_III_218
  documents_to_request:
  - Mahnung (alle Seiten)
