    E. 3.2).
- id: payment_agreement_present
  group: history
  label_de: Ratenvereinbarung oder Gespräch vereinbart
  data_type: boolean
  priority: medium
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - MGZH_ZMP_2018_1
  question_de: Gab es eine Ratenvereinbarung, Stundung oder ein vereinbartes Gespräch mit der Vermieterschaft?
  why_needed_de: Kann eine spätere Kündigung treuwidrig machen (ZMP 2018 Nr. 1).
- id: termination_already_received
  group: history
  label_de: Kündigung bereits eingetroffen
  data_type: boolean
  required: true
  priority: high
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - CH_OR_257D_2
  question_de: Ist schon eine Kündigung eingetroffen?
  why_needed_de: Wechsel zu Issue 3 (andere Regeln).
- id: deadline_possibly_expired
  group: history
  label_de: Frist möglicherweise abgelaufen
  data_type: boolean
  priority: high
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - CH_OR_257D_2
  question_de: Ist die Zahlungsfrist möglicherweise schon abgelaufen, ohne dass vollständig bezahlt wurde?
  why_needed_de: Dann ist mit der Kündigung zu rechnen (Issue 3). Das System berechnet kein Fristende;
    die Angabe stützt sich auf die Einschätzung der Sozialarbeiterin.
- id: days_since_deadline_end
  group: history
  label_de: Tage seit Ablauf der Zahlungsfrist (geschätzt)
  data_type: integer
  priority: low
  source_ids:
  - BGER_4A_366_2008
  - LEHRBUCH_MIETE_31
  question_de: 'Falls die Frist abgelaufen ist: Wie viele Tage ist das ungefähr her?'
  why_needed_de: 'Teamentscheid 7.11.2026: 14 Tage nach Fristablauf ohne Kündigung gibt es einen Prüfhinweis
    an die Rechtsperson (möglicher Verzicht; BGer 4A_366/2008 E. 4). Das System rechnet kein Fristende.'
- id: debt_enforcement_order
  group: history
  label_de: Zahlungsbefehl erhalten
  data_type: boolean
  priority: medium
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - CH_SCHKG_74_1
  - CH_SCHKG_69_2_3
  question_de: Gibt es einen Zahlungsbefehl für die Miete?
  why_needed_de: Rechtsvorschlag innert 10 Tagen (Art. 74 Abs. 1 SchKG); er verhindert die Kündigung nicht.
escalation_rules:
- id: PW_OUT_OF_SCOPE_ROLE
  description: 'Klientin nicht Hauptmieterin: ausserhalb des Moduls.'
  when:
    ref: fact.tenant_role
    op: in
    value:
    - untermieterin
    - andere
  urgency: MEDIUM
  reason_code: OUT_OF_SCOPE_NOT_MAIN_TENANT
  reason_de: Die Klientin ist nicht selbst Hauptmieterin (z. B. Untermiete). Dieses Modul gilt dafür nicht;
    es werden keine Standardaussagen gemacht. Eine unabhängige Rechtsperson muss prüfen.
  professionals:
  - lawyer_general
  suppress_standard_statements: true
- id: PW_OUT_OF_SCOPE_OBJECT
  description: 'Geschäftsraum, Ferienwohnung bis 3 Monate, Notunterkunft: ausserhalb des Moduls.'
  when:
    ref: fact.object_type
    op: in
    value:
    - notwohnung_heim
    - ferienwohnung_bis_3_monate
    - andere
  urgency: MEDIUM
  reason_code: OUT_OF_SCOPE_OBJECT
  reason_de: Das Objekt fällt nicht unter die gewöhnliche Wohnraummiete dieses Moduls (z. B. Geschäftsraum,
    Ferienwohnung, Notunterkunft). Es werden keine Standardaussagen gemacht. Eine unabhängige Rechtsperson
    muss prüfen.
  professionals:
  - lawyer_general
  suppress_standard_statements: true
- id: PW_NOT_ZH
  description: 'Wohnung nicht im Kanton Zürich: Stellenangaben nicht anwendbar.'
  when:
    ref: fact.property_in_canton_zh
    op: equals
    value: false
  urgency: MEDIUM
  reason_code: AUTHORITY_NOT_DETERMINABLE
  reason_de: Die Wohnung liegt nicht im Kanton Zürich. Die Zürcher Stellenangaben gelten nicht; die zuständigen
    Stellen müssen separat bestimmt werden.
  professionals: &id002
  - tenancy_law_counsel
- id: PW_FRIST_LAEUFT_NICHT_BEZAHLT
  description: 'Frist läuft möglicherweise noch, nicht vollständig bezahlt: Zahlung sichern UND rechtliche
    Prüfung parallel.'
  when:
    ref: fact.payment_status
    op: in
    value:
    - nicht_bezahlt
    - teilweise
  urgency: HIGH
  reason_code: PAYMENT_DEADLINE_MAY_BE_RUNNING
  reason_de: Die Zahlungsfrist kann noch laufen und der Rückstand ist nicht vollständig bezahlt. Zahlung
    innert Frist verhindert die Kündigung (sonst keine Erstreckung). Sozialarbeiterin (Zahlung sichern)
    und Rechtsperson (Prüfung) handeln sofort und parallel.
  professionals: &id001
  - social_counselling
  - tenancy_law_counsel
- id: PW_EMPFANG_ODER_FRIST_UNBEKANNT
  description: 'Empfangsdatum, Zustellart oder Frist unbekannt: so handeln, als liefe die Frist.'
  when:
    any:
    - ref: fact.warning_receipt_date
      op: is_unknown
    - ref: fact.warning_deadline_days
      op: is_unknown
    - ref: fact.warning_delivery_method
      op: is_unknown
    - ref: fact.warning_pickup_notice_date
      op: is_unknown
  urgency: HIGH
  reason_code: WARNING_RECEIPT_OR_DEADLINE_UNKNOWN
  reason_de: 'Empfangsdatum, Zustellart oder angesetzte Frist sind unbekannt. Es wird so gehandelt, als
    liefe die Frist: so früh wie möglich vollständig zahlen; eine Fachperson bestimmt das Datum.'
  professionals: *id001
- id: PW_FRIST_UNTER_30
  description: 'Angesetzte Frist unter 30 Tagen: möglicher Mangel, keine Entwarnung.'
  when:
    ref: fact.warning_deadline_days
    op: less_than
    value: 30
  urgency: HIGH
  reason_code: WARNING_DEADLINE_UNDER_30_DAYS
  reason_de: 'Die angesetzte Zahlungsfrist beträgt weniger als 30 Tage. Ein möglicher Mangel ist rechtlich
    umstritten; es gibt keine Entwarnung: trotzdem so schnell wie möglich zahlen. Rechtsperson sofort.'
  professionals: *id002
- id: PW_ANDROHUNG_FEHLT_ODER_UNKLAR
  description: 'Keine oder unklare Kündigungsandrohung: möglicher Mangel, keine Entwarnung.'
  when:
    any:
    - ref: fact.warning_threat_present
      op: equals
      value: false
    - ref: fact.warning_threat_present
      op: is_unknown
  urgency: HIGH
  reason_code: WARNING_THREAT_MISSING_OR_UNCLEAR
  reason_de: Die Kündigungsandrohung fehlt oder ist unklar. Das kann die spätere Kündigung ungültig machen,
    ist aber keine Entwarnung. Rechtsperson sofort.
  professionals: *id002
- id: PW_BETRAG_UNKLAR
  description: Betrag unklar oder enthält anderes als Mietzins/Nebenkosten.
  when:
    any:
    - ref: fact.warning_amount_clear
      op: equals
      value: false
    - ref: fact.warning_claim_type
      op: in
      value:
      - enthaelt_anderes
      - unklar
  urgency: HIGH
  reason_code: WARNING_AMOUNT_UNCLEAR
  reason_de: Der verlangte Betrag ist unklar oder enthält Posten ausser Mietzins und Nebenkosten. Rechtsperson
    sofort; den unbestrittenen Mietzins trotzdem zahlen.
  professionals: *id002
- id: PW_FAMILIENWOHNUNG_NICHT_SEPARAT
  description: 'Familienwohnung: Mahnung nicht separat an die Partnerperson zugestellt (Art. 266n OR).'
  when:
    all:
    - ref: fact.family_home_with_spouse
      op: equals
      value: true
    - ref: fact.spouse_still_lives_there
      op: equals
      value: true
    - ref: fact.warning_family_separate
      op: equals
      value: false
  urgency: HIGH
  reason_code: WARNING_FAMILY_HOME_NOT_SEPARATE
  reason_de: Bei einer Familienwohnung hat die Partnerperson laut Angabe keine separate Mahnung erhalten.
    Möglicher Mangel; keine Entwarnung. Rechtsperson sofort.
  professionals: *id002
- id: PW_MITMIETER_NICHT_ALLE
  description: Mitmieter haben die Mahnung nicht alle erhalten (BGE 140 III 491).
  when:
    ref: fact.warning_cotenants_all_notified
    op: equals
    value: false
  urgency: HIGH
  reason_code: WARNING_COTENANT_NOT_NOTIFIED
  reason_de: Nicht alle Mitmieter haben die Mahnung erhalten. Möglicher Mangel; keine Entwarnung. Rechtsperson
    sofort.
  professionals: *id002
- id: PW_MIETE_ZURUECKBEHALTEN
  description: 'Miete wegen Mängeln zurückbehalten: Schutzregel, Bezug zu Issue 5.'
  when:
    ref: fact.rent_withheld_for_defects
    op: equals
    value: true
  urgency: HIGH
  reason_code: RENT_WITHHELD_FOR_DEFECTS
  reason_de: Die Miete wurde wegen Mängeln nicht (voll) bezahlt. Das schützt nicht vor der Kündigung.
    Rechtsperson sofort; die Mängel werden in Issue 5 behandelt.
  professionals: *id002
  routes_to_issue: CH_TENANCY_DEFECTS
- id: PW_GEGENFORDERUNG
  description: 'Gegenforderung/Verrechnung gewünscht: nur innert Frist und beweisbar.'
  when:
    ref: fact.counterclaim_present
    op: equals
    value: true
  urgency: HIGH
  reason_code: COUNTERCLAIM_NEEDS_LEGAL_REVIEW
  reason_de: Es besteht eine Gegenforderung. Eine Verrechnung ist nur innert Frist, gegenüber der Vermieterschaft
    und beweisbar möglich. Im Zweifel zahlen; Rechtsperson sofort.
  professionals: *id002
- id: PW_SOZIALDIENST_ZAHLUNG_AUSGEBLIEBEN
  description: 'Sozialdienst zahlt direkt, Zahlung ausgeblieben: Interessenkonflikt.'
  when:
    all:
    - ref: fact.rent_payer
      op: equals
      value: sozialdienst
    - ref: fact.social_payment_failed
      op: equals
      value: true
  urgency: HIGH
  reason_code: SOCIAL_SERVICE_PAYMENT_FAILED
  reason_de: 'Der Sozialdienst zahlt die Miete direkt und die Zahlung ist ausgeblieben. Der Sozialdienst
    ist selbst beteiligt: sofort intern klären und eine unabhängige Rechtsperson beiziehen.'
  professionals:
  - independent_legal_body
  - social_counselling
- id: PW_DRITTZAHLUNG_STREIT
  description: Dritte (z. B. Sozialdienst) haben gezahlt; Vermieterschaft schickt Geld zurück.
  when:
    all:
    - ref: fact.third_party_payment
      op: equals
      value: true
    - ref: fact.payment_returned_by_landlord
      op: equals
      value: true
  urgency: HIGH
  reason_code: THIRD_PARTY_PAYMENT_RETURNED
  reason_de: Dritte haben gezahlt und die Vermieterschaft hat Geld zurückgeschickt oder die Zahlung bestritten.
    Datum der Rücküberweisung festhalten; vor Fristende sofort neu zahlen. Sozialarbeiterin und Rechtsperson
    sofort.
  professionals: *id001
- id: PW_FRIST_ABGELAUFEN
  description: 'Frist möglicherweise abgelaufen, nicht bezahlt: Kündigung zu erwarten (Issue 3).'
  when:
    all:
    - ref: fact.deadline_possibly_expired
      op: equals
      value: true
    - ref: fact.payment_status
      op: in
      value:
      - nicht_bezahlt
      - teilweise
  urgency: HIGH
  reason_code: WARNING_DEADLINE_POSSIBLY_EXPIRED
  reason_de: Die Frist ist möglicherweise abgelaufen und der Rückstand ist nicht vollständig bezahlt.
    Eine Kündigung ist zu erwarten; die Anfechtungsfrist würde mit deren Empfang beginnen. Sozialarbeiterin
    und Rechtsperson sofort.
  professionals: *id001
  routes_to_issue: CH_TENANCY_PAYMENT_DEFAULT
- id: PW_KUENDIGUNG_ERHALTEN
  description: 'Kündigung bereits erhalten: Wechsel zu Issue 3.'
  when:
    ref: fact.termination_already_received
    op: equals
    value: true
  urgency: HIGH
  reason_code: TERMINATION_ALREADY_RECEIVED
  reason_de: Es ist schon eine Kündigung eingetroffen. Dafür gelten andere Regeln (Issue 3); sofortige
    rechtliche und soziale Prüfung.
  professionals: *id001
  routes_to_issue: CH_TENANCY_PAYMENT_DEFAULT
- id: PW_ABSPRACHE
  description: 'Ratenvereinbarung/Gespräch vereinbart: Treu und Glauben.'
  when:
    ref: fact.payment_agreement_present
    op: equals
    value: true
  urgency: MEDIUM
  reason_code: PAYMENT_AGREEMENT_PRESENT
  reason_de: Es gab eine Ratenvereinbarung, Stundung oder ein vereinbartes Gespräch. Das kann eine spätere
    Kündigung treuwidrig machen; schriftlich festhalten, Rechtsperson bald.
  professionals: *id002
- id: PW_ZAHLUNGSBEFEHL
  description: 'Zahlungsbefehl erhalten: Rechtsvorschlag innert 10 Tagen.'
  when:
    ref: fact.debt_enforcement_order
    op: equals
    value: true
  urgency: HIGH
  reason_code: DEBT_ENFORCEMENT_ORDER_RECEIVED
  reason_de: Es liegt ein Zahlungsbefehl vor. Der Rechtsvorschlag ist innert 10 Tagen nach Zustellung
    nötig; er stoppt nur die Betreibung, nicht die Kündigung. Rechtsperson sofort.
  professionals: *id002
- id: PW_VULNERABILITY
  description: 'Besondere Belastungssituation: ausserhalb des Moduls.'
  when:
    ref: fact.vulnerability_present
    op: equals
    value: true
  urgency: MEDIUM
  reason_code: OUTSIDE_MODULE_VULNERABILITY
  reason_de: Es liegt eine besondere Belastungssituation vor. Das liegt ausserhalb dieses Moduls und gehört
    in menschliche Hände.
  professionals: *id001
- id: PW_EXPERT_REQUESTED
  description: Fachperson ausdrücklich gewünscht (Autonomie).
  when:
    ref: fact.client_requests_expert
    op: equals
    value: true
  urgency: LOW
  reason_code: EXPERT_REQUESTED
  reason_de: Es wurde ausdrücklich eine Fachperson gewünscht. Dieser Wunsch wird immer respektiert.
  professionals: *id002
legal_rules:
- id: PW_HINT_VOLLE_ZAHLUNG
  description: Ganze Zahlung innert Frist.
  kind: HINT
  when: &id003
    ref: ctx.has_user_input
    op: equals
    value: true
  result_code: HINT_FULL_PAYMENT_IN_TIME
  result_de: Wird der ganze ausstehende Betrag innerhalb der gesetzten Frist bezahlt, darf deswegen nicht
    gekündigt werden.
  legal_source_ids:
  - CH_OR_257D_1
  - CH_OR_257D_2
- id: PW_HINT_30_TAGE
  description: Mindestfrist Wohnung.
  kind: HINT
  when: *id003
  result_code: HINT_MIN_30_DAYS
  result_de: Bei Wohnungen muss die Zahlungsfrist mindestens 30 Tage betragen.
  legal_source_ids:
  - CH_OR_257D_1
- id: PW_HINT_FRISTBEGINN
  description: Fristbeginn relative Empfangstheorie.
  kind: HINT
  when: *id003
  result_code: HINT_DEADLINE_START
  result_de: Die Frist beginnt, wenn die Mahnung tatsächlich in Empfang genommen wird; wird ein Einschreiben
    nicht abgeholt, spätestens am letzten Tag der 7-tägigen Abholfrist. Bitte trotzdem so früh wie möglich
    zahlen.
  legal_source_ids:
  - BGE_119_II_147
- id: PW_HINT_ZAHLWEG
  description: Einzahlungsschein / Überweisung.
  kind: HINT
  when: *id003
  result_code: HINT_PAYMENT_WAY
  result_de: Am sichersten ist die Zahlung mit dem Einzahlungsschein, der der Mahnung beiliegt; Quittung
    aufbewahren. Bei einer Überweisung muss das Geld spätestens am letzten Tag der Frist bei der Vermieterschaft
    sein; den Auftrag deshalb mehrere Arbeitstage vorher erteilen.
  legal_source_ids:
  - BGE_124_III_145
  - BGE_119_II_232
- id: PW_HINT_UEBERWEISUNG_PUFFER
  description: Produktempfehlung 3 Arbeitstage (Teamentscheid).
  kind: HINT
  when: *id003
  result_code: HINT_TRANSFER_BUFFER_3_DAYS
  result_de: 'Produktempfehlung: Eine Überweisung, auch durch den Sozialdienst, spätestens 3 Arbeitstage
    vor Fristende auslösen. Das ist ein Puffer für Bankverarbeitung und Wochenende, keine gesetzliche
    Frist.'
  legal_source_ids:
  - PRODUKTREGEL
  - BGER_4A_366_2008
- id: PW_HINT_RESTBETRAG
  description: Auch kleine Restbeträge zählen.
  kind: HINT
  when:
    ref: fact.payment_status
    op: equals
    value: teilweise
  result_code: HINT_SMALL_REST_COUNTS
  result_de: Auch kleine Restbeträge zählen. Bitte den ganzen Betrag zahlen.
  legal_source_ids:
  - BGE_140_III_591
- id: PW_HINT_BESTRITTEN
  description: Bestrittener Betrag.
  kind: HINT
  when:
    any:
    - ref: fact.amount_disputed
      op: equals
      value: true
    - ref: fact.warning_amount_clear
      op: equals
      value: false
  result_code: HINT_DISPUTED_AMOUNT
  result_de: Wer den Betrag für falsch hält, sollte den nach eigener Kenntnis geschuldeten Betrag fristgerecht
    zahlen und die Vermieterschaft schriftlich auf den Fehler hinweisen. Nicht zu zahlen ist riskant.
  legal_source_ids:
  - BGE_140_III_591
  - BGER_4A_332_2025
- id: PW_HINT_FAMILIENWOHNUNG
  description: Separate Zustellung bei Familienwohnung.
  kind: HINT
  when:
    ref: fact.family_home_with_spouse
    op: equals
    value: true
  result_code: HINT_FAMILY_HOME_SEPARATE
  result_de: Bei einer Familienwohnung muss auch die Mahnung beiden Ehegatten separat zugestellt werden.
    Ob das eingehalten wurde, prüft eine Fachperson.
  legal_source_ids:
  - CH_OR_266N
- id: PW_HINT_FOLGE
  description: Folge der Nichtzahlung.
  kind: HINT
  when: *id003
  result_code: HINT_CONSEQUENCE_NON_PAYMENT
  result_de: Wird nicht rechtzeitig bezahlt, kann mit mindestens 30 Tagen auf Ende eines Monats gekündigt
    werden, und eine Erstreckung ist dann ausgeschlossen. Eine zweite Mahnung ist nicht nötig.
  legal_source_ids:
  - CH_OR_257D_2
  - CH_OR_272A_1_A
  - BGE_140_III_591
- id: PW_HINT_MAENGEL
  description: Zurückbehalten/Hinterlegung.
  kind: HINT
  when:
    ref: fact.rent_withheld_for_defects
    op: equals
    value: true
  result_code: HINT_NO_WITHHOLDING
  result_de: Den Mietzins wegen Mängeln zurückzubehalten oder bereits fällige Mietzinse zu hinterlegen
    schützt nicht vor der Kündigung. Bitte vorher eine Fachperson fragen.
  legal_source_ids:
  - CH_OR_259G
  - BGE_147_III_218
- id: PW_HINT_DRITTZAHLUNG
  description: Dritte können zahlen.
  kind: HINT
  when:
    any:
    - ref: fact.third_party_payment
      op: equals
      value: true
    - ref: fact.rent_payer
      op: in
      value:
      - sozialdienst
      - andere
  result_code: HINT_THIRD_PARTY_PAYMENT
  result_de: 'Die Miete kann auch der Sozialdienst oder eine andere Person bezahlen; das zählt wie eine
    Zahlung der Klientin. Wichtig: innert Frist, direkt an die Vermieterschaft und mit Angabe von Mieterin
    und Monaten.'
  legal_source_ids:
  - BGER_4A_68_2014
- id: PW_HINT_RUECKUEBERWEISUNG
  description: Rücküberweisung melden.
  kind: HINT
  when:
    ref: fact.payment_returned_by_landlord
    op: equals
    value: true
  result_code: HINT_RETURNED_PAYMENT
  result_de: Schickt die Vermieterschaft eine Zahlung zurück, bitte sofort melden und das Datum festhalten.
  legal_source_ids:
  - BGER_4A_68_2014
- id: PW_REVIEW_FRIST_ZU_KURZ
  description: Folgen einer zu kurzen Zahlungsfrist sind umstritten.
  kind: REVIEW_POINT
  when:
    ref: fact.warning_deadline_days
    op: less_than
    value: 30
  result_code: REVIEW_SHORT_DEADLINE
  result_de: 'Folgen einer zu kurzen Zahlungsfrist sind umstritten (herrschende Lehre: unwirksam/nichtig;
    Minderheit: Umdeutung; Bundesgericht offen). Keine Entwarnung.'
  legal_source_ids:
  - CH_OR_257D_1
  - LEHRBUCH_MIETE_31
- id: PW_REVIEW_WARTEZEIT
  description: 14 Tage nach Fristablauf noch keine Kündigung (Teamentscheid).
  kind: REVIEW_POINT
  when:
    all:
    - ref: fact.days_since_deadline_end
      op: greater_than
      value: 13
    - ref: fact.termination_already_received
      op: equals
      value: false
  result_code: REVIEW_WAITING_TIME_14_DAYS
  result_de: 'Prüfhinweis an die Rechtsperson: 14 oder mehr Tage nach Fristablauf ist noch keine Kündigung
    eingetroffen. Möglicher Verzicht der Vermieterschaft (knapp drei Wochen gelten als Grenze); keine
    Entwarnung, trotzdem zahlen.'
  legal_source_ids:
  - BGER_4A_366_2008
  - LEHRBUCH_MIETE_31
- id: PW_REVIEW_NEBENKOSTEN
  description: Nebenkosten nur bei Vereinbarung.
  kind: REVIEW_POINT
  when:
    ref: fact.warning_claim_type
    op: equals
    value: enthaelt_anderes
  result_code: REVIEW_ANCILLARY_COSTS
  result_de: 'Prüfhinweis: Nebenkosten sind nur geschuldet, wenn sie besonders vereinbart wurden (Art.
    257a Abs. 2 OR); Mahngebühren, Schadenersatz und Kaution fallen nicht unter Art. 257d OR.'
  legal_source_ids:
  - CH_OR_257A
  - CH_OR_257
- id: PW_REVIEW_4A_332
  description: Übertragbarkeit von 4A_332/2025 (Geschäftsraum) auf Wohnungen.
  kind: REVIEW_POINT
  when:
    ref: fact.warning_amount_clear
    op: equals
    value: false
  result_code: REVIEW_4A_332_TRANSFER
  result_de: 'Prüfhinweis: BGer 4A_332/2025 betraf einen Geschäftsraum; die Übertragbarkeit auf Wohnungen
    ist naheliegend (gleicher Art. 257d), im Team festgehalten.'
  legal_source_ids:
  - BGER_4A_332_2025
