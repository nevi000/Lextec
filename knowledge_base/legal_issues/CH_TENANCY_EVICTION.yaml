schema_version: 1
id: CH_TENANCY_EVICTION
version: 1.0-dossier-2026-11-07
content_status: DRAFT
jurisdiction: CH
canton: ZH
legal_area: tenancy
issue: eviction
title_de: Ausweisung und Räumung (Issue 6)
description: 'Ausweisungsverfahren und Räumung nach Kündigung oder Vertragsende (u. a. Art. 257, 343 ZPO).
  Dringendstes Issue: immer sofortige, parallele Eskalation; keine Rückfrage-Runden (bewusste Ausnahme
  von G7); Fristen werden nur wörtlich zitiert.'
provenance_de: 'Law-Dossier Issue 6 vom 7.11.2026; Teamentscheide: keine Rückfrage-Runden (Ausnahme zu
  G7), Unterlagenliste für die Sozialarbeiterin.'
classification:
  description: 'Passt bei Ausweisungsgesuch, Vorladung des Gerichts, Entscheid, Schreiben des Gemeinde-/Stadtammannamts,
    Räumungstermin, Schlossauswechslung oder Räumung durch die Vermieterschaft. Stichworte: Ausweisung,
    Räumung, Stadtammann, Gemeindeammann, Einzelgericht, Audienz, klare Fälle, Schloss ausgewechselt,
    ''morgen kommt das Stadtammannamt''. NICHT passend: blosse Kündigung ohne Verfahren (Issue 1/3).'
  typical_situations:
  - Morgen kommt das Stadtammannamt.
  - Meine Klientin hat ein Ausweisungsgesuch des Gerichts bekommen.
  - Der Vermieter hat das Schloss ausgewechselt.
  - Das Gericht hat die Ausweisung angeordnet, der Räumungstermin steht.
  related_issues: []
facts:
- id: tenant_role
  group: prescreening
  label_de: Vertragspartei
  data_type: enum
  enum_values:
  - hauptmieterin
  - untermieterin
  - andere
  enum_labels_de:
    hauptmieterin: Klientin ist selbst Mieterin laut Vertrag (Hauptmiete)
    untermieterin: Klientin ist Untermieterin
    andere: Weder noch (z. B. Unterkunft der Gemeinde, nicht im Vertrag)
  required: true
  priority: high
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - CH_OR_273B_1
  extraction_hint_de: Nur setzen, wenn klar ist, in welcher Rolle die Klientin zum Mietvertrag steht.
    'alleinige Mieterin' = hauptmieterin.
  question_de: Ist die Klientin selbst Mieterin laut Vertrag (nicht Untermieterin, nicht die Gemeinde)?
  why_needed_de: Nur die Vertragspartei hat den Kündigungsschutz; bei Untermiete gilt er nur, solange
    das Hauptmietverhältnis besteht (Art. 273b OR).
- id: object_type
  group: prescreening
  label_de: Objektart
  data_type: enum
  enum_values:
  - wohnung
  - moebliertes_zimmer
  - notwohnung_heim
  - ferienwohnung_bis_3_monate
  - andere
  enum_labels_de:
    wohnung: Gewöhnliche Wohnung
    moebliertes_zimmer: Möbliertes Zimmer
    notwohnung_heim: Notwohnung, Heim oder Unterkunft der Gemeinde
    ferienwohnung_bis_3_monate: Ferienwohnung (höchstens drei Monate gemietet)
    andere: Anderes Objekt
  required: true
  priority: high
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - CH_OR_253A_2
  - CH_OR_266C
  - CH_OR_266E
  extraction_hint_de: '''normale Wohnung'' = wohnung. Ferienwohnung nur bei höchstens drei Monaten Mietdauer.'
  question_de: 'Um welche Art von Objekt geht es: Wohnung, möbliertes Zimmer, Notwohnung/Heim, Ferienwohnung?'
  why_needed_de: Für Ferienwohnungen (bis 3 Monate) und Notunterkünfte gelten die Regeln dieses Moduls
    nicht; für möblierte Zimmer gilt eine andere Kündigungsfrist.
- id: property_municipality
  group: prescreening
  label_de: Gemeinde der Wohnung
  data_type: string
  required: true
  priority: medium
  source_ids:
  - CH_ZPO_33
  extraction_hint_de: Name der Gemeinde, z. B. 'Zürich'.
  question_de: In welcher Gemeinde liegt die Wohnung?
  why_needed_de: Der Ort der Wohnung bestimmt die zuständige Schlichtungsbehörde (Art. 33 ZPO).
- id: client_residence_municipality
  group: prescreening
  label_de: Wohnsitzgemeinde der Klientin (nur falls abweichend)
  description: Nur relevant, wenn die Klientin NICHT in der Wohnung wohnt oder der Sozialdienst einer
    anderen Gemeinde zuständig ist. Bestimmt die Zuständigkeit sozialer Stellen (Sozialdienst, Notunterkunft,
    KESB); die Gemeinde der Wohnung bestimmt die mietrechtlichen Stellen.
  data_type: string
  priority: low
  depends_on:
  - property_municipality
  extraction_hint_de: Nur setzen, wenn ausdrücklich eine von der Wohnung abweichende Wohnsitzgemeinde
    genannt wird (z. B. 'Die Klientin wohnt eigentlich in Bülach'). Nicht aus der Gemeinde der Wohnung
    ableiten.
  question_de: "In welcher Gemeinde wohnt die Klientin? Nur nötig, wenn der Wohnsitz nicht in der Gemeinde der Wohnung liegt; sonst bitte überspringen."
  why_needed_de: Soziale Stellen (Sozialdienst, Notunterkunft) richten sich nach der Wohnsitzgemeinde,
    mietrechtliche Stellen nach der Gemeinde der Wohnung.
- id: property_in_canton_zh
  group: prescreening
  label_de: Wohnung im Kanton Zürich
  description: 'TECHNISCHE ANNAHME (nicht im Dossier als eigenes Faktum): Das Modul ist auf den Kanton
    Zürich ausgerichtet; die Stellenangaben gelten nur dort.'
  data_type: boolean
  required: true
  priority: medium
  escalation_relevant: true
  handover_priority: high
  depends_on:
