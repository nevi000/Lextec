  - family_home_with_spouse
  - spouse_still_lives_there
  source_ids:
  - CH_OR_266N
  - CH_OR_266O
  question_de: Hat die Partnerperson eine eigene Kündigung in einem separaten Umschlag erhalten?
  why_needed_de: Fehlt die separate Zustellung, kann ein Formmangel vorliegen (Art. 266n, 266o OR); die
    Fachperson beurteilt das.
