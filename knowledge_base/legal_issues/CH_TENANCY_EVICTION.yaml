briefing_template: expert_briefing_v1
briefing_profile:
  intro_de: Ausweisung und Räumung – sofortige Weitergabe (Stadium und Dokument zuerst)
  groups:
  - id: stage
    title_de: Stadium, Dokument, Geschäftsnummer, Frist (wörtlich)
    fact_ids:
    - eviction_stage
    - eviction_document_available
    - court_reference
    - document_receipt_date
    - deadline_quoted_text
  - id: history
    title_de: Kündigung, Zahlungen, Abmachungen
    fact_ids:
    - eviction_termination_reason
    - family_home_with_spouse
    - spouse_still_lives_there
    - separate_delivery_to_spouse
    - arrears_paid_timing
    - third_party_payment
    - payment_returned_by_landlord
    - post_termination_agreement
    - challenge_filed
    - client_wants_to_sign_move_out
    - landlord_self_help
  - id: social
    title_de: Haushalt, Kinder, Gesundheit, Anschlusslösung
    fact_ids:
    - household_description
    - children_in_household
    - housing_solution_available
    - social_assistance_received
    - belongings_plan
  - id: situation
    title_de: Vorprüfung
    fact_ids:
    - tenant_role
    - object_type
    - property_municipality
    - property_in_canton_zh
    - vulnerability_present
    - client_requests_expert
    - consent_briefing
  review_points:
  - text_de: Stadium, Gericht/Amt, Geschäftsnummer und die wörtlich zitierte Frist aus dem Schreiben (nicht
      berechnet).
    source_ids:
    - CH_ZPO_239_2
    - CH_ZPO_314_1
    - CH_ZPO_321_2
  - text_de: Vorfrage Gültigkeit der Kündigung (Mahnung, Zahlung innert Frist, Form, Familienwohnung)
      und mögliche Einwände gegen den klaren Fall.
    source_ids:
    - BGE_141_III_262
    - BGE_138_III_620
    - CH_ZPO_257
  - text_de: Zahlungen Dritter (Sozialdienst) mit Datum und Zahlungszweck; Rücküberweisungen.
    source_ids:
    - BGER_4A_68_2014
  - text_de: Vollstreckung durch das Gemeinde-/Stadtammannamt, Einwände nur nach Art. 341 Abs. 3 ZPO.
    source_ids:
    - CH_ZPO_343_1_D
    - CH_ZPO_337_338_341
    - ZH_GOG_147
  documents_to_request:
  - Mietvertrag
  - Kündigung mit Couvert
  - Mahnung
  - Zahlungsbelege inkl. Zahlungen des Sozialdienstes
  - Gesuch und Vorladung des Gerichts
  - Schreiben des Gemeinde- oder Stadtammannamts
  authority_ids:
  - EINZELGERICHT_BEZIRKSGERICHT_ZH
  - MIETGERICHT_ZH
  - OBERGERICHT_ZH_ZIVILKAMMER
  - STADTAMMANNAMT_ZH
  - SOZIALDIENST_WOHNGEMEINDE
  - NOTUNTERKUNFT_FAMILIEN_STADT_ZH
  - NOTSCHLAFSTELLE_ZH
  - MIETERVERBAND_ZH
