- id: separate_delivery_to_spouse
  group: form
  label_de: Separate Zustellung an die Partnerperson
  data_type: boolean
  required_if:
    all:
    - ref: fact.family_home_with_spouse
      op: equals
      value: true
    - ref: fact.spouse_still_lives_there
      op: equals
      value: true
  priority: high
  escalation_relevant: true
  handover_priority: high
