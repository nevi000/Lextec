  question_de: Liegt die Wohnung im Kanton Zürich?
  why_needed_de: Die Zürcher Stellen und Hinweise gelten nur für Wohnungen im Kanton Zürich.
- id: family_home_with_spouse
  group: form
  label_de: Familienwohnung (Ehe-/eingetragene Partnerperson)
  data_type: boolean
