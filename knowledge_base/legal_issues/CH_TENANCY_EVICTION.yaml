escalation_rules:
- id: EV_OUT_OF_SCOPE_OBJECT
  description: 'Geschäftsraum, Pacht, Zimmer in Heim oder Notwohnung: andere Regeln / ausserhalb des Moduls
    (G5).'
  when:
    ref: fact.object_type
    op: in
    value:
    - notwohnung_heim
    - ferienwohnung_bis_3_monate
    - andere
  urgency: MEDIUM
  reason_code: OUT_OF_SCOPE_OBJECT
  reason_de: Das Objekt fällt nicht unter die gewöhnliche Wohnraummiete dieses Moduls (z. B. Geschäftsraum,
    Heim, Notwohnung). Es werden keine Standardaussagen gemacht; Rechtsperson und Sozialarbeiterin prüfen
    sofort.
  professionals: &id001
  - tenancy_law_counsel
  - social_counselling
  suppress_standard_statements: true
- id: EV_RAEUMUNG_STEHT
  description: 'Räumungstermin steht oder Räumung findet statt: SOZIAL + RECHT.'
  when:
    ref: fact.eviction_stage
    op: in
    value:
    - ammannamt_raeumungstermin
    - raeumung_heute_oder_schloss
  urgency: HIGH
  reason_code: EVICTION_DATE_SET_OR_TODAY
  reason_de: Ein Räumungstermin steht oder die Räumung findet statt. Sofort Unterkunft, Kinder und Hab
    und Gut sichern (Sozialarbeiterin) und restliche Einwände prüfen (Rechtsperson). Das Datum steht im
    Schreiben; das System rechnet nichts.
  professionals:
  - social_counselling
  - tenancy_law_counsel
- id: EV_GRUNDREGEL
  description: 'Ausweisung/Räumung: IMMER sofort Rechtsperson + Sozialarbeiterin, keine Rückfrage-Runden,
    kein KI_WEITER.'
  when: &id003
    ref: ctx.has_user_input
    op: equals
    value: true
  urgency: HIGH
  reason_code: EVICTION_ALWAYS_IMMEDIATE
  reason_de: 'Hinweis auf ein Ausweisungs- oder Räumungsverfahren: Der Wohnungsverlust ist konkret. Rechtsperson
    und Sozialarbeiterin handeln sofort und parallel (Frist prüfen, Unterkunft sichern). Das System stellt
    keine Rückfragen vor der Eskalation und macht keine Erfolgsprognose.'
  professionals: *id001
- id: EV_SELBSTHILFE
  description: 'Vermieterschaft räumt ohne Gericht: unzulässige Selbsthilfe.'
  when:
    ref: fact.landlord_self_help
    op: equals
    value: true
  urgency: HIGH
  reason_code: LANDLORD_SELF_HELP
  reason_de: Die Vermieterschaft hat ohne Gericht das Schloss gewechselt, Sachen entfernt oder Leistungen
    abgestellt. Das ist unzulässig und kann strafbar sein; das System bewertet das nicht. Rechtsperson
    und Sozialarbeiterin sofort, nötigenfalls Polizei.
  professionals: *id001
- id: EV_STADIUM_UNKLAR
  description: 'Stadium unklar: sofort, keine Rückfrage-Schleife.'
  when:
    ref: fact.eviction_stage
    op: is_unknown
  urgency: HIGH
  reason_code: EVICTION_STAGE_UNCLEAR
  reason_de: 'Das Stadium des Verfahrens ist unklar. Es wird so gehandelt, als laufe bereits eine Frist:
    Rechtsperson und Sozialarbeiterin sofort.'
  professionals: *id001
- id: EV_NUR_KUENDIGUNG_ZAHLUNGSVERZUG
  description: 'Nur Kündigung wegen Zahlungsverzug, noch kein Verfahren: Issue 3.'
  when:
    all:
    - ref: fact.eviction_stage
      op: equals
      value: nur_kuendigung
    - ref: fact.eviction_termination_reason
      op: equals
      value: zahlungsverzug
  urgency: HIGH
  reason_code: EVICTION_NOT_YET_STARTED_PAYMENT_DEFAULT
  reason_de: Es liegt bisher nur eine Kündigung wegen Zahlungsverzug vor; ein Ausweisungsverfahren ist
    noch nicht eingeleitet. Die Regeln von Issue 3 gelten; sofortige Prüfung bleibt.
  professionals: *id001
  routes_to_issue: CH_TENANCY_PAYMENT_DEFAULT
- id: EV_NUR_KUENDIGUNG_ANDERE
  description: 'Nur Kündigung (nicht Zahlungsverzug), noch kein Verfahren: Issue 1.'
  when:
    all:
    - ref: fact.eviction_stage
      op: equals
      value: nur_kuendigung
    - ref: fact.eviction_termination_reason
      op: in
      value:
      - ordentlich
      - vertragsende
      - andere
  urgency: HIGH
  reason_code: EVICTION_NOT_YET_STARTED_TERMINATION
  reason_de: Es liegt bisher nur eine Kündigung vor; ein Ausweisungsverfahren ist noch nicht eingeleitet.
    Die Regeln von Issue 1 gelten; sofortige Prüfung bleibt.
  professionals: *id001
  routes_to_issue: CH_TENANCY_TERMINATION
- id: EV_UNTERSCHRIFT_AUSZUG
  description: Klientin will 'freiwillig' einen Auszugstermin unterschreiben (G9).
  when:
    ref: fact.client_wants_to_sign_move_out
    op: equals
    value: true
  urgency: HIGH
  reason_code: EVICTION_SIGNATURE_RISK
  reason_de: 'Die Klientin möchte einen Auszugstermin oder eine Vereinbarung unterschreiben. Das kann
    nicht rückgängig zu machende Folgen haben: nicht unterschreiben, bevor die Rechtsperson geprüft hat.'
  professionals: &id002
  - tenancy_law_counsel
- id: EV_ANFECHTUNG_HAENGIG
  description: 'Anfechtung der Kündigung läuft: schützt nicht automatisch vor Ausweisung.'
  when:
    ref: fact.challenge_filed
    op: equals
    value: true
  urgency: HIGH
  reason_code: EVICTION_CHALLENGE_PENDING
  reason_de: Die Kündigung ist angefochten oder eine Erstreckung verlangt. Das schützt nicht automatisch
    vor einer Ausweisung. Gericht und Geschäftsnummer der Anfechtung ins Briefing; auf jedes Schreiben
    reagieren.
  professionals: *id002
- id: EV_NACHZAHLUNG
  description: 'Rückstand nach Ablauf der Zahlungsfrist bezahlt: heilt die Kündigung nicht.'
  when:
    ref: fact.arrears_paid_timing
    op: equals
    value: nach_fristablauf
  urgency: HIGH
  reason_code: EVICTION_LATE_PAYMENT_NOT_HEALING
  reason_de: Der Rückstand wurde erst nach Ablauf der Zahlungsfrist bezahlt. Das heilt die Kündigung nicht;
    eine Einigung mit der Vermieterschaft kann aber möglich sein, das klärt die Rechtsperson.
  professionals: *id002
- id: EV_DRITTZAHLUNG
  description: Sozialdienst oder Dritte haben während der Zahlungsfrist gezahlt (Art. 68 OR).
  when:
    any:
    - ref: fact.third_party_payment
      op: equals
      value: true
    - ref: fact.payment_returned_by_landlord
      op: equals
      value: true
  urgency: HIGH
  reason_code: EVICTION_THIRD_PARTY_PAYMENT
  reason_de: Dritte (z. B. der Sozialdienst) haben gezahlt oder die Vermieterschaft hat Geld zurückgeschickt.
    Das kann den klaren Fall ausschliessen. Zahlungsbelege mit Datum und Zahlungszweck sofort beschaffen
    und der Rechtsperson geben.
  professionals: *id002
- id: EV_ABMACHUNG
  description: Abmachung/neuer Vertrag nach der Kündigung.
  when:
    ref: fact.post_termination_agreement
    op: equals
    value: true
  urgency: HIGH
  reason_code: EVICTION_AGREEMENT_PRESENT
  reason_de: Es gibt eine Abmachung mit der Vermieterschaft (Stundung, Ratenzahlung, neuer Vertrag, Auszugstermin).
    Schriftliche Bestätigung sichern; Einwände im Vollstreckungsverfahren nur mit Urkunden. Rechtsperson
    sofort.
  professionals: *id002
- id: EV_FAMILIENWOHNUNG
  description: 'Familienwohnung, Partnerperson nicht separat bedient: starker Einwand.'
  when:
    all:
    - ref: fact.family_home_with_spouse
      op: equals
      value: true
    - ref: fact.spouse_still_lives_there
      op: equals
      value: true
    - ref: fact.separate_delivery_to_spouse
      op: equals
      value: false
  urgency: HIGH
  reason_code: EVICTION_FAMILY_HOME_NOT_SEPARATE
  reason_de: Bei einer Familienwohnung wurde die Partnerperson laut Angabe nicht separat bedient (Mahnung/Kündigung).
    Das kann ein starker Einwand sein. Rechtsperson sofort.
  professionals: *id002
- id: EV_KEINE_ANSCHLUSSLOESUNG
  description: 'Keine Anschlusslösung nach dem Auszug: Notunterkunft.'
  when:
    any:
    - ref: fact.housing_solution_available
      op: equals
      value: false
    - ref: fact.housing_solution_available
      op: is_unknown
  urgency: HIGH
  reason_code: NO_HOUSING_SOLUTION
  reason_de: Es gibt keine Anschlusslösung (oder sie ist unbekannt). Die Sozialarbeiterin prüft sofort
    Notunterkunft, Mietzinsgarantie und Einlagerung.
  professionals:
  - social_counselling
- id: EV_GERICHTSENTSCHEID
  description: 'Entscheid des Gerichts eröffnet: sehr kurze Rechtsmittelfristen.'
  when:
    ref: fact.eviction_stage
    op: equals
    value: gerichtsentscheid
  urgency: HIGH
  reason_code: EVICTION_COURT_DECISION
  reason_de: 'Ein Gerichtsentscheid liegt vor. Rechtsmittelfristen sind sehr kurz (dem Schreiben zu entnehmen,
    vom System nicht berechnet): das Schreiben heute noch einer Rechtsperson zeigen.'
  professionals: *id002
- id: EV_VULNERABILITY
  description: 'Besondere Belastungssituation: ausserhalb des Moduls.'
  when:
    ref: fact.vulnerability_present
    op: equals
    value: true
  urgency: MEDIUM
  reason_code: OUTSIDE_MODULE_VULNERABILITY
  reason_de: Es liegt eine besondere Belastungssituation vor. Das liegt ausserhalb dieses Moduls und gehört
    in menschliche Hände.
  professionals: *id001
- id: EV_EXPERT_REQUESTED
  description: Fachperson ausdrücklich gewünscht.
  when:
    ref: fact.client_requests_expert
    op: equals
    value: true
  urgency: LOW
  reason_code: EXPERT_REQUESTED
  reason_de: Es wurde ausdrücklich eine Fachperson gewünscht. Dieser Wunsch wird immer respektiert.
  professionals: *id002
legal_rules:
- id: EV_HINT_KEINE_SELBSTHILFE
  description: Räumung nur durch Gerichtsentscheid.
  kind: HINT
  when: *id003
  result_code: HINT_NO_SELF_EVICTION
  result_de: Die Vermieterschaft darf die Wohnung nicht selbst räumen. Dafür braucht es einen Entscheid
    eines Gerichts.
  legal_source_ids:
  - CH_ZPO_343_1_D
  - LEHRBUCH_MIETE_31
- id: EV_HINT_BEHOERDENFRIST
  description: Kurze Behördenfristen.
  kind: HINT
  when: *id003
  result_code: HINT_SHORT_AUTHORITY_DEADLINES
  result_de: Schreiben von Gericht oder Ammannamt enthalten oft sehr kurze Fristen. Bitte heute noch einer
    Rechtsfachperson zeigen.
  legal_source_ids:
  - CH_ZPO_239_2
  - CH_ZPO_314_1
  - CH_ZPO_321_2
- id: EV_HINT_ANFECHTUNG
  description: Anfechtung schützt nicht automatisch.
  kind: HINT
  when: *id003
  result_code: HINT_CHALLENGE_NO_PROTECTION
  result_de: Auch wenn die Kündigung angefochten ist, kann ein Ausweisungsverfahren laufen. Reagieren
    Sie deshalb auf jedes Schreiben.
  legal_source_ids:
  - BGE_141_III_262
- id: EV_HINT_NACHZAHLUNG
  description: Nachzahlung nach Fristablauf.
  kind: HINT
  when:
    ref: fact.arrears_paid_timing
    op: equals
    value: nach_fristablauf
  result_code: HINT_LATE_PAYMENT_NOT_HEALING
  result_de: Wer nach Ablauf der Zahlungsfrist bezahlt, macht die Kündigung dadurch nicht ungültig. Eine
    Einigung mit der Vermieterschaft kann aber trotzdem möglich sein; das klärt eine Fachperson.
  legal_source_ids:
  - OGZH_LF260018
- id: EV_HINT_UNTERKUNFT
  description: Parallel Unterkunft suchen.
  kind: HINT
  when: *id003
  result_code: HINT_SEARCH_ACCOMMODATION_NOW
  result_de: Parallel zur rechtlichen Prüfung sollte jetzt eine Unterkunft gesucht werden.
  legal_source_ids:
  - PRODUKTREGEL
- id: EV_HINT_UNTERLAGEN
  description: Schreiben aufbewahren.
  kind: HINT
  when: *id003
  result_code: HINT_KEEP_DOCUMENTS
  result_de: Bewahren Sie alle Schreiben mit Umschlag und Abholungseinladung auf.
  legal_source_ids:
  - PRODUKTREGEL
- id: EV_HINT_DRITTZAHLUNG
  description: Zahlungen Dritter sichern.
  kind: HINT
  when:
    any:
    - ref: fact.third_party_payment
      op: equals
      value: true
    - ref: fact.payment_returned_by_landlord
      op: equals
      value: true
  result_code: HINT_THIRD_PARTY_PAYMENT_EVIDENCE
  result_de: Hat der Sozialdienst oder eine andere Person während der Zahlungsfrist für die Klientin bezahlt,
    kann das entscheidend sein. Bitte alle Zahlungsbelege mit Datum und Zahlungszweck sofort der Rechtsperson
    geben.
  legal_source_ids:
  - BGER_4A_68_2014
- id: EV_REVIEW_KLARER_FALL
  description: Einwände verhindern den klaren Fall.
  kind: REVIEW_POINT
  when: *id003
  result_code: REVIEW_CLEAR_CASE_OBJECTIONS
  result_de: 'Prüfhinweis: Im Verfahren für klare Fälle tritt das Gericht nicht ein, wenn Sachverhalt
    oder Rechtslage nicht klar sind (Art. 257 Abs. 3 ZPO); substanziierte und schlüssige Einwände genügen.
    Die Vermieterschaft kann dann den ordentlichen Weg gehen (kein endgültiger Sieg).'
  legal_source_ids:
  - CH_ZPO_257
  - BGE_138_III_620
  - BGE_138_III_123
  - BGE_140_III_315
- id: EV_REVIEW_STREITWERT
  description: Berufung/Beschwerde, Aufschub.
  kind: REVIEW_POINT
  when: *id003
  result_code: REVIEW_APPEAL_SUSPENSIVE_EFFECT
  result_de: 'Prüfhinweis: Berufung ab CHF 10 000 Streitwert hemmt die Vollstreckbarkeit; die Beschwerde
    darunter nicht automatisch. Die Rechtsperson muss ggf. Aufschub beantragen.'
  legal_source_ids:
  - CH_ZPO_308_2
  - CH_ZPO_315_1
  - CH_ZPO_325
- id: EV_REVIEW_KINDER
  description: 'Kinder, Krankheit, Alter: kein Hindernis bei Zahlungsverzug.'
  kind: REVIEW_POINT
  when:
    ref: fact.children_in_household
    op: equals
    value: true
  result_code: REVIEW_CHILDREN_NO_BAR
  result_de: 'Prüfhinweis: Kinder, Krankheit oder hohes Alter sind bei Zahlungsverzug kein rechtliches
    Hindernis der Ausweisung; im Vordergrund steht die soziale Notfallplanung.'
  legal_source_ids:
  - CH_OR_272A_1_A
  - BGER_4A_391_2013
  - OGZH_LF260018
