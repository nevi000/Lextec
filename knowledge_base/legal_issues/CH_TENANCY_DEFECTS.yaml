issue: defects
title_de: Mängel an der Mietsache (Issue 5)
description: Mängel an der Wohnung (Art. 256, 258–259i OR) einschliesslich Gesundheits- und Schutzbedarf
  (Regeln H1–H7). Einfache Fälle ohne Geld, Frist und Gesundheitsangaben darf das System selbst weiterführen
  (PROCEED); sonst Eskalation.
provenance_de: 'Law-Dossier Issue 5 vom 7.11.2026 inkl. Abschnitt 3a; Teamentscheide: 30 Tage ohne Reaktion,
  KI_WEITER nur in einfachen Fällen, Musterbrief ohne Prozentzahl und Hinterlegungsandrohung.'
classification:
  description: 'Passt bei Mängeln an der Mietwohnung: Schimmel, Feuchtigkeit, Heizung/Warmwasser defekt,
    Wasserschaden, Ungeziefer, Lärm, defekte Geräte, Bauarbeiten, auch wenn Mietzins gekürzt oder hinterlegt
    werden soll. NICHT passend: Kündigung (Issue 1/3), Mietzinserhöhung (Issue 7).'
  typical_situations:
  - In der Wohnung ist Schimmel im Schlafzimmer.
  - Die Heizung ist seit Wochen defekt und der Vermieter reagiert nicht.
  - Meine Klientin hat die Miete gekürzt wegen Mängeln.
  - Wasserschaden in der Wohnung, die Verwaltung tut nichts.
  related_issues: []
