    - ref: fact.defect_type
      op: equals
      value: schimmel
    - ref: fact.health_safety_danger
      op: equals
      value: true
  priority: high
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - BAG_SCHIMMEL_2021
  question_de: Werden die betroffenen Räume zum Schlafen genutzt?
  why_needed_de: 'BAG 2021: besondere Vorsicht bei Schlaf- und Kinderzimmern. UNBEKANNT ist nie NEIN.'
- id: reported_extent
  group: health
  label_de: Ausmass des Befalls
  data_type: enum
  enum_values:
  - klein
  - groesser
  - nur_geruch
  enum_labels_de:
    klein: Klein (eine Stelle bis ca. 10 × 10 cm)
    groesser: Grösser (mehrere Stellen oder über ca. 70 × 70 cm)
    nur_geruch: Nur Geruch
  required_if: &id008
    ref: fact.defect_type
    op: equals
    value: schimmel
  priority: high
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - BAG_SCHIMMEL_2021
  - BGER_4C_97_2003
  question_de: "Wie zeigt sich der Schimmel: nur als Geruch, als kleine Stelle oder als grössere Fläche?"
  why_needed_de: Grobe Zuordnung zu den BAG-Kategorien, nur für die Dringlichkeit; keine rechtliche Einordnung.
- id: health_symptoms_reported
  group: health
  label_de: Gesundheitliche Beschwerden gemeldet
  data_type: boolean
  required_if: *id001
  priority: high
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - BAG_SCHIMMEL_2021
  extraction_hint_de: true, wenn Beschwerden berichtet werden (z. B. Husten). KEINE Diagnose und keine
    Ursache übernehmen.
  store_evidence: false
  question_de: Berichtet jemand über gesundheitliche Beschwerden? (Nur ja/nein, keine Diagnose.)
  why_needed_de: Ärztliche Abklärung empfehlen (BAG 2021). Das System speichert keine Diagnose und macht
    keine Ursachenaussage.
- id: medical_risk_reported
  group: health
  label_de: Besondere gesundheitliche Gefährdung bekannt
  data_type: boolean
  required_if: *id001
  priority: high
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - BAG_SCHIMMEL_2021
  - CH_DSG_6_7
  store_evidence: false
  question_de: Ist eine besondere gesundheitliche Gefährdung bekannt oder ärztlich mitgeteilt worden?
    (Nur ja/nein, keine Diagnose erfassen.)
  why_needed_de: 'BAG: gefährdete Personen sollen rasch ärztlich abklären. Art. 5 lit. c Ziff. 2 DSG:
    besonders schützenswert.'
- id: children_exposed
  group: health
  label_de: Kinder nutzen betroffene Räume
  data_type: boolean
  required_if: *id001
  priority: high
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - BAG_SCHIMMEL_2021
  question_de: "Nutzen die Kinder, die in der Wohnung leben, die betroffenen Räume?"
  why_needed_de: Schutzbedarf (BAG 2021).
- id: can_avoid_affected_rooms
  group: health
  label_de: Räume vorübergehend meidbar
  data_type: boolean
  required_if: *id001
  priority: high
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - BAG_SCHIMMEL_2021
  question_de: Können die betroffenen Räume vorübergehend gemieden werden?
  why_needed_de: 'BAG: stark befallene Räume geschlossen halten und nicht benutzen.'
- id: safe_alternative_available
  group: health
  label_de: Sichere vorübergehende Unterkunft
  data_type: boolean
  priority: high
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - CH_BV_12
  question_de: Gibt es bei Bedarf eine sichere vorübergehende Unterkunft?
  why_needed_de: Zwischenlösung über den Sozialdienst.
- id: support_needed
  group: health
  label_de: Unterstützung benötigt
  data_type: boolean
  priority: medium
  source_ids:
  - CH_BV_12
  question_de: Wird Unterstützung benötigt, um eine Abklärung oder Zwischenunterkunft zu organisieren?
  why_needed_de: Route SOZIAL.
escalation_rules:
- id: DF_OUT_OF_SCOPE_OBJECT
  description: 'Geschäftsraum/Ferienwohnung/Notunterkunft: ausserhalb des Moduls.'
  when:
    ref: fact.object_type
    op: in
    value:
    - notwohnung_heim
    - ferienwohnung_bis_3_monate
    - andere
  urgency: MEDIUM
  reason_code: OUT_OF_SCOPE_OBJECT
  reason_de: Das Objekt fällt nicht unter die gewöhnliche Wohnraummiete dieses Moduls. Es werden keine
    Standardaussagen gemacht. Eine unabhängige Rechtsperson muss prüfen.
  professionals:
  - lawyer_general
  suppress_standard_statements: true
- id: DF_NOT_ZH
  description: Wohnung nicht im Kanton Zürich.
  when:
    ref: fact.property_in_canton_zh
    op: equals
    value: false
  urgency: LOW
  reason_code: AUTHORITY_NOT_DETERMINABLE
  reason_de: Die Wohnung liegt nicht im Kanton Zürich. Die Zürcher Stellenangaben gelten nicht; die zuständigen
    Stellen müssen separat bestimmt werden.
  professionals: &id002
  - tenancy_law_counsel
- id: DF_SUBLEASE
  description: 'Untermiete/WG-Zimmer: Mängelrechte gegenüber der Hauptmieterin.'
  when:
    ref: fact.tenant_role
    op: in
    value:
    - untermieterin
    - andere
  urgency: LOW
  reason_code: DEFECTS_SUBLEASE_PRECHECK
  reason_de: Bei Untermiete bestehen Mängelrechte gegenüber der Hauptmieterin, nicht gegenüber der Eigentümerschaft.
    Die Rechtsperson prüft die Vorfragen.
  professionals: *id002
- id: DF_ZAHLUNGSAUFFORDERUNG
  description: Zahlungsaufforderung mit Kündigungsandrohung vorhanden -> Issue 2, sofort.
  when:
    ref: fact.payment_warning_received
    op: equals
    value: true
  urgency: HIGH
  reason_code: DEFECTS_PAYMENT_WARNING_RECEIVED
  reason_de: 'Es liegt eine Zahlungsaufforderung mit Kündigungsandrohung vor; der Wohnungsverlust droht.
    Es gelten die Regeln von Issue 2: sofort zahlen und rechtlich prüfen lassen.'
  professionals: &id003
  - tenancy_law_counsel
  - social_counselling
  routes_to_issue: CH_TENANCY_PAYMENT_WARNING
- id: DF_MIETE_GEKUERZT
  description: 'Miete gekürzt, verrechnet oder zurückbehalten: Zahlungsverzug möglich.'
  when:
    ref: fact.rent_payment_status
    op: equals
    value: gekuerzt_oder_zurueckbehalten
  urgency: MEDIUM
  reason_code: DEFECTS_RENT_REDUCED_OR_WITHHELD
  reason_de: Die Klientin hat die Miete gekürzt, verrechnet oder zurückbehalten. Es droht Zahlungsverzug
    und damit eine Kündigung nach Art. 257d OR. Bis zur Prüfung durch eine Rechtsperson die volle Miete
    bezahlen. Rechtsperson bald.
  professionals: *id002
  routes_to_issue: CH_TENANCY_PAYMENT_WARNING
- id: DF_HINTERLEGUNG_LAEUFT
  description: 'Hinterlegung läuft oder ist erfolgt: 30-Tage-Frist.'
  when:
    ref: fact.rent_deposit_started
    op: equals
    value: true
  urgency: HIGH
  reason_code: DEFECTS_DEPOSIT_RUNNING
  reason_de: Es wurde schon Miete hinterlegt. Der Schlichtungsbehörde muss innert 30 Tagen ab Fälligkeit
    des ersten hinterlegten Mietzinses ein Gesuch vorliegen, sonst fällt das Geld an die Vermieterschaft.
    Rechtsperson sofort.
  professionals: *id002
- id: DF_HINTERLEGUNG_GEPLANT
  description: 'Klientin will hinterlegen: Formvorschriften.'
  when:
    ref: fact.deposit_planned
    op: equals
    value: true
  urgency: MEDIUM
  reason_code: DEFECTS_DEPOSIT_PLANNED
  reason_de: Die Klientin möchte die Miete hinterlegen. Dafür gelten strenge Formvorschriften; ohne korrekte
    Form gilt die Miete als nicht bezahlt. Nicht selbst hinterlegen, vorher die Rechtsperson fragen. Rechtsperson
    bald.
  professionals: *id002
- id: DF_GESUNDHEIT_GEFAHR
  description: 'Gefahr für Gesundheit oder Sicherheit / Unbewohnbarkeit: Recht + Soziales sofort.'
  when:
    ref: fact.health_safety_danger
    op: equals
    value: true
  urgency: HIGH
  reason_code: DEFECTS_HEALTH_OR_SAFETY_DANGER
  reason_de: Es besteht eine Gefahr für Gesundheit oder Sicherheit oder die Wohnung ist möglicherweise
    unbewohnbar. Rechtsperson und Sozialarbeiterin handeln sofort und parallel (Notunterkunft prüfen).
  professionals: *id003
- id: DF_AUSZIEHEN
  description: Klientin will wegen des Mangels ausziehen oder fristlos kündigen.
  when:
    ref: fact.client_wish
    op: equals
    value: ausziehen
  urgency: MEDIUM
  reason_code: DEFECTS_WANTS_TO_MOVE_OUT
  reason_de: Die Klientin möchte wegen des Mangels ausziehen oder fristlos kündigen. Eine unwirksame Kündigung
    lässt den Mietzins weiter schulden; das System gibt dazu keine Empfehlung. Rechtsperson bald.
  professionals: *id002
- id: DF_KUENDIGUNG_NACH_MELDUNG
  description: Kündigung oder Drohung nach Mängelmeldung -> Issue 1, sofort.
  when:
    ref: fact.termination_after_report
    op: equals
    value: true
  urgency: HIGH
  reason_code: DEFECTS_TERMINATION_AFTER_REPORT
  reason_de: Nach der Mängelmeldung gab es eine Kündigung oder Drohung. Sie kann als Rachekündigung anfechtbar
    sein; die Anfechtungsfrist von 30 Tagen kann laufen. Es gelten die Regeln von Issue 1. Rechtsperson
    sofort.
  professionals: *id002
  routes_to_issue: CH_TENANCY_TERMINATION
- id: DF_SCHADEN
  description: 'Schaden oder Zusatzkosten: Schadenersatz.'
  when:
    ref: fact.damage_or_extra_costs
    op: equals
    value: true
  urgency: LOW
  reason_code: DEFECTS_DAMAGES
  reason_de: Es entstand ein Schaden oder es gab Zusatzkosten. Schadenersatz (Verschulden) prüft die Rechtsperson
    (normal).
  professionals: *id002
- id: DF_SELBST_REPARIEREN
  description: 'Klientin will selbst reparieren lassen: Ersatzvornahme nur unter Voraussetzungen.'
  when:
    any:
    - ref: fact.client_wish
      op: equals
      value: selbst_reparieren
  urgency: LOW
  reason_code: DEFECTS_SELF_REPAIR
  reason_de: Die Klientin will selbst reparieren lassen. Eine Ersatzvornahme ist nur unter Voraussetzungen
    zulässig; vor einem Auftrag an Handwerker die Rechtsperson fragen (normal).
  professionals: *id002
- id: DF_BEHOERDENBRIEF
  description: Brief oder Entscheid der Schlichtungsbehörde/des Gerichts (Global G1).
  when:
    ref: fact.authority_letter_received
    op: equals
    value: true
  urgency: HIGH
  reason_code: DEFECTS_AUTHORITY_LETTER
  reason_de: 'Es liegt ein Brief oder Entscheid einer Schlichtungsbehörde oder eines Gerichts vor. Behördenfristen
    sind kurz: Rechtsperson sofort.'
  professionals: *id002
- id: DF_URSACHE_UNKLAR
  description: 'Ursache unklar oder Klientin könnte verantwortlich sein: keine Schuldzuweisung.'
  when:
    any:
    - ref: fact.possibly_tenant_caused
      op: equals
      value: true
    - ref: fact.possibly_tenant_caused
      op: is_unknown
  urgency: LOW
  reason_code: DEFECTS_CAUSE_UNCLEAR
  reason_de: Die Ursache ist unklar oder die Klientin könnte verantwortlich sein. Das System weist keine
    Schuld zu; die Rechtsperson prüft (normal).
  professionals: *id002
- id: DF_LAERM_BAU
  description: 'Lärm oder Bauarbeiten: Mangel möglich, Beurteilung durch die Rechtsperson.'
  when:
    ref: fact.defect_type
    op: equals
    value: laerm_bau
  urgency: LOW
  reason_code: DEFECTS_NOISE_OR_CONSTRUCTION
  reason_de: Lärm oder Bauarbeiten können ein Mangel sein, auch ohne Verschulden der Vermieterschaft.
    Die Rechtsperson beurteilt (normal); es werden keine Erwartungen geweckt.
  professionals: *id002
- id: DF_ERSATZWOHNUNG
  description: 'Ersatzwohnung angeboten: nicht vorschnell ablehnen.'
  when:
    ref: fact.landlord_offered_replacement
    op: equals
    value: true
  urgency: LOW
  reason_code: DEFECTS_REPLACEMENT_OFFERED
  reason_de: Die Vermieterschaft hat eine andere Wohnung angeboten. Bei vollwertigem Ersatz entfällt der
    Anspruch auf Beseitigung; nicht vorschnell ablehnen, Rechtsperson fragen.
  professionals: *id002
- id: DF_KEINE_REAKTION_30
  description: 'PRODUKTSCHWELLE (Teamentscheid 7.11.2026): 30 Tage nach der schriftlichen Meldung ohne
    Reaktion.'
  when:
    all:
    - ref: fact.landlord_reacted
      op: equals
      value: false
    - ref: derived.days_since_defect_report
      op: greater_than
      value: 29
  urgency: LOW
  reason_code: DEFECTS_NO_REACTION_30_DAYS
  reason_de: Seit der schriftlichen Mängelmeldung sind 30 Tage oder mehr ohne Reaktion der Vermieterschaft
    vergangen (Produktschwelle, keine Gesetzesfrist). Die Rechtsperson wählt den Weg (Klage oder Hinterlegung).
  professionals: *id002
- id: DF_H1_BESCHWERDEN
  description: 'H1: gesundheitliche Beschwerden oder besondere Gefährdung gemeldet.'
  when: &id004
    any:
    - ref: fact.health_symptoms_reported
      op: equals
      value: true
    - ref: fact.medical_risk_reported
      op: equals
      value: true
  urgency: MEDIUM
  reason_code: DEFECTS_H1_HEALTH_REPORTED
  reason_de: Es werden gesundheitliche Beschwerden oder eine besondere Gefährdung gemeldet. Die Sozialarbeiterin
    kann eine ärztliche Abklärung anregen; das System macht keine Aussage zur Ursache. Recht und Soziales
    (bald).
  professionals: *id003
- id: DF_H2_GROSSER_BEFALL
  description: 'H2: grosser Befall oder Geruch UND (Schlafraum oder Kinder oder Gefährdung).'
  when: &id005
    all:
    - ref: fact.reported_extent
      op: in
      value:
      - groesser
      - nur_geruch
    - any:
      - ref: fact.sleeping_room_affected
        op: equals
        value: true
      - ref: fact.children_exposed
        op: equals
        value: true
      - ref: fact.medical_risk_reported
        op: equals
        value: true
  urgency: HIGH
  reason_code: DEFECTS_H2_EXTENT_AND_EXPOSURE
  reason_de: Grösserer Befall oder Schimmelgeruch trifft auf Schlafräume, Kinder oder besonders gefährdete
    Personen. Räume nach Möglichkeit geschlossen halten und nicht nutzen. Recht und Soziales sofort.
  professionals: *id003
- id: DF_H3_NICHT_MEIDBAR
  description: 'H3: H1/H2 und betroffene Räume nicht meidbar (oder unbekannt).'
  when:
    all:
    - &id006
      any:
      - *id004
      - *id005
    - &id007
      any:
      - ref: fact.can_avoid_affected_rooms
        op: equals
        value: false
      - ref: fact.can_avoid_affected_rooms
        op: is_unknown
  urgency: HIGH
  reason_code: DEFECTS_H3_ROOMS_NOT_AVOIDABLE
  reason_de: Die betroffenen Räume sind nicht meidbar (oder das ist unbekannt). Die Sozialarbeiterin prüft
    sofort eine sichere Zwischenlösung (Global-Regel G2), die Rechtsperson parallel.
  professionals:
  - social_counselling
  - tenancy_law_counsel
- id: DF_H4_KEINE_ZWISCHENUNTERKUNFT
  description: 'H4: H3 und keine sichere Zwischenunterkunft (oder unbekannt).'
  when:
    all:
    - *id006
    - *id007
    - any:
      - ref: fact.safe_alternative_available
        op: equals
        value: false
      - ref: fact.safe_alternative_available
        op: is_unknown
  urgency: HIGH
  reason_code: DEFECTS_H4_NO_SAFE_ALTERNATIVE
  reason_de: Es gibt keine sichere Zwischenunterkunft (oder das ist unbekannt). Die Sozialarbeiterin organisiert
    sofort eine Notunterkunft über den Sozialdienst der Gemeinde; Recht parallel.
  professionals:
  - social_counselling
  - tenancy_law_counsel
- id: DF_H5_GEMEINDE_ZUWEISUNG
  description: 'H5: Gemeindewohnung oder zugewiesene Unterkunft: Vertrags-/Zuweisungsgrundlage prüfen.'
  when:
    ref: fact.housing_arrangement
    op: in
    value:
    - gemeindewohnung
    - zugewiesene_unterkunft
  urgency: MEDIUM
  reason_code: DEFECTS_H5_PUBLIC_OR_ASSIGNED_HOUSING
  reason_de: Es handelt sich um eine Gemeindewohnung oder zugewiesene Unterkunft. Die Vertrags- bzw. Zuweisungsgrundlage
    muss geprüft werden. Ist der Sozialdienst selbst Vermieter oder Zuweisungsstelle, ist eine unabhängige
    Beratung nötig (Global-Regel G4).
  professionals:
  - tenancy_law_counsel
  - independent_legal_body
- id: DF_H7_GESUNDHEIT_UNBEKANNT
  description: 'H7: Gesundheitsfelder nach einer Rückfrage weiterhin unbekannt: im Zweifel höher eskalieren.'
  when:
    all:
    - *id008
    - any:
      - ref: fact.health_symptoms_reported
        op: is_unknown
      - ref: fact.medical_risk_reported
        op: is_unknown
      - ref: fact.children_exposed
        op: is_unknown
      - ref: fact.sleeping_room_affected
        op: is_unknown
      - ref: fact.can_avoid_affected_rooms
        op: is_unknown
  urgency: MEDIUM
  reason_code: DEFECTS_H7_HEALTH_FIELDS_UNKNOWN
  reason_de: 'Gesundheits- oder Schutzfelder sind nach der Rückfrage weiterhin unbekannt. Unbekannt ist
    nie ''nein'': im Zweifel wird höher eskaliert (bald), Recht und Soziales.'
  professionals: *id003
- id: DF_VULNERABILITY
  description: 'Besondere Belastungssituation: ausserhalb des Moduls.'
  when:
    ref: fact.vulnerability_present
    op: equals
    value: true
  urgency: MEDIUM
  reason_code: OUTSIDE_MODULE_VULNERABILITY
  reason_de: Es liegt eine besondere Belastungssituation vor. Das liegt ausserhalb dieses Moduls und gehört
    in menschliche Hände.
  professionals: *id003
- id: DF_EXPERT_REQUESTED
  description: Fachperson ausdrücklich gewünscht.
  when:
    ref: fact.client_requests_expert
    op: equals
    value: true
  urgency: LOW
  reason_code: EXPERT_REQUESTED
  reason_de: Es wurde ausdrücklich eine Fachperson gewünscht. Dieser Wunsch wird immer respektiert.
  professionals: *id002
legal_rules:
- id: DF_HINT_PFLICHT
  description: Vermieterschaft muss Wohnung gebrauchstauglich erhalten.
  kind: HINT
  when: &id009
    ref: ctx.has_user_input
    op: equals
    value: true
  result_code: HINT_LANDLORD_DUTY
  result_de: Die Vermieterschaft muss die Wohnung in einem gebrauchstauglichen Zustand erhalten.
  legal_source_ids:
  - CH_OR_256_1_2
- id: DF_HINT_MELDEN
  description: Mangel schriftlich melden.
  kind: HINT
  when: *id009
  result_code: HINT_REPORT_IN_WRITING
  result_de: Melden Sie den Mangel schriftlich, am besten eingeschrieben, und verlangen Sie die Behebung.
    Eine Herabsetzung der Miete ist erst ab dem Zeitpunkt möglich, in dem die Vermieterschaft vom Mangel
    weiss.
  legal_source_ids:
  - CH_OR_257G
  - CH_OR_259D
  - LEHRBUCH_MIETE_31
- id: DF_HINT_VOLLE_MIETE
  description: Volle Miete weiter bezahlen.
  kind: HINT
  when: *id009
  result_code: HINT_PAY_FULL_RENT
  result_de: Bezahlen Sie die volle Miete weiter, bis eine Fachperson den Fall geprüft hat. Wer die Miete
    selbst kürzt, zurückbehält oder verrechnet, riskiert eine Kündigung.
  legal_source_ids:
  - CH_OR_257D_1
  - BGER_4A_140_2014
- id: DF_HINT_BELEGE
  description: Belege sammeln.
  kind: HINT
  when: *id009
  result_code: HINT_COLLECT_EVIDENCE
  result_de: 'Sammeln Sie Belege: Fotos mit Datum, Briefe, E-Mails, Namen von Zeugen.'
  legal_source_ids:
  - PRODUKTREGEL
- id: DF_HINT_KLEINER_UNTERHALT
  description: Kleiner Unterhalt.
  kind: HINT
  when:
    ref: fact.minor_repair_possible
    op: equals
    value: true
  result_code: HINT_MINOR_MAINTENANCE
  result_de: Kleine Reparaturen und Reinigungen, etwa eine Glühbirne oder ein verstopfter Abfluss, muss
    die Mieterin selbst bezahlen.
  legal_source_ids:
  - CH_OR_259
- id: DF_HINT_ZUTRITT
  description: Zutritt für Handwerker.
  kind: HINT
  when: *id009
  result_code: HINT_ACCESS_FOR_REPAIRS
  result_de: Handwerkern für die Behebung müssen Sie Zutritt gewähren; die Arbeiten müssen rechtzeitig
    angekündigt werden.
  legal_source_ids:
  - CH_OR_257H
- id: DF_HINT_KOSTENLOS
  description: Schlichtungsverfahren kostenlos.
  kind: HINT
  when: *id009
  result_code: HINT_FREE_CONCILIATION
  result_de: Das Verfahren vor der Schlichtungsbehörde kostet keine Gerichtskosten. Dort gibt es auch
    eine kostenlose Rechtsauskunft.
  legal_source_ids:
  - CH_ZPO_113_2_C
- id: DF_HINT_RACHEKUENDIGUNG
  description: Kündigung nach Mängelmeldung.
  kind: HINT
  when:
    ref: fact.termination_after_report
    op: equals
    value: true
  result_code: HINT_RETALIATORY_TERMINATION
  result_de: Wer wegen einer Mängelmeldung gekündigt wird, kann die Kündigung möglicherweise anfechten.
    Bringen Sie eine solche Kündigung sofort einer Fachperson.
  legal_source_ids:
  - CH_OR_271A_1_A_D_E
- id: DF_HINT_ARZT
  description: Ärztliche Abklärung bei Beschwerden.
  kind: HINT
  when: *id006
  result_code: HINT_MEDICAL_CHECK
  result_de: Wenn jemand gesundheitliche Beschwerden hat, sollte das ärztlich abgeklärt werden. Besonders
    gefährdete Personen sollten das rasch tun.
  legal_source_ids:
  - BAG_SCHIMMEL_2021
- id: DF_HINT_RAEUME_MEIDEN
  description: Starken Befall meiden.
  kind: HINT
  when: *id005
  result_code: HINT_AVOID_ROOMS
  result_de: Räume mit starkem Schimmelbefall nach Möglichkeit geschlossen halten und nicht benutzen,
    besonders Schlaf- und Kinderzimmer. Häufig lüften. Entfeuchtungsgeräte erst nach der Schimmelbeseitigung.
  legal_source_ids:
  - BAG_SCHIMMEL_2021
- id: DF_HINT_SANIERUNG
  description: Abklärung und Sanierung sind Sache der Vermieterschaft.
  kind: HINT
  when: *id008
  result_code: HINT_LANDLORD_REMEDIES
  result_de: Abklärung und Sanierung sind Sache der Vermieterschaft. Eigene Gutachten oder Luftmessungen
    sind in der Regel nicht nötig.
  legal_source_ids:
  - BAG_SCHIMMEL_2021
- id: DF_REVIEW_SUBVENTIONIERT
  description: 'H6: Hinweis an Issue 7 bei subventionierter Wohnung.'
  kind: REVIEW_POINT
  when:
    ref: fact.housing_arrangement
    op: equals
    value: subventioniert
  result_code: REVIEW_H6_SUBSIDISED
  result_de: 'Prüfhinweis (H6): Bei subventionierten Wohnungen mit kontrolliertem Mietzins kann die Anfechtung
    missbräuchlicher Mietzinse ausgeschlossen sein (Art. 253b Abs. 3 OR); siehe Issue 7.'
  legal_source_ids:
  - CH_OR_253B_2_3
- id: DF_REVIEW_HINTERLEGUNG_FALLE
  description: Formfehler bei Hinterlegung.
  kind: REVIEW_POINT
  when:
    any:
    - ref: fact.rent_deposit_started
      op: equals
      value: true
    - ref: fact.deposit_planned
      op: equals
      value: true
  result_code: REVIEW_DEPOSIT_FORM
  result_de: 'Prüfhinweis: Fehlt eine formelle Voraussetzung der Hinterlegung, gilt die Miete als nicht
    bezahlt, auch bei gutem Glauben; bereits fällige Mietzinse können nicht mehr hinterlegt werden.'
  legal_source_ids:
  - CH_OR_259G
  - CH_OR_259H
  - BGER_4C_264_2003
- id: DF_REVIEW_UMGEBUNG
  description: Veränderte Umgebung ist ohne Zusicherung kein Mangel.
  kind: REVIEW_POINT
  when:
    ref: fact.construction_nearby
    op: equals
    value: true
  result_code: REVIEW_ENVIRONMENT_CHANGE
  result_de: 'Prüfhinweis: Eine veränderte Umgebung (Neubau nebenan, mehr Verkehr) ist ohne besondere
    Zusicherung in der Regel kein Mangel; Baulärm während der Bauphase kann ein Mangel sein.'
  legal_source_ids:
  - BGE_135_III_345
  - CH_OR_257H
- id: DF_REVIEW_DRITTE
  description: Mitbewohnende oder Kinder geschädigt.
  kind: REVIEW_POINT
  when:
    ref: fact.damage_or_extra_costs
    op: equals
    value: true
  result_code: REVIEW_THIRD_PARTY_DAMAGE
  result_de: 'Prüfhinweis: Schadenersatz nach Art. 259e OR steht grundsätzlich nur der Vertragspartei
    zu; der Schutz Dritter ist offen.'
  legal_source_ids:
  - CH_OR_259E
  - LEHRBUCH_MIETE_31
