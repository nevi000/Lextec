  - BGER_4A_673_2014
  question_de: "Wohnt eine Lebenspartnerin oder ein Lebenspartner ohne Heirat oder Eintragung mit?"
  why_needed_de: 'Nur Faktenerfassung (Teamentscheid): die rechtliche Bewertung (Mitmiete, Familienwohnung)
    macht immer die Rechtsperson.'
- id: replacement_offered
  group: search
  label_de: Ersatzwohnung angeboten
  data_type: boolean
  required: true
  priority: high
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - CH_OR_272A_2
  question_de: Hat die Vermieterschaft eine gleichwertige Ersatzwohnung angeboten?
  why_needed_de: Erstreckung in der Regel ausgeschlossen (Art. 272a Abs. 2 OR).
- id: settlement_with_waiver_offered
  group: search
  label_de: Vergleich mit Verzicht angeboten
  data_type: boolean
  priority: high
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - CH_OR_272B_2
  question_de: Hat die Vermieterschaft eine Erstreckungsvereinbarung (Vergleich) mit Verzicht auf eine
    zweite Erstreckung vorgelegt?
  why_needed_de: Mieterin kann auf die zweite Erstreckung verzichten (Art. 272b Abs. 2 OR); vor Unterschrift
    Rechtsperson (G9).
- id: search_efforts
  group: search
  label_de: Bisherige Wohnungssuche
  data_type: enum
  enum_values:
  - keine
  - laufend_nicht_dokumentiert
  - laufend_dokumentiert
  enum_labels_de:
    keine: Noch keine Suche
    laufend_nicht_dokumentiert: Sucht, aber nicht dokumentiert
    laufend_dokumentiert: Sucht und dokumentiert (Bewerbungen, Absagen)
  required: true
  priority: high
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - BGER_4A_72_2011
  - BGE_151_III_481
  - BGE_110_II_249
  question_de: "Sucht die Klientin bereits eine neue Wohnung, und sind die Suchbemühungen dokumentiert?"
  why_needed_de: Suchbemühungen sind schon für die erste Erstreckung wichtig (BGer 4A_72/2011 E. 3); zwingend
    bei der Zweiterstreckung.
- id: social_search_support
  group: search
  label_de: Unterstützung bei der Suche durch den Sozialdienst
  data_type: boolean
  priority: low
  source_ids:
  - PRODUKTREGEL
  question_de: Unterstützt der Sozialdienst bei der Suche (Mietzinsgarantie, Kautionsgutsprache)?
  why_needed_de: Soziale Massnahme, stärkt die Suchbemühungen.
- id: prior_payment_warning
  group: search
  label_de: Frühere Mahnung wegen Zahlungsverzug
  data_type: boolean
  required: true
  priority: high
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - BGE_117_II_415
  question_de: Gab es vor der Kündigung eine schriftliche Zahlungsaufforderung mit Frist und Kündigungsandrohung,
    die nicht erfüllt wurde?
  why_needed_de: Ausschluss auch bei ordentlicher Kündigung, wenn die Mahnung gültig war (BGE 117 II 415
    E. 4, E. 5a).
- id: demolition_known_at_signing
  group: search
  label_de: Abbruch/Umbau bei Vertragsschluss bekannt
  data_type: boolean
  priority: low
  escalation_relevant: true
  handover_priority: high
  source_ids:
  - BGE_105_II_197
  question_de: Wusste die Klientin schon bei Vertragsschluss von einem geplanten Abbruch oder Umbau?
  why_needed_de: Härte wird dann kaum anerkannt (BGE 105 II 197 E. 3b); Abgrenzung zu Art. 272a Abs. 1
    lit. d OR.
escalation_rules:
- id: EX_OUT_OF_SCOPE_OBJECT
  description: 'Geschäftsraum/Ferienwohnung/Notunterkunft: ausserhalb des Moduls.'
  when:
    ref: fact.object_type
    op: in
    value:
    - notwohnung_heim
    - ferienwohnung_bis_3_monate
    - andere
  urgency: MEDIUM
  reason_code: OUT_OF_SCOPE_OBJECT
  reason_de: Das Objekt fällt nicht unter die gewöhnliche Wohnraummiete dieses Moduls. Es werden keine
    Standardaussagen gemacht. Eine unabhängige Rechtsperson muss prüfen.
  professionals:
  - lawyer_general
  suppress_standard_statements: true
- id: EX_GRUNDREGEL
  description: 'Erstreckung: die Abwägung liegt im Ermessen der Behörde - immer Rechtsperson (+ Sozialarbeiterin
    für Suche/Belege).'
  when: &id003
    ref: ctx.has_user_input
    op: equals
    value: true
  urgency: MEDIUM
  reason_code: EXTENSION_ALWAYS_LEGAL_REVIEW
  reason_de: Ob und wie lange erstreckt wird, entscheidet die Schlichtungsbehörde bzw. das Gericht im
    Ermessen; das System macht keine Prognose zur Dauer. Eine Rechtsperson prüft; die Sozialarbeiterin
    dokumentiert Härtegründe und Suchbemühungen.
  professionals: &id001
  - tenancy_law_counsel
  - social_counselling
- id: EX_ZAHLUNGSVERZUG
  description: 'Kündigung wegen Zahlungsverzug: Erstreckung ausgeschlossen -> Issue 3.'
  when:
    ref: fact.ending_reason
    op: equals
    value: zahlungsverzug
  urgency: HIGH
  reason_code: EXTENSION_EXCLUDED_PAYMENT_DEFAULT
  reason_de: Bei einer Kündigung wegen Zahlungsverzug ist eine Erstreckung ausgeschlossen. Es gelten die
    Regeln von Issue 3; Aussagen zu einer möglichen Erstreckung werden unterdrückt. Sofortige juristische
    und soziale Prüfung.
  professionals: *id001
  routes_to_issue: CH_TENANCY_PAYMENT_DEFAULT
  suppress_standard_statements: true
- id: EX_AUSSCHLUSS_ANDERE
  description: 'Andere ausserordentliche Kündigung oder Befristung bis Baubeginn: möglicher Ausschluss.'
  when:
    any:
    - ref: fact.ending_reason
      op: equals
      value: andere_ausserordentlich
    - ref: fact.limited_to_demolition
      op: equals
      value: true
  urgency: HIGH
  reason_code: EXTENSION_POSSIBLY_EXCLUDED
  reason_de: Es liegt ein möglicher gesetzlicher Ausschlussgrund vor (z. B. schwere Pflichtverletzung,
    Konkurs, Befristung bis Umbau/Abbruch). Rechtsperson sofort; keine Aussage zu einer möglichen Erstreckung.
  professionals: &id002
  - tenancy_law_counsel
- id: EX_FRUEHERE_MAHNUNG
  description: Frühere gültige Mahnung (Art. 257d) auch bei ordentlicher Kündigung.
  when:
    ref: fact.prior_payment_warning
    op: equals
    value: true
  urgency: HIGH
  reason_code: EXTENSION_PRIOR_PAYMENT_WARNING
  reason_de: Vor der Kündigung gab es eine Zahlungsaufforderung mit Kündigungsandrohung. War sie gültig,
    bleibt die Erstreckung auch bei ordentlicher Kündigung ausgeschlossen. Die Gültigkeit der Mahnung
    (Issue 2) muss die Rechtsperson sofort prüfen; keine Aussage 'Erstreckung möglich'.
  professionals: *id002
  routes_to_issue: CH_TENANCY_PAYMENT_WARNING
- id: EX_UNBEFRISTET_FRIST
  description: 'Unbefristet: Empfang unbekannt oder 20+ Tage seit Empfang (Produktschwelle wie Issue 1).'
  when:
    all:
    - ref: fact.contract_term_type
      op: equals
      value: unbefristet
    - any:
      - ref: fact.receipt_date
        op: is_unknown
      - ref: fact.delivery_method
        op: is_unknown
      - ref: fact.pickup_notice_date
        op: is_unknown
      - ref: derived.days_since_earliest_receipt
        op: greater_than
        value: 19
  urgency: HIGH
  reason_code: EXTENSION_30_DAY_DEADLINE_TIGHT
  reason_de: Das Erstreckungsbegehren muss bei unbefristetem Vertrag innert 30 Tagen nach Empfang der
    Kündigung eingehen. Der Empfang ist unbekannt oder liegt 20 oder mehr Tage zurück (Produktschwelle,
    kein Fristende). Rechtsperson sofort.
  professionals: *id002
- id: EX_BEFRISTET_FRIST
  description: 'Befristet: höchstens 75 Tage bis Vertragsende oder Ende unbekannt (Teamentscheid 7.11.2026).'
  when:
    all:
    - ref: fact.contract_term_type
      op: equals
      value: befristet
    - any:
      - ref: derived.days_until_contract_end
        op: less_than
        value: 76
      - ref: fact.contract_end_date
        op: is_unknown
  urgency: HIGH
  reason_code: EXTENSION_FIXED_TERM_75_DAYS
  reason_de: Der befristete Vertrag endet in 75 Tagen oder weniger (oder das Ende ist unbekannt). Das
    Begehren muss spätestens 60 Tage vor Ablauf eingehen; die Rechtsperson braucht Puffer (Produktschwelle,
    kein Fristende). Rechtsperson sofort.
  professionals: *id002
- id: EX_ZWEITERSTRECKUNG
  description: 'Zweite Erstreckung: höchstens 75 Tage bis Ende der ersten.'
  when:
    all:
    - ref: fact.previous_extension
      op: equals
      value: true
    - ref: derived.days_until_first_extension_end
      op: less_than
      value: 76
  urgency: HIGH
  reason_code: EXTENSION_SECOND_75_DAYS
  reason_de: Eine zweite Erstreckung muss spätestens 60 Tage vor Ablauf der ersten beantragt werden. Das
    Ende der ersten Erstreckung liegt in 75 Tagen oder weniger (Produktschwelle). Rechtsperson sofort;
    Suchbemühungen sind zwingend zu dokumentieren.
  professionals: *id002
- id: EX_FRIST_VERPASST
  description: 'Frist möglicherweise verpasst: Verwirkung.'
  when:
    ref: fact.deadline_possibly_missed
    op: equals
    value: true
  urgency: HIGH
  reason_code: EXTENSION_DEADLINE_POSSIBLY_MISSED
  reason_de: Die Frist für das Erstreckungsbegehren ist möglicherweise verpasst (Verwirkungsfrist). Rechtsperson
    sofort (andere Wege prüfen), Sozialarbeiterin plant den Auszug.
  professionals: *id001
- id: EX_ERSATZ_ODER_VERGLEICH
  description: Ersatzwohnung angeboten oder Vergleich mit Verzicht vorgelegt.
  when:
    any:
    - ref: fact.replacement_offered
      op: equals
      value: true
    - ref: fact.settlement_with_waiver_offered
      op: equals
      value: true
  urgency: HIGH
  reason_code: EXTENSION_REPLACEMENT_OR_WAIVER
  reason_de: Die Vermieterschaft bietet eine Ersatzwohnung oder einen Vergleich an. Das kann die Erstreckung
    ausschliessen oder auf die zweite Erstreckung verzichten lassen. Nichts unterschreiben oder ablehnen,
    bevor die Rechtsperson geprüft hat. Rechtsperson sofort.
  professionals: *id002
- id: EX_HAERTEGRUENDE
  description: 'Fristen gewahrt, Härtegründe vorhanden: bald, Recht + Soziales.'
  when:
    ref: fact.hardship_present
    op: equals
    value: true
  urgency: MEDIUM
  reason_code: EXTENSION_HARDSHIP_PRESENT
  reason_de: Es gibt Härtegründe. Die Behörde wägt die Interessen beider Seiten ab; die Sozialarbeiterin
    dokumentiert Härtegründe und Suchbemühungen sauber (bald).
  professionals: *id001
- id: EX_KEINE_SUCHE
  description: 'Keine Suchbemühungen bisher: Suche starten.'
  when:
    ref: fact.search_efforts
    op: equals
    value: keine
  urgency: MEDIUM
  reason_code: EXTENSION_NO_SEARCH_EFFORTS
  reason_de: Bisher wurde nicht nach einer Wohnung gesucht. Die Suche sollte sofort beginnen und dokumentiert
    werden; ohne Suchbemühungen wird höchstens eine kurze Erstreckung gewährt.
  professionals:
  - social_counselling
- id: EX_SONDERFRAGEN
  description: 'Konkubinat, Untermiete oder Familienwohnung: Sonderfragen.'
  when:
    any:
    - ref: fact.tenant_role
      op: equals
      value: untermieterin
    - ref: fact.family_home_with_spouse
      op: equals
      value: true
    - ref: fact.cohabitant_partner
      op: equals
      value: true
  urgency: MEDIUM
  reason_code: EXTENSION_SPECIAL_QUESTIONS
  reason_de: Untermiete, Familienwohnung oder eine Lebenspartnerschaft ohne Eintragung werfen Sonderfragen
    auf (z. B. Mitbenutzung, Dauer des Hauptmietverhältnisses). Das System erfasst nur die Fakten; die
    Rechtsperson bewertet.
  professionals: *id002
- id: EX_VULNERABILITY
  description: 'Besondere Belastungssituation: ausserhalb des Moduls.'
  when:
    ref: fact.vulnerability_present
    op: equals
    value: true
  urgency: MEDIUM
  reason_code: OUTSIDE_MODULE_VULNERABILITY
  reason_de: Es liegt eine besondere Belastungssituation vor. Das liegt ausserhalb dieses Moduls und gehört
    in menschliche Hände.
  professionals: *id001
- id: EX_EXPERT_REQUESTED
  description: Fachperson ausdrücklich gewünscht.
  when:
    ref: fact.client_requests_expert
    op: equals
    value: true
  urgency: LOW
  reason_code: EXPERT_REQUESTED
  reason_de: Es wurde ausdrücklich eine Fachperson gewünscht. Dieser Wunsch wird immer respektiert.
  professionals: *id002
legal_rules:
- id: EX_HINT_ANSPRUCH
  description: Erstreckung bei Härte.
  kind: HINT
  when: *id003
  result_code: HINT_EXTENSION_HARDSHIP
  result_de: Wenn der Auszug für die Klientin oder ihre Familie eine besondere Härte bedeutet, kann sie
    eine Erstreckung des Mietverhältnisses verlangen.
  legal_source_ids:
  - CH_OR_272_1
- id: EX_HINT_FRIST
  description: Fristen und Verwirkung.
  kind: HINT
  when: *id003
  result_code: HINT_EXTENSION_DEADLINES
  result_de: Bei einem unbefristeten Vertrag muss das Begehren innert 30 Tagen nach Empfang der Kündigung
    bei der Schlichtungsbehörde eingehen, bei einem befristeten spätestens 60 Tage vor Ablauf. Wer die
    Frist verpasst, verliert den Anspruch.
  legal_source_ids:
  - CH_OR_273_2
  - BGE_139_III_7
- id: EX_HINT_ABWAEGUNG
  description: Interessenabwägung.
  kind: HINT
  when: *id003
  result_code: HINT_EXTENSION_BALANCING
  result_de: Berücksichtigt werden unter anderem die Dauer des Mietverhältnisses, die persönlichen, familiären
    und finanziellen Verhältnisse, ein allfälliger Eigenbedarf der Vermieterschaft und die Lage auf dem
    Wohnungsmarkt. Die Behörde wägt die Interessen beider Seiten ab.
  legal_source_ids:
  - CH_OR_272_2
  - BGE_142_III_336
- id: EX_HINT_DAUER
  description: Höchstdauer.
  kind: HINT
  when: *id003
  result_code: HINT_EXTENSION_MAX_4Y
  result_de: Bei Wohnungen kann um insgesamt höchstens vier Jahre erstreckt werden. Wie lange, entscheidet
    die Behörde im Einzelfall; oft wird zuerst kürzer erstreckt.
  legal_source_ids:
  - CH_OR_272B_1
  - BGE_142_III_336
  - BGE_135_III_121
- id: EX_HINT_SUCHE
  description: Suche dokumentieren.
  kind: HINT
  when: *id003
  result_code: HINT_DOCUMENT_SEARCH
  result_de: Die Klientin sollte sofort mit der Wohnungssuche beginnen und alles dokumentieren (Bewerbungen,
    Absagen). Das ist schon für die erste Erstreckung wichtig.
  legal_source_ids:
  - BGER_4A_72_2011
  - BGE_151_III_481
  - CH_OR_272_3
- id: EX_HINT_UMZUGSMUEHE
  description: Umzugsmühe allein reicht nicht.
  kind: HINT
  when: *id003
  result_code: HINT_MOVING_EFFORT_NOT_ENOUGH
  result_de: Die Umzugsmühe allein reicht nicht; entscheidend sind konkrete Umstände wie Kinder, Gesundheit,
    Alter oder finanzielle Lage.
  legal_source_ids:
  - BGE_105_II_197
  - BGER_4A_72_2011
- id: EX_HINT_VERFAHREN
  description: Während des Verfahrens nicht ausziehen.
  kind: HINT
  when: *id003
  result_code: HINT_STAY_DURING_PROCEEDINGS
  result_de: Während des Verfahrens muss die Klientin die Wohnung nicht verlassen.
  legal_source_ids:
  - LEHRBUCH_MIETE_31
- id: EX_HINT_NEUE_WOHNUNG
  description: Verkürzte Kündigung während der Erstreckung.
  kind: HINT
  when: *id003
  result_code: HINT_SHORT_NOTICE_DURING_EXTENSION
  result_de: Findet die Klientin während der Erstreckung eine Wohnung, kann sie mit verkürzter Frist kündigen.
  legal_source_ids:
  - CH_OR_272D
- id: EX_HINT_KOSTEN
  description: Schlichtungsverfahren kostenlos.
  kind: HINT
  when: *id003
  result_code: HINT_NO_COURT_COSTS
  result_de: Das Verfahren vor der Schlichtungsbehörde kostet keine Gerichtskosten.
  legal_source_ids:
  - CH_ZPO_113_2_C
- id: EX_REVIEW_VERGLEICH
  description: 'Vor Unterschrift: Verzicht auf zweite Erstreckung möglich.'
  kind: REVIEW_POINT
  when:
    ref: fact.settlement_with_waiver_offered
    op: equals
    value: true
  result_code: REVIEW_WAIVER_RISK
  result_de: 'Prüfhinweis: Vor der Unterschrift eines Vergleichs ist die Rechtsperson beizuziehen, weil
    damit auf eine zweite Erstreckung verzichtet werden kann; bei einer Familienwohnung ist die Vereinbarung
    nur mit beiden Ehegatten gültig.'
  legal_source_ids:
  - CH_OR_272B_2
  - CH_OR_273A
- id: EX_REVIEW_KONKUBINAT
  description: 'Lebenspartner: nur Faktum.'
  kind: REVIEW_POINT
  when:
    ref: fact.cohabitant_partner
    op: equals
    value: true
  result_code: REVIEW_COHABITANT
  result_de: 'Prüfhinweis: Ob eine Lebenspartnerschaft ohne Eintragung zur ''Familie'' zählt, ist umstritten
    (ältere Praxis verneint). Das System erfasst nur die Fakten.'
  legal_source_ids:
  - BGE_105_II_197
  - BGER_4A_673_2014
- id: EX_REVIEW_UNTERMIETE
  description: 'Untermiete: Dauer des Hauptmietverhältnisses.'
  kind: REVIEW_POINT
  when:
    ref: fact.tenant_role
    op: equals
    value: untermieterin
  result_code: REVIEW_SUBLEASE
  result_de: 'Prüfhinweis: Bei Untermiete kann nur für die Dauer des Hauptmietverhältnisses erstreckt
    werden.'
  legal_source_ids:
  - CH_OR_273B_1
- id: EX_REVIEW_ABBRUCH_BEKANNT
  description: Abbruch/Umbau bei Vertragsschluss bekannt.
  kind: REVIEW_POINT
  when:
    ref: fact.demolition_known_at_signing
    op: equals
    value: true
  result_code: REVIEW_DEMOLITION_KNOWN
  result_de: 'Prüfhinweis: War ein Abbruch oder Umbau bei Vertragsschluss bekannt, wird eine Härte kaum
    anerkannt (altes Recht); Abgrenzung zum Ausschlussgrund nach Art. 272a Abs. 1 lit. d OR.'
  legal_source_ids:
  - BGE_105_II_197
  - CH_OR_272A_1_A
- id: EX_REVIEW_NUR_HAERTE
  description: Härte macht Kündigung nicht anfechtbar.
  kind: REVIEW_POINT
  when:
    ref: fact.hardship_present
    op: equals
    value: true
  result_code: REVIEW_HARDSHIP_NOT_CONTESTABLE
  result_de: 'Prüfhinweis: Eine Härte macht die Kündigung nicht anfechtbar; sie ist nur für die Erstreckung
    relevant.'
  legal_source_ids:
  - BGE_142_III_91
