briefing_template: expert_briefing_v1
briefing_profile:
  intro_de: Erstreckung des Mietverhältnisses (Art. 272 ff. OR) – Kanton Zürich
  groups:
  - id: ending
    title_de: Beendigung und Ausschlussgründe
    fact_ids:
    - ending_reason
    - contract_term_type
    - limited_to_demolition
    - receipt_date
    - pickup_notice_date
    - delivery_method
    - contract_end_date
    - previous_extension
    - previous_extension_end_date
    - challenge_filed
    - deadline_possibly_missed
  - id: hardship
    title_de: Härtegründe (Art. 272 Abs. 2 lit. a–e OR)
    fact_ids:
    - household_description
    - children_in_household
    - school_change_needed
    - health_limitations
    - economic_difficulty
    - tenancy_start_date
    - local_market_note
    - conclusion_circumstances
    - medical_evidence_current
    - hardship_present
    - cohabitant_partner
    - family_home_with_spouse
  - id: landlord
    title_de: Interessen der Vermieterschaft
    fact_ids:
    - stated_reason
    - replacement_offered
    - settlement_with_waiver_offered
    - prior_payment_warning
    - demolition_known_at_signing
  - id: search
    title_de: Suchbemühungen und soziale Unterstützung
    fact_ids:
    - search_efforts
    - social_search_support
  - id: situation
    title_de: Vorprüfung
    fact_ids:
    - tenant_role
    - object_type
    - property_municipality
    - property_in_canton_zh
    - vulnerability_present
    - client_requests_expert
    - consent_briefing
  review_points:
  - text_de: 'Ausschlussgründe geprüft (Art. 272a OR): Zahlungsverzug, schwere Pflichtverletzung, Konkurs,
      Befristung bis Umbau, Ersatzwohnung.'
    source_ids:
    - CH_OR_272A_1_A
    - CH_OR_272A_2
    - BGE_117_II_415
  - text_de: 'Fristen sind Verwirkungsfristen: 30 Tage ab Empfang (unbefristet), spätestens 60 Tage vor
      Ablauf (befristet), zweite Erstreckung spätestens 60 Tage vor Ablauf der ersten.'
    source_ids:
    - CH_OR_273_2
    - CH_OR_273_3
    - BGE_139_III_7
    - BGE_114_II_165
  - text_de: Härtegründe nach Art. 272 Abs. 2 lit. a–e OR mit aktuellen Belegen; Verhältnisse im Entscheidzeitpunkt
      massgebend.
    source_ids:
    - CH_OR_272_2
    - BGER_4A_673_2014
  - text_de: Suchbemühungen früh dokumentieren (schon für die erste Erstreckung wichtig, zwingend für
      die zweite).
