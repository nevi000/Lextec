content_status: DRAFT
jurisdiction: CH
canton: ZH
legal_area: tenancy
issue: extension
title_de: Erstreckung des Mietverhältnisses (Issue 4)
description: Erstreckung bei gültiger Beendigung des Mietverhältnisses wegen Härte (Art. 272 ff. OR; höchstens
  vier Jahre bei Wohnungen). Immer Rechtsperson; keine Prognose zur Dauer; bei Zahlungsverzug ausgeschlossen.
provenance_de: 'Law-Dossier Issue 4 vom 7.11.2026; Teamentscheide: 75-Tage-Schwelle für befristete Verträge,
  Konkubinat nur als Faktum.'
classification:
  description: 'Passt, wenn Klientinnen wegen einer gültigen Kündigung oder des Ablaufs eines befristeten
    Vertrags ausziehen müssten, der Auszug aber eine Härte wäre (Kinder, Krankheit, keine Ersatzwohnung)
    und sie mehr Zeit brauchen. NICHT passend: Anfechtung einer fehlerhaften Kündigung (Issue 1), Kündigung
    wegen Zahlungsverzug (Issue 3, Erstreckung ausgeschlossen).'
  typical_situations:
  - Die Klientin findet keine Wohnung und möchte mehr Zeit.
  - Wir möchten eine Erstreckung des Mietverhältnisses verlangen.
  - Familie mit Kindern muss ausziehen und findet nichts.
  - Der befristete Mietvertrag läuft aus, die Klientin braucht mehr Zeit.
  related_issues: []
