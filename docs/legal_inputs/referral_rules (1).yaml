# ---------------------------------------------------------------------------
# 3. REGELN PRO FALLTYP (Mietrecht)
#    documents:     welche Unterlagen das Tool anfordert / scannt
#    extract:       welche Felder aus den Unterlagen gelesen werden
#    deadline:      gemeldet, nie verbindlich berechnet; Fristbeginn = Zustellung
#    referrals:     primary = immer; conditional = wenn Signal gesetzt
# ---------------------------------------------------------------------------
issue_rules:

  - issue_id: CH_TENANCY_TERMINATION
    label: "Kuendigung durch den Vermieter"
    legal_basis: ["Art. 266a ff. OR", "Art. 266l-266o OR (Form, Familienwohnung, Nichtigkeit)", "Art. 271, 271a OR (Anfechtbarkeit)", "Art. 273 Abs. 1 OR"]
    documents_required: [kuendigungsformular, mietvertrag]
    documents_optional: [zustellnachweis, begruendung_kuendigung]
    extract:
      - {id: date_received, from: kuendigungsformular, priority: CRITICAL}
      - {id: termination_date, from: kuendigungsformular, priority: HIGH}
      - {id: official_form_used, from: kuendigungsformular, priority: CRITICAL, why: "Ohne amtliches Formular nichtig (Art. 266l Abs. 2, 266o OR)"}
      - {id: family_dwelling_separate_notice, from: kuendigungsformular, priority: HIGH, why: "Familienwohnung: separate Zustellung an Ehegatten (Art. 266n OR)"}
      - {id: notice_period_months, from: mietvertrag, priority: NORMAL}
      - {id: landlord_name, from: mietvertrag, priority: NORMAL}
    deadline: {signal: deadline_contest_termination_30d, days: 30, from: date_received, authority: schlichtungsbehoerde_miete}
    default_action: ESCALATE
    urgency: HIGH
    referrals:
      primary: [schlichtungsbehoerde_miete, mieterverband]
      conditional:
        - {when: {signal: legal_deadline_risk}, add: [tenancy_lawyer], urgency: CRITICAL}
        - {when: {signal: imminent_housing_loss}, add: [sozialdienst_gemeinde]}
        - {when: {signal: low_income}, add: [frauenzentrale_kantonal, unentgeltliche_rechtsauskunft]}
        - {when: {signal: landlord_is_public_body}, add: [ombudsstelle]}
    reason_for_referral: "Anfechtung und Erstreckung nur innert 30 Tagen bei der Schlichtungsbehoerde moeglich; Formfehler pruefen lassen."

  - issue_id: CH_TENANCY_PAYMENT_WARNING
    label: "Zahlungsaufforderung mit Kuendigungsandrohung"
    legal_basis: ["Art. 257d Abs. 1 OR (Wohnraum: Zahlungsfrist mind. 30 Tage)", "Art. 266n OR"]
    documents_required: [zahlungsaufforderung, mietvertrag]
    documents_optional: [kontoauszug, betreibungsauszug]
    extract:
      - {id: date_received, from: zahlungsaufforderung, priority: CRITICAL}
      - {id: payment_deadline_date, from: zahlungsaufforderung, priority: CRITICAL}
      - {id: amount_owed, from: zahlungsaufforderung, priority: HIGH}
      - {id: termination_threat_explicit, from: zahlungsaufforderung, priority: HIGH}
      - {id: family_dwelling_separate_notice, from: zahlungsaufforderung, priority: NORMAL}
      - {id: monthly_rent, from: mietvertrag, priority: NORMAL}
    deadline: {signal: deadline_payment_257d, days: null, from: payment_deadline_date, note: "Frist laut Schreiben; Zahlung innert Frist verhindert die Kuendigung nach Art. 257d."}
    default_action: ESCALATE
    urgency: HIGH
    referrals:
      primary: [sozialdienst_gemeinde, schuldenberatung]
      conditional:
        - {when: {signal: legal_deadline_risk}, add: [mieterverband], urgency: CRITICAL}
        - {when: {signal: amount_disputed}, add: [mieterverband, schlichtungsbehoerde_miete]}
        - {when: {signal: low_income}, add: [caritas, frauenzentrale_kantonal]}
    reason_for_referral: "Noch keine Kuendigung: Wohnung kann durch fristgerechte Zahlung gesichert werden. Finanzierung (Sozialdienst, Caritas) hat Vorrang."

  - issue_id: CH_TENANCY_TERMINATION_ARREARS
    label: "Kuendigung wegen Zahlungsverzug"
    legal_basis: ["Art. 257d Abs. 2 OR", "Art. 272a Abs. 1 lit. a OR (keine Erstreckung)", "Art. 273 OR"]
    documents_required: [kuendigungsformular, zahlungsaufforderung, mietvertrag]
    extract:
      - {id: date_received, from: kuendigungsformular, priority: CRITICAL}
      - {id: termination_date, from: kuendigungsformular, priority: CRITICAL}
      - {id: official_form_used, from: kuendigungsformular, priority: CRITICAL}
      - {id: payment_deadline_date, from: zahlungsaufforderung, priority: HIGH, why: "War die Zahlungsfrist korrekt angesetzt und abgelaufen?"}
      - {id: amount_owed, from: zahlungsaufforderung, priority: HIGH}
      - {id: paid_within_deadline, from: user, priority: HIGH}
    deadline: {signal: deadline_contest_termination_30d, days: 30, from: date_received, authority: schlichtungsbehoerde_miete}
    default_action: ESCALATE
    urgency: CRITICAL
    referrals:
      primary: [schlichtungsbehoerde_miete, sozialdienst_gemeinde]
      conditional:
        - {when: {signal: legal_deadline_risk}, add: [tenancy_lawyer]}
        - {when: {signal: children_in_household}, add: [sozialdienst_gemeinde], note: "Wohnungssuche/Notunterkunft fuer Familie"}
        - {when: {signal: debt}, add: [schuldenberatung]}
    reason_for_referral: "Erstreckung ausgeschlossen, Ausweisung droht rasch. Formelle Voraussetzungen von Art. 257d OR durch Fachperson pruefen lassen."

  - issue_id: CH_TENANCY_EXTENSION
    label: "Erstreckung des Mietverhaeltnisses"
    legal_basis: ["Art. 272 OR", "Art. 272a OR (Ausschluss)", "Art. 272b OR (max. 4 Jahre Wohnraum)", "Art. 273 Abs. 2 OR"]
    documents_required: [kuendigungsformular, mietvertrag]
    documents_optional: [nachweis_wohnungssuche, haushaltsnachweis]
    extract:
      - {id: date_received, from: kuendigungsformular, priority: CRITICAL}
      - {id: lease_type, from: mietvertrag, priority: HIGH, why: "Unbefristet: 30 Tage ab Empfang; befristet: spaetestens 60 Tage vor Ablauf (Art. 273 Abs. 2 OR)"}
      - {id: lease_end_date, from: mietvertrag, priority: HIGH}
      - {id: household_size, from: user, priority: HIGH}
      - {id: children_in_household, from: user, priority: HIGH}
      - {id: housing_search_efforts, from: user, priority: NORMAL}
      - {id: termination_reason_arrears, from: kuendigungsformular, priority: HIGH, why: "Bei Zahlungsverzug keine Erstreckung (Art. 272a OR)"}
    deadline: {signal: deadline_extension_request, days: 30, from: date_received, authority: schlichtungsbehoerde_miete}
    default_action: ESCALATE
    urgency: HIGH
    referrals:
      primary: [schlichtungsbehoerde_miete, mieterverband]
      conditional:
        - {when: {signal: children_in_household}, add: [sozialdienst_gemeinde]}
        - {when: {signal: disability}, add: [behinderung]}
        - {when: {signal: low_income}, add: [frauenzentrale_kantonal]}
    reason_for_referral: "Haerteabwaegung (Familie, Kinder, Wohnungsmarkt) ist eine Einzelfallwertung und gehoert zu einer Fachperson."

  - issue_id: CH_TENANCY_DEFECTS
    label: "Maengel an der Wohnung"
    legal_basis: ["Art. 259a ff. OR", "Art. 259g-259i OR (Hinterlegung)"]
    documents_required: [mietvertrag]
    documents_optional: [fotos_mangel, maengelruege, korrespondenz_vermieter, arztzeugnis]
    extract:
      - {id: defect_type, from: user, priority: HIGH}
      - {id: defect_since, from: user, priority: HIGH}
      - {id: landlord_notified_in_writing, from: korrespondenz_vermieter, priority: CRITICAL}
      - {id: rent_deposited, from: user, priority: HIGH, why: "Hinterlegung: innert 30 Tagen nach Faelligkeit Schlichtungsbehoerde anrufen (Art. 259h OR)"}
      - {id: health_impact, from: user, priority: HIGH}
    deadline: {signal: deadline_deposit_259h, days: 30, from: first_deposited_rent_due, applies_if: {fact: rent_deposited, operator: eq, value: true}}
    default_action: PROCEED          # Erstinformation moeglich; Eskalation bei Gesundheit/Hinterlegung
    urgency: NORMAL
    referrals:
      primary: [mieterverband]
      conditional:
        - {when: {signal: health_risk}, add: [schlichtungsbehoerde_miete], action: ESCALATE, urgency: HIGH, note: "z.B. Schimmel mit Kindern, keine Heizung im Winter"}
        - {when: {signal: rent_deposit_started}, add: [schlichtungsbehoerde_miete], action: ESCALATE, urgency: HIGH}
        - {when: {signal: children_in_household}, add: [], urgency: HIGH}
    reason_for_referral: "Rechte haengen von schriftlicher Maengelruege ab; Mietzinshinterlegung ist fristgebunden und riskant ohne Begleitung."

  - issue_id: CH_TENANCY_EVICTION
    label: "Ausweisung / Raeumung"
    legal_basis: ["Art. 257 ZPO (Rechtsschutz in klaren Faellen)", "kantonales Vollstreckungsrecht"]
    documents_required: [gerichtsurkunde]
    documents_optional: [raeumungsbefehl, kuendigungsformular]
    extract:
      - {id: date_received, from: gerichtsurkunde, priority: CRITICAL}
      - {id: eviction_date, from: raeumungsbefehl, priority: CRITICAL}
      - {id: court_name, from: gerichtsurkunde, priority: HIGH}
      - {id: decision_or_summons, from: gerichtsurkunde, priority: CRITICAL, why: "Vorladung oder Entscheid? Rechtsmittelfristen im summarischen Verfahren kurz, keine Gerichtsferien (Art. 145 Abs. 2 ZPO)"}
    deadline: {signal: deadline_summary_procedure, days: 10, from: date_received, note: "Nur Warnsignal; Frist laut Rechtsmittelbelehrung pruefen."}
    default_action: ESCALATE
    urgency: CRITICAL
    referrals:
      primary: [tenancy_lawyer, sozialdienst_gemeinde]
      conditional:
        - {when: {signal: imminent_housing_loss}, add: [sozialdienst_gemeinde], note: "Notunterkunft organisieren"}
        - {when: {signal: children_in_household}, add: [kesb], note: "Nur Information/Unterstuetzung, keine Gefaehrdungsmeldung ohne Anlass"}
        - {when: {signal: low_income}, add: [unentgeltliche_rechtsauskunft]}
    reason_for_referral: "Gerichtsverfahren laeuft oder ist abgeschlossen; Obdachlosigkeit droht. Immer menschliche Bearbeitung."

  - issue_id: CH_TENANCY_RENT_INCREASE
    label: "Mietzinserhoehung"
    legal_basis: ["Art. 269d OR (amtliches Formular, Begruendung, Mitteilung mind. 10 Tage vor Kuendigungsfrist)", "Art. 270b OR"]
    documents_required: [formular_mietzinserhoehung, mietvertrag]
    extract:
      - {id: date_received, from: formular_mietzinserhoehung, priority: CRITICAL}
      - {id: effective_date, from: formular_mietzinserhoehung, priority: HIGH}
      - {id: old_rent, from: mietvertrag, priority: HIGH}
      - {id: new_rent, from: formular_mietzinserhoehung, priority: HIGH}
      - {id: official_form_used, from: formular_mietzinserhoehung, priority: CRITICAL}
      - {id: reason_stated, from: formular_mietzinserhoehung, priority: HIGH}
    deadline: {signal: deadline_contest_rent_increase_30d, days: 30, from: date_received, authority: schlichtungsbehoerde_miete}
    default_action: ESCALATE
    urgency: HIGH
    referrals:
      primary: [mieterverband, schlichtungsbehoerde_miete]
      conditional:
        - {when: {signal: rent_unaffordable}, add: [sozialdienst_gemeinde, frauenzentrale_kantonal]}
    reason_for_referral: "Anfechtung nur innert 30 Tagen; Missbraeuchlichkeit (Referenzzins, Kosten) braucht Berechnung durch Fachperson."

  - issue_id: CH_TENANCY_DEPOSIT
    label: "Mietkaution wird nicht zurueckbezahlt"
    legal_basis: ["Art. 257e OR"]
    documents_required: [mietvertrag, kautionsnachweis]
    documents_optional: [abnahmeprotokoll, korrespondenz_vermieter]
    extract:
      - {id: deposit_amount, from: kautionsnachweis, priority: HIGH}
      - {id: deposit_bank_account_in_tenant_name, from: kautionsnachweis, priority: HIGH}
      - {id: lease_end_date, from: mietvertrag, priority: CRITICAL, why: "Ohne Rechtsverfahren/Betreibung des Vermieters innert 1 Jahr kann Rueckzahlung direkt bei der Bank verlangt werden (Art. 257e Abs. 3 OR)"}
      - {id: landlord_claims_damage, from: korrespondenz_vermieter, priority: HIGH}
      - {id: handover_protocol_signed, from: abnahmeprotokoll, priority: NORMAL}
    deadline: null
    default_action: PROCEED
    urgency: LOW
    referrals:
      primary: [mieterverband]
      conditional:
        - {when: {signal: landlord_claims_damage}, add: [schlichtungsbehoerde_miete], action: ESCALATE, urgency: NORMAL}
        - {when: {signal: debt}, add: [schuldenberatung]}
    reason_for_referral: "Meist Information ausreichend; bei Streit ueber Schaeden Schlichtungsbehoerde."

# ---------------------------------------------------------------------------
# 4. SICHERHEITS-ROUTING (Kategorien aus safety_keywords.yaml)
#    Gilt fuer JEDEN Falltyp und ueberschreibt default_action, wenn strenger.
# ---------------------------------------------------------------------------
safety_routing:
  - category: ACUTE_SELF_HARM
    action: IMMEDIATE_SAFETY_RESPONSE
    notify_caseworker: immediate
    show_to_user: [ambulance_144, dargebotene_hand_143, pro_juventute_147]
    referrals: []
    follow_up_referrals: [selbsthilfe]          # erst nach Stabilisierung, durch Sachbearbeitung
    briefing_flag: "AKUTE SELBSTGEFAEHRDUNG GEMELDET - Kontaktaufnahme vor jeder Rechtsfrage"
  - category: ACUTE_DANGER_VIOLENCE
    action: IMMEDIATE_SAFETY_RESPONSE
    notify_caseworker: immediate
    show_to_user: [police_117, opferhilfe_142]
    referrals: [opferhilfe_kantonal]
    briefing_flag: "AKUTE GEFAHR / GEWALT GEMELDET"
  - category: DOMESTIC_VIOLENCE
    action: ESCALATE
    notify_caseworker: immediate
    show_to_user: [opferhilfe_142, police_117]
    referrals: [opferhilfe_kantonal, frauenzentrale_kantonal]
    conditional:
      - {when: {signal: needs_shelter}, add: [frauenhaus]}
      - {when: {signal: migration_status}, add: [fiz_zuerich, asylex]}    # Brava nimmt derzeit keine neuen Anfragen an
      - {when: {signal: injuries_recent}, add: [forensic_nurses_zh], note: "nur ZH; Spurensicherung ohne Anzeige"}
    briefing_flag: "Haeusliche Gewalt - Mietsache ggf. zweitrangig; Schutzmassnahmen (Art. 28b ZGB) pruefen"
  - category: SEXUAL_VIOLENCE_HARASSMENT
    action: ESCALATE
    notify_caseworker: immediate
    show_to_user: [opferhilfe_142]
    referrals: [opferhilfe_kantonal, frauenzentrale_kantonal]
    conditional:
      - {when: {signal: migration_status}, add: [fiz_zuerich]}
      - {when: {signal: injuries_recent}, add: [forensic_nurses_zh]}
    briefing_flag: "Sexuelle Gewalt / Belaestigung gemeldet"
  - category: CHILD_ENDANGERMENT
    action: ESCALATE
    notify_caseworker: immediate
    show_to_user: [pro_juventute_147, police_117]
    referrals: [kesb, opferhilfe_kantonal]
    conditional:
      - {when: {signal: minor_is_user}, add: [kokon_zuerich], note: "nur ZH; 24h, auch anonym"}
    briefing_flag: "Moegliche Kindesgefaehrdung - Abklaerung Gefaehrdungsmeldung durch Fachperson"
  - category: EXPLOITATION_TRAFFICKING
    action: ESCALATE
    notify_caseworker: immediate
    show_to_user: [opferhilfe_142, police_117]
    referrals: [opferhilfe_kantonal, fiz_zuerich, asylex]
    briefing_flag: "Hinweise auf Ausbeutung / Menschenhandel"
  - category: MENTAL_HEALTH_CRISIS
    action: ESCALATE
    notify_caseworker: immediate
    show_to_user: [dargebotene_hand_143]
    referrals: []
    follow_up_referrals: [selbsthilfe]
    briefing_flag: "Psychische Krise - Gespraech vor Fristentscheid; Fristen ggf. stellvertretend wahren"
  - category: MENTAL_HEALTH_VULNERABILITY
    action: FLAG
    notify_caseworker: with_briefing
    referrals: []
    follow_up_referrals: [selbsthilfe, pro_infirmis]
    briefing_flag: "Vulnerabilitaet (psychische Gesundheit) - einfache Sprache, mehr Begleitung"
  - category: EXISTENTIAL_EMERGENCY
    action: ESCALATE
    notify_caseworker: immediate
    referrals: [sozialdienst_gemeinde, notunterkunft, caritas]
    conditional:
      - {when: {signal: migration_status}, add: [migrationsberatung]}
      - {when: {signal: receives_social_assistance}, add: [sozialhilferecht]}
      - {when: {signal: debt}, add: [schuldenberatung]}
    briefing_flag: "Existenzielle Notlage (Wohnung/Nahrung/Energie)"

# ---------------------------------------------------------------------------
# 5. QUERSCHNITTS-SIGNALE (unabhaengig vom Falltyp, ergaenzen die Verweisung)
# ---------------------------------------------------------------------------
cross_cutting:
  - {signal: migration_status, description: "Aufenthaltsstatus betroffen (N, F, B abhaengig von Sozialhilfe)", add: [migrationsberatung, asyl_rechtsvertretung], urgency: HIGH,
     note: "Sozialhilfebezug kann aufenthaltsrechtliche Folgen haben - nie ohne Fachperson zu Sozialhilfe raten."}
  - {signal: disability, add: [behinderung], urgency: NORMAL}
  - {signal: debt, add: [schuldenberatung], urgency: NORMAL}
  - {signal: low_income, add: [frauenzentrale_kantonal, unentgeltliche_rechtsauskunft], urgency: NORMAL}
  - {signal: conflict_with_public_body, add: [ombudsstelle], urgency: NORMAL}
  - {signal: language_barrier, add: [migrationsberatung], urgency: NORMAL, note: "Mehrsprachige Beratung, z.B. Solidaritaetshaus SG"}
  - {signal: systemic_human_rights_issue, add: [amnesty_lawyers_group], urgency: LOW, note: "Nur Sachbearbeitung entscheidet."}

# ---------------------------------------------------------------------------
# 6. BAUSTEIN FUER DIE ZUSAMMENFASSUNG (expert_briefing_v1, Abschnitt
#    recommended_professionals + decision_and_reasons)
# ---------------------------------------------------------------------------
briefing:
  section_id: recommended_professionals
  render: |
    VERWEISUNG
    Entscheid: {action} | Dringlichkeit: {urgency}
    Sicherheitshinweise: {safety_flags | "keine"}
    Frist (nicht verbindlich berechnet): {deadline_signal} - Beginn {deadline_from_value} - zustaendig {deadline_authority}
    Primaere Stelle(n): {primary_referrals}
    Zusaetzlich wegen: {conditional_reasons}   # z.B. "Kinder im Haushalt -> Sozialdienst"
    Begruendung: {reason_for_referral}
    Fehlende Unterlagen: {missing_documents}
    Ungeprueft (verified: false): {unverified_referrals}
  rules:
    - "Jede Verweisung nennt die ausloesende Regel (rule_id) und das Signal - fuer das Audit-Log."
    - "Stellen mit verified: false werden im Briefing markiert und nicht direkt an die rechtsuchende Person ausgegeben."
    - "Stellen mit active: false (z.B. Aufnahmestopp) werden nicht zugewiesen; die Engine nimmt die naechste passende Stelle."
    - "Kontaktangaben mit contact_source: secondary vor produktivem Einsatz auf der Website der Stelle bestaetigen (last_checked)."
    - "Schutzadressen (Frauenhaeuser) werden nie ausgegeben, nur Telefonnummern."
    - "Sicherheitskategorien stehen im Briefing immer zuoberst, vor der Rechtsfrage."
    - "Weitergabe von Daten an eine Stelle nur mit Einwilligung der Person (besonders schuetzenswerte Daten, Art. 5 lit. c und Art. 6 Abs. 7 nDSG)."
