  "ZH:Aeugst am Albis": {bfs: 1, bezirk: "Affoltern", region: "Knonaueramt", schlichtungsbehoerde_miete: schlichtungsbehoerde_miete_affoltern, unentgeltliche_rechtsauskunft: [rechtsauskunft_bg_affoltern, unentgeltliche_rechtsauskunft_zav], sozialdienst_gemeinde: ika_sozialdienst_bezirk_affoltern, sozialdienst_status: traeger_verified_contact_open, notunterkunft: ika_sozialdienst_bezirk_affoltern, kesb: kesb_bezirk_affoltern, kjz: kjz_affoltern, mieterverband: mieterverband_zh, opferhilfe_kantonal: opferberatung_zuerich, frauenhaus: frauenhaus_violetta, frauenzentrale_kantonal: frauenzentrale_zuerich, ombudsstelle: ombudsstelle_kanton_zuerich}
