# knowledge_base/referrals/referral_rules.yaml
# Verweisungsregeln: welcher Falltyp / welches Warnsignal fuehrt zu welcher Anlaufstelle.
# Wird von der Regel-Engine gelesen; der Abschnitt "briefing" fliesst in die Zusammenfassung
# fuer die Sachbearbeiterin / den Sachbearbeiter.
#
# Version 1.2 (07.11.2026): Kanton Zürich flächendeckend
#   - Neu Abschnitt 1b "municipalities": alle 160 Gemeinden mit Bezirk und zuständigen Stellen
#     (Schlichtungsbehörde, Rechtsauskunft, Sozialdienst, KESB, kjz, Opferberatung, Frauenhaus, Mieterverband, Ombudsstelle).
#   - Neu: 12 Schlichtungsbehörden / Bezirksgerichte, 11 Rechtsauskünfte der Bezirksgerichte, 13 KESB, 14 kjz,
#     regionale Rechtsauskünfte (Bülach, Dübendorf, Horgen, Zürcher Oberland), Soziale Dienste Winterthur,
#     IKA Sozialdienst Bezirk Affoltern, Kantonales Sozialamt.
#   - Alle ZH-Kontakte gegen die offiziellen Websites geprüft (contact_source: primary), wo die Seite lesbar war.
#     Korrekturen gegenüber v1.1 sind im jeweiligen Eintrag kommentiert (z.B. Mieterverband neue Adressen,
#     KESB Stadt Zürich Telefon, fiera statt Frauen-Nottelefon, Telefon Schlichtungsbehörde Zürich entfernt).
#   - ZH-Einträge ab v1.2 mit UTF-8-Umlauten; übrige Abschnitte unverändert (ASCII).
# Version 1.1 (07.11.2026): Kontaktangaben fuer den Kanton Zuerich ergaenzt
#   (Adresse, Telefon, E-Mail, Web, Oeffnungszeiten, Kosten, Zugang, wo oeffentlich: zustaendige Person).
#   Stellen ausserhalb ZH sind unveraendert und ohne Kontaktrecherche.
#
# Konventionen (wie in der Arbeitsvorlage):
#   Aktionen:   ASK | PROCEED | ESCALATE | IMMEDIATE_SAFETY_RESPONSE   (strengste gewinnt)
#   Prioritaet: CRITICAL | HIGH | NORMAL | LOW
#   Unbekannt bleibt null und wird nicht geraten.
#   Alle signal-IDs muessen in signals.yaml, alle org-IDs in diesem File existieren.
#
# Kontakt-Qualitaet (Feld contact_source):
#   primary    = auf der offiziellen Website der Stelle geprueft (Datum in last_checked)
#   secondary  = aus einem Fachverzeichnis (z.B. Heilsarmee Sozialberatung Zuerich, Stand 2026),
#                weil die offizielle Seite nicht maschinell lesbar war;
#                vor produktivem Einsatz auf der Website der Stelle bestaetigen
#   none       = noch nicht recherchiert
# verified: true  = Angebot und Zustaendigkeit belegt; false = vom Law-Team zu pruefen.
# Personen werden nur genannt, wenn sie eine oeffentliche Funktion haben und auf der
# offiziellen Website stehen. Fuer die Kontaktaufnahme gilt immer die Stelle, nicht die Person.

version: "1.2"
last_reviewed: "2026-11-07"
reviewed_by: null

# ---------------------------------------------------------------------------
# 1. AUFLOESUNG VON ROLLEN
#    Regeln verweisen auf ROLLEN. Die Engine sucht in dieser Reihenfolge:
#      "KANTON:Gemeinde"  ->  "KANTON"  ->  default
#    Ist der Rollenname zugleich die ID einer Stelle (z.B. schlichtungsbehoerde_miete),
#    ist diese generische Stelle der Default. Kein Kanton bekannt -> ASK canton.
# ---------------------------------------------------------------------------
role_resolution:
  schlichtungsbehoerde_miete:
    "ZH:Zürich": schlichtungsbehoerde_miete_bezirk_zuerich
    ZH: schlichtungsbehoerde_miete_zh_verzeichnis      # nur falls Gemeinde unbekannt; sonst municipalities
    default: schlichtungsbehoerde_miete
  mieterverband:
    "ZH:Winterthur": mieterverband_zh_winterthur
    ZH: mieterverband_zh
    default: mieterverband
  unentgeltliche_rechtsauskunft:
    "ZH:Zürich": rechtsauskunft_miete_bezirksgericht_zuerich
    ZH: unentgeltliche_rechtsauskunft_zav
    default: unentgeltliche_rechtsauskunft
  sozialdienst_gemeinde:
    "ZH:Zürich": sozialzentren_stadt_zuerich
    "ZH:Winterthur": soziale_dienste_winterthur
    ZH: sozialdienst_gemeinde_zh
    default: sozialdienst_gemeinde
  notunterkunft:
    "ZH:Zürich": wohnen_obdach_stadt_zuerich
    "ZH:Winterthur": durchgangsheim_anker_winterthur
    ZH: sozialdienst_gemeinde_zh
    default: sozialdienst_gemeinde
  kesb:
    "ZH:Zürich": kesb_stadt_zuerich
    "ZH:Winterthur": kesb_winterthur_andelfingen
    default: kesb                       # übrige ZH-Gemeinden: municipalities.*.kesb
  kjz:                                  # Kinder- und Jugendhilfe (Familien mit Kindern)
    "ZH:Zürich": sozialzentren_stadt_zuerich
    default: null                       # ZH: municipalities.*.kjz; andere Kantone: nicht hinterlegt
  frauenzentrale_kantonal:
    AG: frauenzentrale_aargau
    BL: frauenplus_baselland
    BE: frauenzentrale_bern
    GL: frauenzentrale_glarus
    SG: frauenzentrale_st_gallen
    GR: frauenzentrale_graubuenden
    LU: frauenzentrale_luzern
    "ZH:Winterthur": frauenzentrale_winterthur
    ZH: frauenzentrale_zuerich
    ZG: eff_zett
    default: null                       # kein Partner im Kanton -> Sozialdienst Gemeinde
  opferhilfe_kantonal:                  # Beratung zuerst; Entschaedigung ist eine eigene Stelle
    "ZH:Winterthur": frauen_nottelefon_winterthur     # heute fiera Opferberatung Winterthur
    ZH: opferberatung_zuerich
    ZG: eff_zett
    default: opferhilfe_142             # nationale Nummer leitet an kantonale Stelle weiter
  frauenhaus:
    "ZH:Winterthur": frauenhaus_winterthur
    ZH: frauenhaus_violetta
    default: opferhilfe_142
  schuldenberatung:
    ZH: schuldenberatung_kanton_zuerich
    BE: berner_schuldenberatung
    ZG: eff_zett
    default: caritas
  selbsthilfe:
    BE: selbsthilfe_be
    SO: selbsthilfe_solothurn
    ZG: eff_zett
    default: null
  migrationsberatung:
    ZH: zba_heks_caritas_zuerich
    SG: solidaritaetshaus_st_gallen
    default: heks
  asyl_rechtsvertretung:
    ZH: freiplatzaktion_zuerich
    default: asylex
  ombudsstelle:                         # nur Konflikte mit Behoerden, nicht mit Privaten
    "ZH:Zürich": ombudsstelle_stadt_zuerich     # bei Stadtverwaltung; bei Kanton -> ombudsstelle_kanton_zuerich
    "ZH:Winterthur": ombudsstelle_winterthur
    ZH: ombudsstelle_kanton_zuerich
    SH: ombudsstelle_schaffhausen
    default: null
  sozialhilferecht:
    ZH: ufs_sozialhilferecht
    default: unentgeltliche_rechtsauskunft
  behinderung:
    ZH: pro_infirmis_zuerich
    default: pro_infirmis


# ---------------------------------------------------------------------------
# 1b. GEMEINDEN DES KANTONS ZÜRICH (160 politische Gemeinden, Stand OGD 28.08.2025;
#     laut Kanton seit der Fusion Andelfingen/Adlikon/Humlikon 2023 unverändert, Juli 2026)
#     Je Gemeinde die zuständigen Stellen pro Rolle. Die Engine liest hier ZUERST:
#       municipalities["ZH:<Gemeinde>"].<rolle>  ->  role_resolution "ZH:<Gemeinde>"  ->  "ZH"  ->  default
#     Listenwerte (z.B. unentgeltliche_rechtsauskunft): alle anzeigen, erster Eintrag = Standard.
#     Herkunft der Zuordnung:
#       bezirk, region ............ Statistisches Amt ZH, Gemeindezuweisungen (amtlich)
#       schlichtungsbehoerde_miete  Bezirksgericht des Bezirks (GOG § 63 f.)                 -> amtlich
#       kesb ...................... kpv-zh.ch Standortseiten (13 KESB)                       -> geprüft
#       kjz ....................... ABGELEITET aus Bezirk/KESB-Kreis (Kanton publiziert nur PLZ-Suche)
#       sozialdienst_gemeinde ..... siehe sozialdienst_status:
#                                   verified = Stelle und Kontakt geprüft
#                                   traeger_verified_contact_open = Trägerschaft belegt, Kontakt offen
#                                   to_verify = Platzhalter sozialdienst_gemeinde_zh; Gemeinde-Sozialdienst
#                                               noch einzeln zu prüfen (Arbeitsliste: gemeinden_pruefliste.csv)
#       mieterverband, opferhilfe_kantonal, frauenhaus: kantonsweite Stellen; Winterthur/Andelfingen
#                                   der Nähe wegen den Winterthurer Stellen zugeordnet (Annahme)
#     Ortsteile (z.B. Glattbrugg -> Opfikon, Effretikon -> Illnau-Effretikon) muss die Engine
#     über die PLZ auf die politische Gemeinde abbilden.
# ---------------------------------------------------------------------------
