kombi_trigger:   # Treffer nur, wenn aus JEDER Gruppe mindestens ein Begriff vorkommt
  - id: KOMBI_5_ZAHLUNGSSTOPP
    stufe: rot
    beschreibung: Mangel + Miete zurückbehalten ohne Hinterlegung (Art. 259g OR) → Zahlungsverzug, Kündigung nach Art. 257d droht
    wenn_alle:
      gruppe_1:
        - schimmel*
        - mangel
        - mängel
        - heizung
        - wasserschaden
        - feucht*
      gruppe_2:
        - zahle nicht
        - zahle keine
        - keine miete
        - nicht mehr bezahlt
        - zurückbehalten
        - zurückbehalte
        - miete gekürzt
        - kürze die miete
    ausser:
      - hinterlegt
      - hinterlege*
      - hinterlegung

  - id: KOMBI_1_RACHE
    stufe: rot
    beschreibung: Kündigung nach Geltendmachung von Ansprüchen → Verdacht Rachekündigung (Art. 271a Abs. 1 lit. a OR)
    wenn_alle:
      gruppe_1:
        - kündig*
        - gekündigt
      gruppe_2:
        - mängel gemeldet
        - mangel gemeldet
        - beschwert
        - beschwerde
        - mieterverband
        - senkung
        - herabsetzung
        - schlichtung*
    ausser: []   # keine Ausnahme

  - id: KOMBI_3_VERZUG
    stufe: rot
    beschreibung: Kündigung + Zahlungsrückstand → Erstreckung ausgeschlossen (Art. 272a OR), Räumung droht
    wenn_alle:
      gruppe_1:
        - kündig*
        - gekündigt
      gruppe_2:
        - zahlungsrückstand*
        - zahlungsverzug*
        - mietrückstand*
        - rückstand*
        - nicht bezahlt
    ausser: []   # keine Ausnahme

  - id: KOMBI_HAERTE
    stufe: rot
    beschreibung: Kündigung/Erstreckung + besondere Härte → Interessenabwägung (Art. 272 OR) braucht menschliches Urteil
    wenn_alle:
      gruppe_1:
        - kündig*
        - gekündigt
        - erstreckung*
      gruppe_2:
        - kind*
        - chind*
        - krank*
        - schwanger*
        - behindert*
        - rentner*
    ausser: []   # keine Ausnahme

  - id: KOMBI_DIENSTWOHNUNG
    stufe: rot
    beschreibung: Kündigung im Zusammenhang mit Arbeitsverhältnis → Mischfall Arbeitsrecht
    wenn_alle:
      gruppe_1:
        - kündig*
        - gekündigt
      gruppe_2:
        - arbeitgeber*
        - dienstwohnung
        - hauswart*
    ausser: []   # keine Ausnahme

  - id: KOMBI_5_GESUNDHEIT
    stufe: orange
    beschreibung: Schimmel + gesundheitlich verletzliche Person
    wenn_alle:
      gruppe_1:
        - schimmel*
      gruppe_2:
        - kind*
        - baby
        - asthma
        - schwanger*
    ausser: []   # keine Ausnahme

