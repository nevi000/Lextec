# =====================================================================
# Mietrecht-Triage – Keyword-Konfiguration
# ---------------------------------------------------------------------
# Stufen (Ampel):  gruen < orange < rot < notfall
#   - Ampel startet bei gruen und kann nur hochspringen, nie zurück.
#   - notfall bricht den Durchlauf ab (Notfallnummern anzeigen).
# Schreibweise der Begriffe:
#   - "räum*"      -> Wortanfang + beliebige Endung (Räumung, räumen …)
#   - "keine miete" -> ganze Phrase
#   - Gross-/Kleinschreibung egal
# trigger:        Einzel-Keywords, geprüft in jeder neuen Nachricht
# kombi_trigger:  alle Gruppen in "wenn_alle" müssen irgendwo im
#                 Gesprächsverlauf vorkommen; "ausser" hebt den Treffer auf
# issues:         nur zur Zuordnung des Rechtsproblems, keine Eskalation
# =====================================================================

frist_schwelle_tage: 7

formular_marker:
  - rechtsbelehrung
  - auszug aus dem obligationenrecht
  - bestimmungen des obligationenrechts
  - wichtige hinweise für den mieter

