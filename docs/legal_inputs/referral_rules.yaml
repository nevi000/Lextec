# knowledge_base/referrals/referral_rules.yaml
# Verweisungsregeln: welcher Falltyp / welches Warnsignal fuehrt zu welcher Anlaufstelle.
# Wird von der Regel-Engine gelesen; der Abschnitt "briefing" fliesst in die Zusammenfassung
# fuer die Sachbearbeiterin / den Sachbearbeiter.
#
# Konventionen (wie in der Arbeitsvorlage):
#   Aktionen:   ASK | PROCEED | ESCALATE | IMMEDIATE_SAFETY_RESPONSE   (strengste gewinnt)
#   Prioritaet: CRITICAL | HIGH | NORMAL | LOW
#   Unbekannt bleibt null und wird nicht geraten.
#   Alle signal-IDs muessen in signals.yaml, alle org-IDs in diesem File existieren.
#   verified: false  = vom Law-Team vor Einsatz zu pruefen (Angebot, Region, Kontakt).

version: "1.0"
last_reviewed: null
reviewed_by: null

# ---------------------------------------------------------------------------
# 1. AUFLOESUNG NACH KANTON
#    Regeln verweisen auf ROLLEN (z.B. frauenzentrale_kantonal). Die Engine setzt
#    anhand des Fakts "canton" die konkrete Stelle ein. Kein Kanton bekannt -> ASK canton.
# ---------------------------------------------------------------------------
role_resolution:
  frauenzentrale_kantonal:
    AG: frauenzentrale_aargau
    BL: frauenplus_baselland
    BE: frauenzentrale_bern
    GL: frauenzentrale_glarus
    SG: frauenzentrale_st_gallen
    GR: frauenzentrale_graubuenden
    LU: frauenzentrale_luzern
    ZH: frauenzentrale_zuerich          # Region Winterthur: frauenzentrale_winterthur
    ZG: eff_zett
    default: null                       # kein Partner im Kanton -> Sozialdienst Gemeinde
  opferhilfe_kantonal:
    ZH: opferhilfe_zuerich
    ZG: eff_zett
    default: opferhilfe_142             # nationale Nummer leitet an kantonale Stelle weiter
  schuldenberatung:
    BE: berner_schuldenberatung
    ZG: eff_zett
    default: caritas
  selbsthilfe:
    BE: selbsthilfe_be
    SO: selbsthilfe_solothurn
    ZG: eff_zett
    default: null
  migrationsberatung:
    SG: solidaritaetshaus_st_gallen
    default: heks
  ombudsstelle:
    SH: ombudsstelle_schaffhausen
    default: null                       # nur fuer Konflikte mit Behoerden, nicht mit Privaten

